# Backtest (docs/SPEC.md §2.5) with the repo's CFBD key — the honesty gate
# for model changes: the calibration report in the logs decides whether
# projected totals (and future model tweaks) ship. ~10 CFBD calls per run.
# Runs automatically on PRs that touch the model or replay so no calibration
# regression lands unseen, and on demand via workflow_dispatch.

name: backtest

on:
  workflow_dispatch:
    inputs:
      tune:
        description: "Also grid-search K/HFA and fit sigma"
        type: boolean
        default: false
      experiment:
        description: "Run one tuner instead of the report"
        type: choice
        default: none
        options:
          # The step below runs `--$EXPERIMENT` verbatim, so this list is
          # purely discoverability — and it had drifted: four tuners that exist
          # in backtest.ts were missing from it and could only be reached by
          # editing the workflow. Added 2026-08-13 along with tune-fcs. Keep it
          # in sync with the flags in backtest.ts's usage header.
          - none
          - tune-sigma
          - tune-preseason-tilts
          - tune-coaching
          - tune-anchors
          - tune-sp-blend
          - tune-prior
          - tune-churn
          - tune-epa
          - tune-ensemble
          - tune-hfa
          - tune-fcs
          - diagnose-tiers
          - tune-tier-recenter
  pull_request:
    paths:
      - "src/model/**"
      - "scripts/backtest.ts"
      - "scripts/lib/replay.ts"
      - "scripts/lib/coaching.ts"
      - ".github/workflows/backtest.yml"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The full report — including the 03:M-3 signed-error-by-slice tables —
      # lands in the job summary, so a directional lean is one click away on
      # every model PR instead of buried in a log nobody expands.
      - name: Run backtest
        run: |
          EXPERIMENT="${{ inputs.experiment || 'none' }}"
          if [ "$EXPERIMENT" != "none" ] && [ -n "$EXPERIMENT" ]; then
            npx tsx scripts/backtest.ts "--$EXPERIMENT" | tee backtest.log
          elif [ "${{ inputs.tune || 'false' }}" = "true" ]; then
            npx tsx scripts/backtest.ts --tune | tee backtest.log
          else
            npx tsx scripts/backtest.ts | tee backtest.log
          fi
          { echo '```'; cat backtest.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # The edge gate runs on every model PR: if a change ever makes the model
      # carry information the closing line lacks, this is where it shows up.
      # Informational — it must not fail the build.
      - name: Diagnose edges
        run: npx tsx scripts/backtest.ts --diagnose-edges || echo "!! diagnose-edges FAILED"

