# Backtest (docs/SPEC.md §2.5) with the repo's CFBD key — the honesty gate
# for model changes: the calibration report in the logs decides whether
# projected totals (and future model tweaks) ship. ~10 CFBD calls per run.
# Runs automatically on PRs that touch the model or replay so no calibration
# regression lands unseen, and on demand via workflow_dispatch.

name: backtest

on:
  workflow_dispatch:
    inputs:
      tune:
        description: "Also grid-search K/HFA and fit sigma"
        type: boolean
        default: false
      experiment:
        description: "Run one tuner instead of the report"
        type: choice
        default: none
        options:
          # The step below runs `--$EXPERIMENT` verbatim, so this list is
          # purely discoverability — and it had drifted: four tuners that exist
          # in backtest.ts were missing from it and could only be reached by
          # editing the workflow. Added 2026-08-13 along with tune-fcs. Keep it
          # in sync with the flags in backtest.ts's usage header.
          - none
          - tune-sigma
          - tune-preseason-tilts
          - tune-coaching
          - tune-anchors
          - tune-sp-blend
          - tune-prior
          - tune-churn
          - tune-epa
          - tune-ensemble
          - tune-hfa
          - tune-fcs
          - tune-team-hfa
          - diagnose-tiers
          - tune-tier-recenter
      seasons:
        description: "Season window, e.g. 2015-2025 or 2023-2025 (blank = the default wide window)"
        type: string
        default: ""
      covid:
        description: "What happens to 2020 — chain (default), score, or drop"
        type: choice
        default: chain
        options:
          - chain
          - score
          - drop
  pull_request:
    paths:
      - "src/model/**"
      - "scripts/backtest.ts"
      - "scripts/lib/replay.ts"
      - "scripts/lib/coaching.ts"
      - ".github/workflows/backtest.yml"

jobs:
  backtest:
    runs-on: ubuntu-latest
    # 20 was sized for a three-season window. The default is now eleven, and a
    # grid tuner replays every season at every grid point — --tune-churn is 40
    # points, so its compute goes from 120 season-replays to 440. Raised rather
    # than trimming a grid: a narrowed grid is how five parameters in this
    # model ended up pinned at a boundary, which the changelog calls the single
    # most reliable diagnostic of the whole effort.
    timeout-minutes: 60
    env:
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The full report — including the 03:M-3 signed-error-by-slice tables —
      # lands in the job summary, so a directional lean is one click away on
      # every model PR instead of buried in a log nobody expands.
      # The window flags are DISPATCH-ONLY and must stay that way. On a
      # pull_request run `inputs` is empty, so WINDOW falls to the default and
      # the report on every model PR stays comparable to every previous one —
      # which is the only reason the calibration report works as an honesty
      # gate. Pinned by a test in scripts/lib/backtest-yml.test.ts.
      - name: Run backtest
        run: |
          EXPERIMENT="${{ inputs.experiment || 'none' }}"
          WINDOW=""
          if [ -n "${{ inputs.seasons }}" ]; then
            WINDOW="--seasons=${{ inputs.seasons }}"
          fi
          if [ -n "${{ inputs.covid }}" ]; then
            WINDOW="$WINDOW --covid=${{ inputs.covid }}"
          fi
          if [ "$EXPERIMENT" != "none" ] && [ -n "$EXPERIMENT" ]; then
            npx tsx scripts/backtest.ts "--$EXPERIMENT" $WINDOW | tee backtest.log
          elif [ "${{ inputs.tune || 'false' }}" = "true" ]; then
            npx tsx scripts/backtest.ts --tune $WINDOW | tee backtest.log
          else
            npx tsx scripts/backtest.ts $WINDOW | tee backtest.log
          fi
          { echo '```'; cat backtest.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # The same report at the PRE-2026-08-18 reference window, beside the one
      # above. Every figure recorded in docs/ before that date was computed on
      # 2023-2025, and widening the default made all of them incomparable to
      # anything printed today — the exact objection docs/STATUS.md raises about
      # not silently lifting the replay's preseason tilt to 0.4.
      #
      # Printing both is how that debt gets paid continuously rather than once:
      # the reader can see what moved because the WINDOW changed and what moved
      # because the MODEL changed, on every run, without trusting a changelog
      # entry to have been kept up to date. ~9 CFBD calls and ~20 seconds.
      #
      # Remove this step once BT-4 is settled and the docs are reconciled —
      # it is transition scaffolding, and it should be deleted on purpose
      # rather than left to rot.
      - name: Reference window (2023-2025) for comparison
        run: |
          npx tsx scripts/backtest.ts --seasons=2023-2025 | tee legacy.log
          {
            echo '### Reference window 2023-2025 — what the docs recorded'
            echo '```'; cat legacy.log; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # BT-3's gate. The FBS-membership fix moves production numbers, so under
      # AGENTS.md it needs a measurement — and it cannot be measured against a
      # report from before the widening, because that report also scored a
      # different set of seasons. Same code, same window, same scored set, the
      # only difference being the fix: that is the comparison its gate needs.
      #
      # Paired with the step above and deleted with it once BT-3 and BT-4 are
      # both settled.
      - name: Same window with the FBS fix disabled (BT-3 isolation)
        run: |
          npx tsx scripts/backtest.ts --seasons=2023-2025 --no-admit | tee frozen.log
          {
            echo '### Reference window 2023-2025, FBS pool FROZEN — the fix'"'"'s own control'
            echo '```'; cat frozen.log; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The edge gate runs on every model PR: if a change ever makes the model
      # carry information the closing line lacks, this is where it shows up.
      # Informational — it must not fail the build.
      - name: Diagnose edges
        run: npx tsx scripts/backtest.ts --diagnose-edges || echo "!! diagnose-edges FAILED"

