# Backtest (docs/SPEC.md §2.5) with the repo's CFBD key — the honesty gate
# for model changes: the calibration report in the logs decides whether
# projected totals (and future model tweaks) ship. ~10 CFBD calls per run.
# Runs automatically on PRs that touch the model or replay so no calibration
# regression lands unseen, and on demand via workflow_dispatch.

name: backtest

on:
  workflow_dispatch:
    inputs:
      tune:
        description: "Also grid-search K/HFA and fit sigma"
        type: boolean
        default: false
      experiment:
        description: "Run one tuner instead of the report"
        type: choice
        default: none
        options:
          - none
          - tune-sigma
          - tune-preseason-tilts
          - tune-coaching
          - tune-anchors
  pull_request:
    paths:
      - "src/model/**"
      - "scripts/backtest.ts"
      - "scripts/lib/replay.ts"
      - "scripts/lib/coaching.ts"
      - ".github/workflows/backtest.yml"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run backtest
        run: |
          EXPERIMENT="${{ inputs.experiment || 'none' }}"
          if [ "$EXPERIMENT" != "none" ] && [ -n "$EXPERIMENT" ]; then
            npx tsx scripts/backtest.ts "--$EXPERIMENT"
          elif [ "${{ inputs.tune || 'false' }}" = "true" ]; then
            npx tsx scripts/backtest.ts --tune
          else
            npx tsx scripts/backtest.ts
          fi

      # The edge gate runs on every model PR: if a change ever makes the model
      # carry information the closing line lacks, this is where it shows up.
      # Informational — it must not fail the build.
      - name: Diagnose edges
        run: npx tsx scripts/backtest.ts --diagnose-edges || echo "!! diagnose-edges FAILED"

      # TEMPORARY (remove before merge): fit the restructured churn term, then
      # re-run the preseason build to confirm the ±6 clamp stops saturating.
      - name: Fit churn + preseason data-quality check (one-off)
        run: |
          echo "::group::tune-churn"
          npx tsx scripts/backtest.ts --tune-churn || echo "!! tune-churn FAILED"
          echo "::endgroup::"
          echo "::group::preseason"
          npx tsx scripts/build-preseason.ts --out "$RUNNER_TEMP/preseason" --top 40 || echo "!! preseason FAILED"
          echo "::endgroup::"
