# Backtest (docs/SPEC.md §2.5) with the repo's CFBD key — the honesty gate
# for model changes: the calibration report in the logs decides whether
# projected totals (and future model tweaks) ship. ~10 CFBD calls per run.
# Runs automatically on PRs that touch the model or replay so no calibration
# regression lands unseen, and on demand via workflow_dispatch.

name: backtest

on:
  workflow_dispatch:
    inputs:
      tune:
        description: "Also grid-search K/HFA and fit sigma"
        type: boolean
        default: false
      experiment:
        description: "Run one tuner instead of the report"
        type: choice
        default: none
        options:
          - none
          - tune-sigma
          - tune-preseason-tilts
          - tune-coaching
          - tune-anchors
  pull_request:
    paths:
      - "src/model/**"
      - "scripts/backtest.ts"
      - "scripts/lib/replay.ts"
      - "scripts/lib/coaching.ts"
      - ".github/workflows/backtest.yml"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run backtest
        run: |
          EXPERIMENT="${{ inputs.experiment || 'none' }}"
          if [ "$EXPERIMENT" != "none" ] && [ -n "$EXPERIMENT" ]; then
            npx tsx scripts/backtest.ts "--$EXPERIMENT"
          elif [ "${{ inputs.tune || 'false' }}" = "true" ]; then
            npx tsx scripts/backtest.ts --tune
          else
            npx tsx scripts/backtest.ts
          fi

      # TEMPORARY (remove before merge): the baseline report cleared the
      # sigma-schedule decision rule, so run every tuner once to get fitted
      # values. Informational — a tuner that throws must not fail the gate,
      # and each is reported separately so one failure can't hide the rest.
      - name: Fit parameters (one-off)
        run: |
          for t in tune-sigma tune-preseason-tilts tune-coaching tune-anchors; do
            echo "::group::$t"
            npx tsx scripts/backtest.ts "--$t" || echo "!! $t FAILED"
            echo "::endgroup::"
          done
