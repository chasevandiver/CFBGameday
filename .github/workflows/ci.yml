# Lint, typecheck, test, build on every push and PR — the data jobs had a
# workflow but the code never did (audit #41).

name: ci

on:
  push:
    branches: ["main"]
  pull_request:
  # Runnable by hand. A PR reopened from a branch whose previous PR has already
  # merged does not always get a fresh `pull_request` run — GitHub keeps the
  # branch's existing check suite — which leaves the new PR showing a green tick
  # earned by a commit it no longer contains. That is worse than no tick, so
  # there has to be a way to run the real one without inventing a commit.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # generate Next's route types (LayoutProps etc.) before typechecking
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
