# The CFB Slate — scheduled jobs (docs/SPEC.md §8).
# GitHub Actions is the v1 scheduler; the pg_cron + edge-function path lives in
# supabase/functions/jobs/ for when it can be deployed. Actions schedules can
# lag 5–30 min, which the close passes budget for: each is scheduled ~40 min
# before its kickoff wave, so a worst-case-late run still lands pre-kickoff
# and a post-kickoff snapshot is never selected as the close.
#
# Line cadence is deliberately minimal (owner decision, Aug 2026): lines barely
# move intraday and nobody here bets the moves — the one line that matters is
# the close, because CLV is graded against it (docs/SPEC.md §5.3). So: two
# daily refreshes for display, plus one close pass per kickoff wave, including
# the Thursday/Friday night waves the old schedule missed entirely.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   CFBD_API_KEY, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY

name: jobs

# Every run of this workflow used to be titled "jobs" in the Actions list, for
# all 22 tasks and 30 crons. That made a mis-dispatch invisible: `task` is a
# required choice with no default, so GitHub pre-selects the FIRST option
# (refresh-lines) and a "Run workflow" click that never touched the dropdown
# runs the wrong job and goes green — indistinguishable, from the list, from
# the job you meant. Happened on run #106 while verifying the backup.
run-name: jobs · ${{ inputs.task || github.event.schedule || 'scheduled' }}

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Job to run"
        required: true
        type: choice
        options:
          # FIRST ON PURPOSE, for two reasons.
          #
          # Visibility: this list is 22 long and GitHub's dispatch form does not
          # reliably show all of it — `backup` sat at position 14 and was not
          # findable in the dropdown at all, which is how the secret went
          # unverified for a day.
          #
          # And because the first option is the DEFAULT. `task` is `required`
          # with no `default:`, so GitHub pre-selects whatever is at the top and
          # a "Run workflow" click that never touches the dropdown runs it. That
          # used to be `refresh-lines` — a live job that writes snapshots and
          # chains freeze-groups. Now the accident is a read-only pg_dump.
          # Order this list by what is safe to run by mistake, not by what runs
          # most often; the crons do not read this list at all.
          #
          # Also on the Sunday 15:00 UTC cron. Only copy of
          # predictions/picks/bets outside the 7-day PITR window.
          - backup
          - refresh-lines
          - refresh-lines-burst
          - sync-games
          - sync-rankings
          - sync-systems
          - scoreboard
          - scoreboard-loop
          - weather
          - ratings-update
          - freeze
          - freeze-groups
          - questions
          - verdicts
          # Read-only preview: builds the preseason ratings and prints the
          # ranking table to the log. Writes JSON to a scratch dir that is
          # thrown away with the runner — nothing reaches the database.
          - preseason-preview
          # Readiness gate: reports which preseason inputs are live and which
          # are falling back, and fails when the data isn't complete enough to
          # build on. Read-only.
          - preseason-check
          # Access gate: what the CFBD key's TIER grants, which is a different
          # question from what CFBD has published. Read-only, 11 calls.
          - cfbd-probe
          # Liveness gate: does /scoreboard actually MOVE during a game?
          # cfbd-probe answers "reachable", which is a different question, and
          # the endpoint takes no year/week so there is nothing to replay —
          # this has to be dispatched over a real kickoff. Read-only against
          # the DB (metering aside), so it can run beside scoreboard-loop.
          - observe-scoreboard
          # Rebuild the preseason ratings and load them. Gated on
          # preseason-check passing, and skips the append-only tables — see
          # scripts/load-preseason.ts.
          - preseason-refresh
          # First load of a new season: the same build, but writes the
          # append-only tables (line_snapshots, predictions) too. Running this
          # twice duplicates them, so it is dispatch-only and never scheduled.
          - preseason-bootstrap
          # Push: one nudge before the week's first kickoff, to members with
          # picks still open. Lead time lives in notification_settings and is
          # edited from /admin, not here.
          - notify-picks-due
          # Betting groups only, 15 min before each Saturday kickoff wave.
          - notify-log-bets
  schedule:
    # Lines 2x daily (8am/6pm ET) — display freshness only
    - cron: "0 12,22 * * *"
    # Close passes: one refresh ~40 min before each kickoff wave.
    # Saturday noon / 3:30 / 7-7:30 ET waves, and the late (Pac-after-dark) wave:
    - cron: "20 15 * * 6"
    - cron: "50 18 * * 6"
    - cron: "20 22 * * 6"
    - cron: "50 1 * * 0"
    # Thursday/Friday night games (7-8pm ET kicks — MACtion joins in November):
    - cron: "50 22 * * 4,5"
    # Games sync daily
    - cron: "0 9 * * *"
    # Picks-due nudge, ~2h before each kickoff wave. The job only notifies
    # groups whose first kickoff falls inside notification_settings.lead_minutes,
    # so running it more often than that window is a no-op, not a duplicate —
    # and Actions cron lags 5-30 min, which is exactly why it runs early.
    - cron: "0 15 * * 6"
    - cron: "0 18 * * 6"
    - cron: "0 22 * * 4,5"
    # "Log your bets", 15 min before the three grouped Saturday waves —
    # 11:00 / 14:30 / 18:30 CT, which is 16:00 / 19:30 / 23:30 UTC while CDT is
    # in force. Like every cron in this file these are UTC and do NOT shift for
    # DST, so from Nov they fire an hour later against the clock. The job also
    # skips games that have already kicked, so a badly delayed run sends
    # nothing rather than something useless.
    - cron: "45 15 * * 6"
    - cron: "15 19 * * 6"
    - cron: "15 23 * * 6"
    # Scoreboard: hourly launches of a continuous polling loop (Actions cron
    # can't fire sub-5-minute reliably). Each run polls every 30s while games
    # are live, 120s around kickoffs, and makes zero CFBD calls when idle;
    # realtime pushes every write to browsers instantly, so ~30s is the
    # score-freshness ceiling. Runs overlap by ~3 min and the concurrency
    # group cancels the old run for a seamless handoff.
    # NOTE: comments name ET/CT clock times as a mnemonic; the crons are UTC
    # and do not shift for DST, so from Nov to Mar every "ET" label reads one
    # hour later than it fires. Correct where it matters (freeze/ratings) is
    # the UTC value, not the label.
    #
    # The Sat and Sun windows are separate concurrency groups (keyed on the
    # schedule string), so the advertised cancel-on-overlap handoff does NOT
    # apply across the 23:00→00:00 seam — a ~3-min double-launch there is
    # harmless (the scoreboard writes are no-op-diffed) but not "seamless".
    - cron: "0 15-23 * * 6"
    - cron: "0 0-5 * * 0"
    - cron: "0 0-3 * * 5,6"
    # Sunday/Monday slates (Week 1 is Labor Day weekend; there are real games
    # both nights, and none of the windows above covers them). idleSkip's
    # 2-day horizon exits these launches in under a minute on the ~13 weeks a
    # year with no Sun/Mon game, so the coverage is nearly free.
    - cron: "0 16-23 * * 0,1"
    - cron: "0 0-3 * * 1,2"
    # Tue/Wed-night MACtion (November) — same near-free idle exit off-season.
    - cron: "0 0-4 * * 3,4"
    # P2-10 insurance against a kickoff that moves earlier than any wave we
    # planned for. The Saturday board starts at 15:00 UTC above, which assumes
    # nothing kicks before ~10am ET; a rescheduled or weather-moved opener that
    # kicks at 11:00 UTC would currently go unpolled until 15:00. Near-free:
    # idleSkip exits in seconds on every Saturday with no early game.
    - cron: "0 10-14 * * 6"
    # Weather Saturday mornings
    - cron: "0 10 * * 6"
    # Lines, five minutes after the weather run — the same insurance for the
    # display line and the close. NOT "0 10 * * 6": that string already belongs
    # to weather above, the resolve case is first-match-wins, and GitHub dedupes
    # identical cron entries, so reusing it would retire weather rather than add
    # lines. jobs-yml.test.ts asserts no two tasks claim one string.
    - cron: "5 10 * * 6"
    # Sunday ratings update + grading (8am ET)
    - cron: "0 13 * * 0"
    # Watchdog: absence check on the data jobs, a few times a day and once
    # mid-Saturday-afternoon while games are live. Red run = a job went silent.
    - cron: "0 8,14,20 * * *"
    - cron: "30 21 * * 6"
    # Weekly logical backup, Sunday after grading (inert until SUPABASE_DB_URL).
    - cron: "0 15 * * 0"
    # Offseason keep-alive: GitHub disables scheduled workflows after 60 days
    # of repo inactivity, and Dec→Jul is exactly that. A monthly no-op run
    # resets the clock so the season doesn't open to a dead scheduler.
    - cron: "0 6 1 * *"
    # Thursday-night prediction freeze (10pm CT)
    - cron: "0 3 * * 5"
    # Three Questions per game, Friday morning after the freeze (LLM; green
    # no-op until the ANTHROPIC_API_KEY secret exists)
    - cron: "0 9 * * 5"
    # Preseason refresh, daily at 11am UTC through most of August. CFBD
    # publishes the preseason inputs (talent, returning production, coach
    # moves) on its own schedule during the summer, and a rating built before
    # they land is built on a fallback. Rather than watching for it, this
    # retries every morning and preseason-check decides: NOT READY loads
    # nothing, READY loads that day.
    #
    # Stops on the 27th: openers are the last weekend of August, and once a
    # game is final the ratings belong to the Sunday ratings-update job, not to
    # a preseason rebuild. load-preseason.ts refuses to write a season that has
    # already played anyway — this window just keeps the job from waking up to
    # be told no.
    - cron: "0 11 1-27 8 *"

concurrency:
  group: jobs-${{ github.event.schedule || inputs.task }}
  # the hourly scoreboard loops overlap by design; the new run replaces the old
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Resolve task from schedule
        id: task
        run: |
          case "${{ github.event.schedule }}" in
            "0 12,22 * * *"|"20 15 * * 6"|"50 18 * * 6"|"20 22 * * 6"|"50 1 * * 0"|"50 22 * * 4,5"|"5 10 * * 6") echo "task=refresh-lines" >> "$GITHUB_OUTPUT" ;;
            "0 9 * * *") echo "task=sync-games" >> "$GITHUB_OUTPUT" ;;
            "0 15 * * 6"|"0 18 * * 6"|"0 22 * * 4,5") echo "task=notify-picks-due" >> "$GITHUB_OUTPUT" ;;
            "45 15 * * 6"|"15 19 * * 6"|"15 23 * * 6") echo "task=notify-log-bets" >> "$GITHUB_OUTPUT" ;;
            "0 15-23 * * 6"|"0 0-5 * * 0"|"0 0-3 * * 5,6"|"0 16-23 * * 0,1"|"0 0-3 * * 1,2"|"0 0-4 * * 3,4"|"0 10-14 * * 6") echo "task=scoreboard-loop" >> "$GITHUB_OUTPUT" ;;
            "0 10 * * 6") echo "task=weather" >> "$GITHUB_OUTPUT" ;;
            "0 13 * * 0") echo "task=ratings-update" >> "$GITHUB_OUTPUT" ;;
            "0 8,14,20 * * *"|"30 21 * * 6") echo "task=watchdog" >> "$GITHUB_OUTPUT" ;;
            "0 15 * * 0") echo "task=backup" >> "$GITHUB_OUTPUT" ;;
            "0 6 1 * *") echo "task=keepalive" >> "$GITHUB_OUTPUT" ;;
            "0 3 * * 5") echo "task=freeze" >> "$GITHUB_OUTPUT" ;;
            "0 9 * * 5") echo "task=questions" >> "$GITHUB_OUTPUT" ;;
            "0 11 1-27 8 *") echo "task=preseason-refresh" >> "$GITHUB_OUTPUT" ;;
            "") echo "task=${{ inputs.task }}" >> "$GITHUB_OUTPUT" ;;
            *) echo "task=unknown" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Run job
        run: |
          case "${{ steps.task.outputs.task }}" in
            # Group weeks freeze at their first kickoff. Chained onto the lines
            # jobs rather than given a cron of their own: those already run daily
            # and every 10 minutes through the Saturday kickoff waves, and the
            # freeze is idempotent and cheap. A missed run costs materialisation,
            # never correctness — group_week_is_locked reads the clock.
            refresh-lines) npx tsx scripts/refresh-lines.ts && npx tsx scripts/run-job.ts freeze-groups ;;
            refresh-lines-burst) npx tsx scripts/refresh-lines.ts --burst && npx tsx scripts/run-job.ts freeze-groups ;;
            # daily slot also refreshes poll rankings (AP Sun, CFP Tue — 1 call/day)
            sync-games) npx tsx scripts/sync-games.ts && npx tsx scripts/run-job.ts sync-rankings && npx tsx scripts/run-job.ts sync-systems ;;
            scoreboard-loop) npx tsx scripts/scoreboard-loop.ts --minutes 63 ;;
            sync-rankings|sync-systems|scoreboard|weather|ratings-update|freeze|freeze-groups|watchdog|notify-picks-due|notify-log-bets) npx tsx scripts/run-job.ts "${{ steps.task.outputs.task }}" ;;
            # Keep-alive: touch nothing, just make the run green so GitHub's
            # 60-day inactivity timer resets. No DB, no CFBD.
            keepalive) echo "keep-alive tick $(date -u +%Y-%m-%d) — resets the Actions inactivity clock" ;;
            # Weekly logical backup of the irreplaceable tables. Inert (green,
            # with a notice) until a SUPABASE_DB_URL secret exists, same as the
            # dead-man ping. Append-only receipts/picks/bets have no other copy.
            backup)
              if [ -z "$SUPABASE_DB_URL" ]; then
                echo "::notice::SUPABASE_DB_URL not set — backup skipped"
              else
                # Say what the secret CONTAINS before dialling. Postgres answers
                # a wrong username and a wrong password with the same sentence,
                # and against the pooler it is usually the username — three
                # runs were spent guessing. Prints user/host/port/db and the
                # password's LENGTH, never the password.
                npx tsx scripts/check-db-url.ts
                # pg_dump refuses to dump a server NEWER than itself, and the
                # ubuntu-24.04 runner ships postgresql-client-16 against a
                # Postgres 17.6 project:
                #   "aborting because of server version mismatch"
                # The old guard was `which pg_dump || install` — pg_dump exists,
                # so it never installed anything and the mismatch was structural
                # rather than transient. Pin the client major to the server's.
                #
                # WHEN SUPABASE UPGRADES THE PROJECT: bump PG_MAJOR. The failure
                # is loud and names both versions, so it is self-diagnosing.
                PG_MAJOR=17
                PG_DUMP="/usr/lib/postgresql/$PG_MAJOR/bin/pg_dump"
                if [ ! -x "$PG_DUMP" ]; then
                  sudo apt-get -qq update
                  # The fallback is NOT theoretical: on ubuntu-24.04 the first
                  # install fails with "E: Unable to locate package
                  # postgresql-client-17". The stock client reports itself as
                  # ...pgdg24.04+1, which looks like PGDG is configured — it is
                  # baked into the image, but the apt source is not present, so
                  # only the pinned-in major is installable. Adding the repo and
                  # retrying is the path that actually runs, every time.
                  sudo apt-get -qq install -y "postgresql-client-$PG_MAJOR" || {
                    sudo install -d /usr/share/postgresql-common/pgdg
                    sudo curl -fsS -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
                      https://www.postgresql.org/media/keys/ACCC4CF8.asc
                    echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
                      | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
                    sudo apt-get -qq update
                    sudo apt-get -qq install -y "postgresql-client-$PG_MAJOR"
                  }
                fi
                "$PG_DUMP" --version
                STAMP="$(date -u +%Y%m%d)"
                TABLES="predictions picks bets groups group_members group_week_config group_week_games line_snapshots ratings profiles rating_adjustments"
                # pipefail, or the exit code is gzip's. A pg_dump that dies on a
                # bad password writes its error to stderr and closes the pipe;
                # gzip then compresses nothing, exits 0, and this step goes GREEN
                # with a 20-byte artifact that unpacks to an empty file. The one
                # copy of the receipts outside a 7-day PITR window is exactly
                # where a silent success is worst.
                set -o pipefail
                "$PG_DUMP" "$SUPABASE_DB_URL" --no-owner --no-privileges \
                  $(for t in $TABLES; do printf -- '-t public.%s ' "$t"; done) \
                  | gzip > "backup-$STAMP.sql.gz"
                gzip -t "backup-$STAMP.sql.gz"
                # A dump that connected but selected nothing is also a failure,
                # and it looks identical to a good one from the outside. Every
                # requested table must appear — pg_dump emits the COPY header
                # even for an empty table, so this checks the dump's shape
                # without asserting row counts that legitimately start at zero.
                MISSING=""
                for t in $TABLES; do
                  zgrep -q "COPY public\.$t " "backup-$STAMP.sql.gz" || MISSING="$MISSING $t"
                done
                if [ -n "$MISSING" ]; then
                  echo "::error::backup dumped no COPY block for:$MISSING — the file is not a usable restore"
                  exit 1
                fi
                echo "wrote backup-$STAMP.sql.gz ($(du -h backup-$STAMP.sql.gz | cut -f1), $(echo $TABLES | wc -w) tables)"
              fi ;;
            # Preview only — the JSON goes to a scratch dir and is discarded.
            preseason-preview) npx tsx scripts/build-preseason.ts --out "$RUNNER_TEMP/preseason" --top 40 ;;
            preseason-check) npx tsx scripts/build-preseason.ts --check --out "$RUNNER_TEMP/preseason-check" ;;
            # Handled by its own step below, so that a preseason refresh which
            # declines (and exits 0 on purpose) can never skip it.
            cfbd-probe) echo "access probe runs in the CFBD access probe step" ;;
            # Dispatch this over a kickoff. 70 min fits inside the 75-min job
            # timeout with room for npm ci. Goes RED on STALE/UNKNOWN_STATUS —
            # the two states where the live layer is broken and every other
            # signal we have would stay green. A run with no live game exits 0
            # with a notice: mistimed is not the same as passing.
            observe-scoreboard)
              npx tsx scripts/observe-scoreboard.ts --minutes 70 --interval 30 --out "$RUNNER_TEMP/board.jsonl" ;;
            # Build, then load. --check is the gate: it exits non-zero when an
            # input is still falling back, and we stop there rather than
            # shipping a rating built on last year's talent.
            #
            # A declined refresh exits 0 through Aug 19 — early in the month
            # "not ready yet" is the expected answer, and a red run every
            # morning would train everyone to ignore it. From Aug 20 a decline
            # goes RED: openers are Aug 29 and the Thursday freeze stamps
            # Week 0's receipts from whatever ratings are live on the 28th, so
            # a quiet green through the 27th would strand launch on the stale
            # build with nobody told. Red here means a human decision is due:
            # build on last year's talent deliberately, or launch on the
            # current ratings with a visible note.
            preseason-refresh|preseason-bootstrap)
              DIR="$RUNNER_TEMP/preseason"
              if ! npx tsx scripts/build-preseason.ts --check --out "$DIR-check"; then
                if [ "$(date -u +%m)" = "08" ] && [ "$(date -u +%d)" -ge 20 ]; then
                  echo "::error::preseason inputs STILL not ready with openers on Aug 29 — a decision is due: deliberate stale-talent build, or launch on current ratings"
                  exit 1
                fi
                echo "::notice::preseason inputs not ready — nothing loaded"
                exit 0
              fi
              npx tsx scripts/build-preseason.ts --out "$DIR" --top 40
              if [ "${{ steps.task.outputs.task }}" = "preseason-bootstrap" ]; then
                npx tsx scripts/load-preseason.ts --dir "$DIR" --bootstrap
              else
                npx tsx scripts/load-preseason.ts --dir "$DIR"
              fi ;;
            questions|verdicts)
              if [ -z "$ANTHROPIC_API_KEY" ]; then
                echo "ANTHROPIC_API_KEY not set — skipping LLM generation"
              elif [ "${{ steps.task.outputs.task }}" = "questions" ]; then
                npx tsx scripts/generate-questions.ts
              else
                npx tsx scripts/generate-verdicts.ts
              fi ;;
            *) echo "no task matched schedule '${{ github.event.schedule }}'" && exit 1 ;;
          esac
      # What the CFBD key's TIER grants — a different question from what CFBD
      # has published, and the one `build-preseason.ts --check` cannot answer,
      # because the tier-gated endpoints are exactly the ones the preseason
      # build never touches. `/scoreboard` in particular is never called in the
      # offseason (scoreboard-loop exits via idleSkip), so without this its
      # first real call would land ~2 days before the opener.
      #
      # Its own step, not chained into "Run job": a declined preseason refresh
      # exits 0 deliberately, and an `&&` chain would let that silently skip
      # the probe. Allowed to fail the run — a tier denial is not transient, so
      # unlike the preseason decline it will not go red every morning for
      # three weeks and train everyone to ignore it.
      - name: CFBD access probe
        if: ${{ always() && (steps.task.outputs.task == 'preseason-refresh' || steps.task.outputs.task == 'cfbd-probe') }}
        run: npx tsx scripts/probe-cfbd.ts
      # The raw board, kept whether the run passed or failed — a STALE verdict
      # is precisely when you want the samples, and the window it saw cannot be
      # replayed (/scoreboard has no year/week parameter).
      - name: Upload observed board
        if: ${{ always() && steps.task.outputs.task == 'observe-scoreboard' }}
        uses: actions/upload-artifact@v4
        with:
          name: scoreboard-samples
          path: ${{ runner.temp }}/board.jsonl
          retention-days: 30
          if-no-files-found: ignore
      # Keep the weekly dump for a season; the retention outlives the free
      # tier's own 7-day PITR window, which is the point.
      - name: Upload backup
        if: ${{ steps.task.outputs.task == 'backup' && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: db-backup
          path: backup-*.sql.gz
          retention-days: 90
          if-no-files-found: ignore
      # Dead-man's switch (audit 07): failure emails only fire when a run
      # ERRORS — a cron that silently stops firing (Actions outage, schedule
      # drift, the 60-day inactivity auto-disable) alerts nobody. Pinging an
      # absence-alerting service (healthchecks.io or similar) on every
      # successful run flips that: the alert fires when the ping STOPS.
      # Inert until the HEALTHCHECK_PING_URL secret exists; the task name is
      # appended so one project can hold a check per job (slug-mode URLs).
      - name: Dead-man ping
        if: ${{ success() }}
        env:
          HEALTHCHECK_PING_URL: ${{ secrets.HEALTHCHECK_PING_URL }}
        run: |
          if [ -n "$HEALTHCHECK_PING_URL" ]; then
            curl -fsS -m 10 --retry 3 "$HEALTHCHECK_PING_URL/${{ steps.task.outputs.task }}" > /dev/null || true
          fi
