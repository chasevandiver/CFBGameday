# The CFB Slate — scheduled jobs (docs/SPEC.md §8).
# GitHub Actions is the scheduler, and the only one. A parallel pg_cron +
# edge-function implementation lived in supabase/functions/jobs/ until
# 2026-08-13; it was never deployed, drifted four model versions behind
# scripts/lib/jobs-core.ts, and had inverted CLV in all four of its branches,
# so it was deleted rather than left as a tombstone with a live bug in it. Git
# has it if the pg_cron path is ever revived. Actions schedules can
# lag 5–30 min, which the close passes budget for: each is scheduled ~40 min
# before its kickoff wave, so a worst-case-late run still lands pre-kickoff
# and a post-kickoff snapshot is never selected as the close.
#
# Line cadence is deliberately minimal (owner decision, Aug 2026): lines barely
# move intraday and nobody here bets the moves — the one line that matters is
# the close, because CLV is graded against it (docs/SPEC.md §5.3). So: two
# daily refreshes for display, plus one close pass per kickoff wave, including
# the Thursday/Friday night waves the old schedule missed entirely.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   CFBD_API_KEY, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY

name: jobs

# Every run of this workflow used to be titled "jobs" in the Actions list, for
# all 22 tasks and 30 crons. That made a mis-dispatch invisible: `task` is a
# required choice with no default, so GitHub pre-selects the FIRST option
# (refresh-lines) and a "Run workflow" click that never touched the dropdown
# runs the wrong job and goes green — indistinguishable, from the list, from
# the job you meant. Happened on run #106 while verifying the backup.
run-name: jobs · ${{ inputs.task_override || inputs.task || github.event.schedule || 'scheduled' }}

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Job to run"
        required: true
        type: choice
        options:
          # FIRST ON PURPOSE, for two reasons.
          #
          # Visibility: this list is 22 long and GitHub's dispatch form does not
          # reliably show all of it — `backup` sat at position 14 and was not
          # findable in the dropdown at all, which is how the secret went
          # unverified for a day.
          #
          # And because the first option is the DEFAULT. `task` is `required`
          # with no `default:`, so GitHub pre-selects whatever is at the top and
          # a "Run workflow" click that never touches the dropdown runs it. That
          # used to be `refresh-lines` — a live job that writes snapshots and
          # chains freeze-groups. Now the accident is a read-only pg_dump.
          # Order this list by what is safe to run by mistake, not by what runs
          # most often; the crons do not read this list at all.
          #
          # Also on the Sunday 15:00 UTC cron. Only copy of
          # predictions/picks/bets outside the 7-day PITR window.
          - backup
          # SECOND, and it is here for reachability, not for topic. Grouping it
          # next to `cfbd-probe` — which is what it is *about* — put it at
          # position 22, and this list has now twice proved that its back half
          # cannot be reached: `backup` at 14 was undiscoverable, and a job at
          # 34 could not be started by the only person meant to start it. A
          # dispatch-only job nobody can find is a job that does not exist.
          # Keep it near the top until the manifest is committed; re-sorting it
          # tidily by subject re-creates the same problem a third time.
          #
          # It also earns the slot under this list's actual rule (safe to run by
          # mistake): read-only against CFBD and the database alike — it writes
          # a JSON file in the runner and one api_call_log meter row, nothing
          # else. A stray tap costs 78 CFBD calls and changes no product data.
          #
          # What it answers: for each SEASON, does the feed carry enough rows to
          # fit anything on? A different question from `cfbd-probe`, which asks
          # what the KEY grants — access does not vary by year and data does.
          # Writes scripts/lib/cfbd-coverage.json, which the backtest reads to
          # refuse a window it cannot cover. The load-bearing row is 2014 SP+:
          # it is the bootstrap prior for a 2015 start, so if it is empty the
          # default window has to begin later.
          - probe-history
          # Did the load actually land? load-preseason prints "Done: N rows
          # loaded" and never reads back what it wrote, so a green run that
          # loaded the wrong thing looks exactly like one that worked. Chained
          # onto every load below as well as dispatchable — the Aug 22
          # escalation fires unattended, and STATUS says of the checkpoint four
          # days later: "do not let this get decided by silence".
          - verify-preseason
          # THIRD, and not because it runs often — it runs once. GitHub's
          # mobile dispatch form renders about TWELVE options and then stops,
          # so this list's back half is unreachable from a phone. At position
          # 34 this job could not be started by the person who needs to start
          # it, which is the whole point of a dispatch-only job.
          #
          # It also earns the slot under this list's actual rule (safe to run
          # by mistake, see above): a loaded season is skipped without
          # --force, so a stray tap costs one seasons read and three counts.
          # Move it back down once the deck is filled and it is dead weight.
          - backfill-games
          # BF-3's other two halves. Same dispatch-only rule as backfill-games
          # and the same safe-to-mistap property: a season with no games is
          # skipped, and the lines job deletes only its own reconstructions
          # before re-inserting, so a stray tap cannot double a row.
          - backfill-lines
          - backfill-rankings
          - refresh-lines
          - refresh-lines-burst
          - sync-games
          - sync-rankings
          - sync-systems
          - scoreboard
          - scoreboard-loop
          - weather
          - ratings-update
          - freeze
          - freeze-groups
          - questions
          - verdicts
          - drop
          # Read-only preview: builds the preseason ratings and prints the
          # ranking table to the log. Writes JSON to a scratch dir that is
          # thrown away with the runner — nothing reaches the database.
          - preseason-preview
          # Readiness gate: reports which preseason inputs are live and which
          # are falling back, and fails when the data isn't complete enough to
          # build on. Read-only.
          - preseason-check
          # Access gate: what the CFBD key's TIER grants, which is a different
          # question from what CFBD has published. Read-only, 11 calls.
          - cfbd-probe
          # Liveness gate: does /scoreboard actually MOVE during a game?
          # cfbd-probe answers "reachable", which is a different question, and
          # the endpoint takes no year/week so there is nothing to replay —
          # this has to be dispatched over a real kickoff. Read-only against
          # the DB (metering aside), so it can run beside scoreboard-loop.
          - observe-scoreboard
          # Rebuild the preseason ratings and load them. Gated on
          # preseason-check passing, and skips the append-only tables — see
          # scripts/load-preseason.ts.
          - preseason-refresh
          # First load of a new season: the same build, but writes the
          # append-only tables (line_snapshots, predictions) too. Running this
          # twice duplicates them, so it is dispatch-only and never scheduled.
          - preseason-bootstrap
          # The Q1 escape hatch (docs/STATUS.md §3): preseason-refresh with the
          # readiness gate overridden, for the deliberate decision to ship a
          # build on last season's talent rather than open the season on a
          # rating four versions behind. Never scheduled — a gate that can
          # override itself on a cron is not a gate. It ships a degraded
          # rating on purpose and says so on /model, which is the whole reason
          # it is a separate task name rather than a flag on the daily job.
          - preseason-force
          # Push: one nudge before the week's first kickoff, to members with
          # picks still open. Lead time lives in notification_settings and is
          # edited from /admin, not here.
          - notify-picks-due
          # Betting groups only, 15 min before each Saturday kickoff wave.
          - notify-log-bets
          # NFL (all ESPN, free + unauthenticated; idle guards keep every one
          # of these near-free off-wave). Reference bootstrap is dispatch-only:
          # it sets which season is current for the nfl sport, and MUST run
          # only after the sport-aware pointer (0042) is deployed.
          - nfl-sync-reference
          - nfl-sync-games
          - nfl-refresh-lines
          - nfl-lines-close
          - nfl-grade
          - nfl-scoring
          - cfb-scoring
          - guess-lines
          - streak
          - daily-puzzles
          - six-pack
      # The escape hatch, and it exists because the dropdown above has a hard
      # ceiling: GitHub's MOBILE dispatch form renders about twelve options and
      # stops, so two thirds of a 34-item list cannot be reached from a phone
      # (OPS-14). Typing the name works from anywhere. Left blank, the dropdown
      # wins, so nothing about the existing flow changes.
      task_override:
        description: "…or type a job name (wins over the dropdown)"
        required: false
        type: string

  schedule:
    # Lines 2x daily (8am/6pm ET) — display freshness only
    - cron: "0 12,22 * * *"
    # Close passes: one refresh ~40 min before each kickoff wave.
    # Saturday noon / 3:30 / 7-7:30 ET waves, and the late (Pac-after-dark) wave:
    - cron: "20 15 * * 6"
    - cron: "50 18 * * 6"
    - cron: "20 22 * * 6"
    - cron: "50 1 * * 0"
    # Thursday/Friday night games (7-8pm ET kicks — MACtion joins in November):
    - cron: "50 22 * * 4,5"
    # NFL close passes (nfl-refresh-lines --burst; the display refresh rides
    # the daily "0 12,22" chain). Kickoff waves in UTC: Sunday early wave
    # 17:00, Sunday late wave ~20:05/20:25, and the night games — SNF Sun,
    # MNF Mon, TNF Thu — all kick ~00:15 the NEXT UTC day, so their close
    # pass runs 23:45 the same UTC evening. Saturday joins each set for the
    # late-season weeks 15-18 slates; off-wave runs exit on the kick-window
    # check without a single ESPN call.
    #
    # NFL-23, 2026-08-14. The three lines below were written for the regular
    # season's kickoff slots and missed 29 of 49 preseason games and 39 of 272
    # regular-season ones — measured against the stored schedule, not guessed.
    # The tell was that the preseason kicks at 23:00 and 23:30 UTC, i.e. BEFORE
    # the 23:45 pass, and `--burst` filters `start_ts > now()`, so a game that
    # has already kicked can never be picked up afterwards. Every addition
    # below is a slot that exists in `games`, and each was verified to close a
    # named gap:
    #   50 21 * * *    the 22:00/23:00/23:30 evening kicks (preseason, and the
    #                  late-season Saturday games)
    #   45 23 * * *    widened from 0,1,4,6 — Wednesday covers the week-1
    #                  opener at Thu 00:20 UTC, Friday the Sat 00:00/01:00 set
    #   20 1 * * 0,5   the 02:00 UTC stragglers
    #   40 14 * * 6    one Saturday 16:00 preseason kick
    #   40 12/13 * * 0 the six international games (Sun 13:30 and 14:30), which
    #                  kick before the earliest Sunday pass at 16:20
    #   20 17, 50 19   Thanksgiving and Christmas, six games across Thu and Fri
    # Cost of the extra entries is one runner spin-up and one DB query each:
    # the kick-window check runs first and returns without an ESPN call.
    # Still uncovered by design: 24 games stamped Sun 05:00 UTC, which are week
    # 18 plus flex placeholders rather than real times. `nfl-sync-games` firms
    # them daily — re-run the coverage check in December, don't chase them now.
    - cron: "20 16 * * 0,6"
    - cron: "45 19 * * 0,6"
    - cron: "45 23 * * *"
    - cron: "50 21 * * *"
    - cron: "20 1 * * 0,5"
    - cron: "40 14 * * 6"
    - cron: "40 12 * * 0"
    - cron: "40 13 * * 0"
    - cron: "20 17 * * 4,5"
    - cron: "50 19 * * 4,5"
    # The three trial games' puzzle queue (TAPE/DC/CHAIN), 08:10 CT — early
    # enough that a failure has the whole day to be noticed, and the queue is a
    # fortnight deep anyway so a missed run costs nothing.
    - cron: "10 13 * * *"
    # Games sync daily
    - cron: "0 9 * * *"
    # Picks-due nudge, ~2h before each kickoff wave. The job only notifies
    # groups whose first kickoff falls inside notification_settings.lead_minutes,
    # so running it more often than that window is a no-op, not a duplicate —
    # and Actions cron lags 5-30 min, which is exactly why it runs early.
    - cron: "0 15 * * 6"
    - cron: "0 18 * * 6"
    - cron: "0 22 * * 4,5"
    # "Log your bets", 15 min before the three grouped Saturday waves —
    # 11:00 / 14:30 / 18:30 CT, which is 16:00 / 19:30 / 23:30 UTC while CDT is
    # in force. Like every cron in this file these are UTC and do NOT shift for
    # DST, so from Nov they fire an hour later against the clock. The job also
    # skips games that have already kicked, so a badly delayed run sends
    # nothing rather than something useless.
    - cron: "45 15 * * 6"
    - cron: "15 19 * * 6"
    - cron: "15 23 * * 6"
    # Scoreboard: hourly launches of a continuous polling loop (Actions cron
    # can't fire sub-5-minute reliably). Each run polls every 30s while games
    # are live, 120s around kickoffs, and makes zero CFBD calls when idle;
    # realtime pushes every write to browsers instantly, so ~30s is the
    # score-freshness ceiling. Runs overlap by ~3 min and the concurrency
    # group cancels the old run for a seamless handoff.
    # NOTE: comments name ET/CT clock times as a mnemonic; the crons are UTC
    # and do not shift for DST, so from Nov to Mar every "ET" label reads one
    # hour later than it fires. Correct where it matters (freeze/ratings) is
    # the UTC value, not the label.
    #
    # The Sat and Sun windows are separate concurrency groups (keyed on the
    # schedule string), so the advertised cancel-on-overlap handoff does NOT
    # apply across the 23:00→00:00 seam — a ~3-min double-launch there is
    # harmless (the scoreboard writes are no-op-diffed) but not "seamless".
    - cron: "0 15-23 * * 6"
    - cron: "0 0-5 * * 0"
    - cron: "0 0-4 * * 5,6"
    # Sunday/Monday slates (Week 1 is Labor Day weekend; there are real games
    # both nights, and none of the windows above covers them). idleSkip's
    # 2-day horizon exits these launches in under a minute on the ~13 weeks a
    # year with no Sun/Mon game, so the coverage is nearly free.
    - cron: "0 16-23 * * 0,1"
    - cron: "0 0-5 * * 1,2"
    # Tue/Wed-night MACtion (November) — same near-free idle exit off-season.
    - cron: "0 0-4 * * 3,4"
    # NFL Thu/Fri evenings, pre-midnight UTC: preseason weeknight games kick
    # 23:00 UTC (7pm ET) and the Black Friday game kicks 20:00 UTC — every
    # window above starts at the following midnight, so the first hours of
    # those games went unpolled (found live, preseason week 2's opening
    # kicks). Regular-season TNF at 00:15 UTC was never affected. Near-free
    # off those nights: idleSkip exits when neither league has a game close.
    - cron: "0 20-23 * * 4,5"
    # P2-10 insurance against a kickoff that moves earlier than any wave we
    # planned for. The Saturday board starts at 15:00 UTC above, which assumes
    # nothing kicks before ~10am ET; a rescheduled or weather-moved opener that
    # kicks at 11:00 UTC would currently go unpolled until 15:00. Near-free:
    # idleSkip exits in seconds on every Saturday with no early game.
    - cron: "0 10-14 * * 6"
    # Weather Saturday mornings
    - cron: "0 10 * * 6"
    # Lines, five minutes after the weather run — the same insurance for the
    # display line and the close. NOT "0 10 * * 6": that string already belongs
    # to weather above, the resolve case is first-match-wins, and GitHub dedupes
    # identical cron entries, so reusing it would retire weather rather than add
    # lines. jobs-yml.test.ts asserts no two tasks claim one string.
    - cron: "5 10 * * 6"
    # Sunday ratings update + grading (8am ET)
    - cron: "0 13 * * 0"
    # NFL settlement. Daily since GRADE-2, not Mon/Tue/Fri: the loop's sweep
    # settles a final within ~30s, so this is purely the net under it — and the
    # night that motivated GRADE-2 had six scoreboard-loop runs die without
    # finishing, which is exactly when the net is load-bearing. On the old
    # three-day cadence a Friday-night bet that the loop missed waited until
    # Monday. Idempotent — result-null filters make a re-run a no-op — so the
    # four extra runs a week cost one query each.
    - cron: "30 13 * * *"
    # Watchdog: absence check on the data jobs, a few times a day and once
    # mid-Saturday-afternoon while games are live. Red run = a job went silent.
    - cron: "0 8,14,20 * * *"
    - cron: "30 21 * * 6"
    # Weekly logical backup, Sunday after grading (inert until SUPABASE_DB_URL).
    - cron: "0 15 * * 0"
    # Offseason keep-alive: GitHub disables scheduled workflows after 60 days
    # of repo inactivity, and Dec→Jul is exactly that. A monthly no-op run
    # resets the clock so the season doesn't open to a dead scheduler.
    - cron: "0 6 1 * *"
    # Thursday-night prediction freeze (10pm CT)
    - cron: "0 3 * * 5"
    # Three Questions per game, Friday morning after the freeze (LLM; green
    # no-op until the ANTHROPIC_API_KEY secret exists)
    - cron: "0 9 * * 5"
    # The Tuesday Drop (R2-B2): the ratings-update paragraph, Monday 15:00 UTC
    # — two hours after Sunday's ratings land would be Sunday; Monday gives the
    # grading chain a full day of slack, and the hub features it Tuesday. The
    # producer skips loudly when the ratings week hasn't advanced (an upstream
    # failure must stay the visible event) and is idempotent per week.
    - cron: "0 15 * * 1"
    # Guess the Lines (R2-C1): Monday selects the week's slate (before the
    # 12:00 UTC Tuesday-ish line posts... the Monday 16:30 run lands after
    # that day's 12:00 refresh on purpose — any game the refresh just lined
    # is excluded by the selection rule, not raced). Tue/Wed runs sweep the
    # grading as lines post with the 2x/day refresh.
    - cron: "30 16 * * 1,2,3"
    # The Streak (R2-C2): daily — grade yesterday's pick, select tomorrow's
    # matchup. 14:00 UTC is morning in DEFAULT_TZ, after the overnight finals.
    - cron: "0 14 * * *"
    # The Six-Pack (R3-E2). Tuesday 17:00 UTC generates the week's six
    # questions — after Monday's guess-lines selection and after that day's
    # 12:00 line refresh, so line_consensus already carries the spread and
    # total the cover/total questions freeze onto themselves. Sun/Mon 14:30
    # sweep the grading behind the weekend's finals. Both halves are
    # idempotent, so a missed run costs latency, never correctness.
    - cron: "0 17 * * 2"
    - cron: "30 14 * * 0,1"
    # Preseason refresh, daily at 11am UTC through most of August. CFBD
    # publishes the preseason inputs (talent, returning production, coach
    # moves) on its own schedule during the summer, and a rating built before
    # they land is built on a fallback. Rather than watching for it, this
    # retries every morning and preseason-check decides: NOT READY loads
    # nothing, READY loads that day.
    #
    # Stops on the 27th: openers are the last weekend of August, and once a
    # game is final the ratings belong to the Sunday ratings-update job, not to
    # a preseason rebuild. load-preseason.ts refuses to write a season that has
    # already played anyway — this window just keeps the job from waking up to
    # be told no.
    - cron: "0 11 1-27 8 *"

concurrency:
  group: jobs-${{ github.event.schedule || inputs.task }}
  # the hourly scoreboard loops overlap by design; the new run replaces the old
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      # Web push (PUSH-11). These were missing until 2026-08-14, and their
      # absence was invisible for the worst possible reason: the secrets existed
      # and push demonstrably worked, but from /admin and the /me test button,
      # which run on Vercel with its own env. An Actions secret is not an
      # environment variable until this block maps it, so every scheduled push
      # returned {"skipped": "no vapid keys"} and went green — including
      # notifyWatchdog, which meant OPS-2's phone alert could never fire.
      #
      # Names are the ones .env.example documents. If a secret is named
      # differently in repo settings, change the RIGHT-hand side only — the
      # left-hand names are what src/lib/push.ts reads and must not move. A
      # wrong name here degrades to the old skip rather than failing a run
      # (pushConfigured(), push.ts:58), so verify by dispatch, not by reading:
      # `jobs · notify-picks-due` must stop reporting "no vapid keys".
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Resolve task from schedule
        id: task
        env:
          # Through env, never `${{ }}` inside the script: `task_override` is
          # free text and direct interpolation would splice it into the shell.
          TASK_OVERRIDE: ${{ inputs.task_override }}
          TASK_CHOICE: ${{ inputs.task }}
        run: |
          case "${{ github.event.schedule }}" in
            "0 12,22 * * *"|"20 15 * * 6"|"50 18 * * 6"|"20 22 * * 6"|"50 1 * * 0"|"50 22 * * 4,5"|"5 10 * * 6") echo "task=refresh-lines" >> "$GITHUB_OUTPUT" ;;
            "20 16 * * 0,6"|"45 19 * * 0,6"|"45 23 * * *"|"50 21 * * *"|"20 1 * * 0,5"|"40 14 * * 6"|"40 12 * * 0"|"40 13 * * 0"|"20 17 * * 4,5"|"50 19 * * 4,5") echo "task=nfl-lines-close" >> "$GITHUB_OUTPUT" ;;
            "0 9 * * *") echo "task=sync-games" >> "$GITHUB_OUTPUT" ;;
            "0 15 * * 6"|"0 18 * * 6"|"0 22 * * 4,5") echo "task=notify-picks-due" >> "$GITHUB_OUTPUT" ;;
            "45 15 * * 6"|"15 19 * * 6"|"15 23 * * 6") echo "task=notify-log-bets" >> "$GITHUB_OUTPUT" ;;
            "0 15-23 * * 6"|"0 0-5 * * 0"|"0 0-4 * * 5,6"|"0 16-23 * * 0,1"|"0 0-5 * * 1,2"|"0 0-4 * * 3,4"|"0 10-14 * * 6"|"0 20-23 * * 4,5") echo "task=scoreboard-loop" >> "$GITHUB_OUTPUT" ;;
            "0 10 * * 6") echo "task=weather" >> "$GITHUB_OUTPUT" ;;
            "0 13 * * 0") echo "task=ratings-update" >> "$GITHUB_OUTPUT" ;;
            "30 13 * * *") echo "task=nfl-grade" >> "$GITHUB_OUTPUT" ;;
            "0 8,14,20 * * *"|"30 21 * * 6") echo "task=watchdog" >> "$GITHUB_OUTPUT" ;;
            "0 15 * * 0") echo "task=backup" >> "$GITHUB_OUTPUT" ;;
            "0 6 1 * *") echo "task=keepalive" >> "$GITHUB_OUTPUT" ;;
            "0 3 * * 5") echo "task=freeze" >> "$GITHUB_OUTPUT" ;;
            "0 9 * * 5") echo "task=questions" >> "$GITHUB_OUTPUT" ;;
            "0 15 * * 1") echo "task=drop" >> "$GITHUB_OUTPUT" ;;
            "30 16 * * 1,2,3") echo "task=guess-lines" >> "$GITHUB_OUTPUT" ;;
            "0 14 * * *") echo "task=streak" >> "$GITHUB_OUTPUT" ;;
            "10 13 * * *") echo "task=daily-puzzles" >> "$GITHUB_OUTPUT" ;;
            "0 17 * * 2"|"30 14 * * 0,1") echo "task=six-pack" >> "$GITHUB_OUTPUT" ;;
            "0 11 1-27 8 *") echo "task=preseason-refresh" >> "$GITHUB_OUTPUT" ;;
            "")
              # Dispatch. The override wins when it is non-empty.
              #
              # It is free text, and `steps.task.outputs.task` is interpolated
              # into a shell command by the next step — so it is constrained to
              # the shape a job name can actually have before it goes anywhere.
              # Dispatch needs write access, so this is not a hostile-input
              # boundary; it is the difference between a typo that fails loudly
              # and a typo that runs something.
              t="${TASK_OVERRIDE:-$TASK_CHOICE}"
              case "$t" in
                ""|*[!a-z0-9-]*)
                  echo "::error::invalid task name — lowercase, digits and dashes only"
                  exit 1 ;;
              esac
              echo "task=$t" >> "$GITHUB_OUTPUT" ;;
            *) echo "task=unknown" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Run job
        # OPS-4b: where recordJobRun publishes the job_runs id it is writing,
        # so the cancellation step below can settle that exact row rather than
        # guessing which of a chained step's jobs was the one running.
        env:
          JOB_RUN_ID_FILE: ${{ runner.temp }}/job-run-id
        run: |
          case "${{ steps.task.outputs.task }}" in
            # Group weeks freeze at their first kickoff. Chained onto the lines
            # jobs rather than given a cron of their own: those already run daily
            # and every 10 minutes through the Saturday kickoff waves, and the
            # freeze is idempotent and cheap. A missed run costs materialisation,
            # never correctness — group_week_is_locked reads the clock.
            # The NFL line refresh rides the CFB display-refresh chain: same
            # twice-daily cadence, and the group-week freeze after it covers
            # NFL pick'em boards too (freeze_group_week resolves per season).
            refresh-lines) npx tsx scripts/refresh-lines.ts && npx tsx scripts/nfl-refresh-lines.ts && npx tsx scripts/run-job.ts freeze-groups ;;
            refresh-lines-burst) npx tsx scripts/refresh-lines.ts --burst && npx tsx scripts/run-job.ts freeze-groups ;;
            nfl-lines-close) npx tsx scripts/nfl-refresh-lines.ts --burst && npx tsx scripts/run-job.ts freeze-groups ;;
            # daily slot also refreshes poll rankings (AP Sun, CFP Tue — 1 call/day)
            sync-games) npx tsx scripts/sync-games.ts && npx tsx scripts/nfl-sync-games.ts && npx tsx scripts/run-job.ts sync-rankings && npx tsx scripts/run-job.ts sync-systems ;;
            nfl-sync-reference) npx tsx scripts/nfl-sync-reference.ts ;;
            nfl-sync-games) npx tsx scripts/nfl-sync-games.ts ;;
            nfl-refresh-lines) npx tsx scripts/nfl-refresh-lines.ts ;;
            scoreboard-loop) npx tsx scripts/scoreboard-loop.ts --minutes 63 ;;
            sync-rankings|sync-systems|scoreboard|weather|ratings-update|freeze|freeze-groups|watchdog|notify-picks-due|notify-log-bets|nfl-grade|nfl-scoring|cfb-scoring|guess-lines|streak|six-pack|daily-puzzles|backfill-games|backfill-lines|backfill-rankings) npx tsx scripts/run-job.ts "${{ steps.task.outputs.task }}" ;;
            # Keep-alive: touch nothing, just make the run green so GitHub's
            # 60-day inactivity timer resets. No DB, no CFBD.
            keepalive) echo "keep-alive tick $(date -u +%Y-%m-%d) — resets the Actions inactivity clock" ;;
            # Weekly logical backup of the irreplaceable tables. Inert (green,
            # with a notice) until a SUPABASE_DB_URL secret exists, same as the
            # dead-man ping. Append-only receipts/picks/bets have no other copy.
            backup)
              if [ -z "$SUPABASE_DB_URL" ]; then
                echo "::notice::SUPABASE_DB_URL not set — backup skipped"
              else
                # Say what the secret CONTAINS before dialling. Postgres answers
                # a wrong username and a wrong password with the same sentence,
                # and against the pooler it is usually the username — three
                # runs were spent guessing. Prints user/host/port/db and the
                # password's LENGTH, never the password.
                npx tsx scripts/check-db-url.ts
                # pg_dump refuses to dump a server NEWER than itself, and the
                # ubuntu-24.04 runner ships postgresql-client-16 against a
                # Postgres 17.6 project:
                #   "aborting because of server version mismatch"
                # The old guard was `which pg_dump || install` — pg_dump exists,
                # so it never installed anything and the mismatch was structural
                # rather than transient. Pin the client major to the server's.
                #
                # WHEN SUPABASE UPGRADES THE PROJECT: bump PG_MAJOR. The failure
                # is loud and names both versions, so it is self-diagnosing.
                PG_MAJOR=17
                PG_DUMP="/usr/lib/postgresql/$PG_MAJOR/bin/pg_dump"
                if [ ! -x "$PG_DUMP" ]; then
                  sudo apt-get -qq update
                  # The fallback is NOT theoretical: on ubuntu-24.04 the first
                  # install fails with "E: Unable to locate package
                  # postgresql-client-17". The stock client reports itself as
                  # ...pgdg24.04+1, which looks like PGDG is configured — it is
                  # baked into the image, but the apt source is not present, so
                  # only the pinned-in major is installable. Adding the repo and
                  # retrying is the path that actually runs, every time.
                  sudo apt-get -qq install -y "postgresql-client-$PG_MAJOR" || {
                    sudo install -d /usr/share/postgresql-common/pgdg
                    sudo curl -fsS -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
                      https://www.postgresql.org/media/keys/ACCC4CF8.asc
                    echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
                      | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
                    sudo apt-get -qq update
                    sudo apt-get -qq install -y "postgresql-client-$PG_MAJOR"
                  }
                fi
                "$PG_DUMP" --version
                STAMP="$(date -u +%Y%m%d)"
                TABLES="predictions picks bets groups group_members group_week_config group_week_games line_snapshots ratings profiles rating_adjustments"
                # pipefail, or the exit code is gzip's. A pg_dump that dies on a
                # bad password writes its error to stderr and closes the pipe;
                # gzip then compresses nothing, exits 0, and this step goes GREEN
                # with a 20-byte artifact that unpacks to an empty file. The one
                # copy of the receipts outside a 7-day PITR window is exactly
                # where a silent success is worst.
                set -o pipefail
                "$PG_DUMP" "$SUPABASE_DB_URL" --no-owner --no-privileges \
                  $(for t in $TABLES; do printf -- '-t public.%s ' "$t"; done) \
                  | gzip > "backup-$STAMP.sql.gz"
                gzip -t "backup-$STAMP.sql.gz"
                # A dump that connected but selected nothing is also a failure,
                # and it looks identical to a good one from the outside. Every
                # requested table must appear — pg_dump emits the COPY header
                # even for an empty table, so this checks the dump's shape
                # without asserting row counts that legitimately start at zero.
                MISSING=""
                for t in $TABLES; do
                  zgrep -q "COPY public\.$t " "backup-$STAMP.sql.gz" || MISSING="$MISSING $t"
                done
                if [ -n "$MISSING" ]; then
                  echo "::error::backup dumped no COPY block for:$MISSING — the file is not a usable restore"
                  exit 1
                fi
                echo "wrote backup-$STAMP.sql.gz ($(du -h backup-$STAMP.sql.gz | cut -f1), $(echo $TABLES | wc -w) tables)"
              fi ;;
            # Preview only — the JSON goes to a scratch dir and is discarded.
            # TALENT_SOURCE=recruiting on every preseason build task: adopted
            # 2026-08-19 by --tune-talent-source's pre-registered rule (CFBD-5;
            # decisions table). Inert the day CFBD publishes the composite.
            preseason-preview) TALENT_SOURCE=recruiting npx tsx scripts/build-preseason.ts --out "$RUNNER_TEMP/preseason" --top 40 ;;
            preseason-check) TALENT_SOURCE=recruiting npx tsx scripts/build-preseason.ts --check --out "$RUNNER_TEMP/preseason-check" ;;
            verify-preseason) npx tsx scripts/verify-preseason.ts ;;
            # Handled by its own step below, so that a preseason refresh which
            # declines (and exits 0 on purpose) can never skip it.
            cfbd-probe) echo "access probe runs in the CFBD access probe step" ;;
            probe-history) echo "coverage probe runs in the CFBD history probe step" ;;
            # Dispatch this over a kickoff. 70 min fits inside the 75-min job
            # timeout with room for npm ci. Goes RED on STALE/UNKNOWN_STATUS —
            # the two states where the live layer is broken and every other
            # signal we have would stay green. A run with no live game exits 0
            # with a notice: mistimed is not the same as passing.
            observe-scoreboard)
              npx tsx scripts/observe-scoreboard.ts --minutes 70 --interval 30 --out "$RUNNER_TEMP/board.jsonl" ;;
            # Build, then load. --check is the gate: it exits non-zero when an
            # input is still falling back, and we stop there rather than
            # shipping a rating built on last year's talent.
            #
            # A declined refresh exits 0 through Aug 19 — early in the month
            # "not ready yet" is the expected answer, and a red run every
            # morning would train everyone to ignore it. From Aug 20 a decline
            # goes RED: openers are Aug 29 and the Thursday freeze stamps
            # Week 0's receipts from whatever ratings are live on the 28th, so
            # a quiet green through the 27th would strand launch on the stale
            # build with nobody told.
            #
            # From Aug 22 it stops asking and loads — the Q1 escalation,
            # answered YES by the owner on 2026-08-18. The ladder is notice →
            # alarm → act, and the last rung is dated because the rung above it
            # is not enough on its own: STATUS.md's instruction about this
            # checkpoint is "do not let this get decided by silence", and a red
            # run every morning from Aug 20 IS decided by silence if nobody is
            # at a keyboard on the right morning.
            #
            # What it costs is bounded and self-correcting. --force changes no
            # number — it only stops the gate refusing the load — so on a day
            # CFBD HAS published this is a plain refresh and the flag is inert.
            # On a day it has not, the build carries last season's talent, a
            # ±1-2 pt error per team against a live version that is wrong about
            # home field on every game, and it says so on /model until a later
            # refresh overwrites it. Both tables are keyed on (season, team),
            # so the good build lands on top and rewrites talent_stale to false
            # with no cleanup.
            #
            # preseason-bootstrap is deliberately NOT in the escalation: it
            # writes the append-only tables, and a season's first load is not
            # something a date should decide.
            #
            # preseason-force is the same sequence overridden on demand, for
            # doing this before the 22nd. Either way --force makes --check
            # print every problem and still exit 0, so the decline branch below
            # is skipped by construction rather than by a second copy of it.
            # $FORCE is unquoted on purpose: empty must expand to no argument.
            preseason-refresh|preseason-bootstrap|preseason-force)
              DIR="$RUNNER_TEMP/preseason"
              # Adopted 2026-08-19 by --tune-talent-source (pre-registered
              # rule; docs/CHANGELOG.md decisions table): while the season's
              # /talent composite is unpublished, the build substitutes the
              # trailing recruiting classes BEFORE falling to last season's
              # composite. A healthy substitute makes --check READY, so the
              # refresh loads a rating with the incoming class in it instead
              # of waiting for the Aug 22 stale-talent force. Inert the day
              # CFBD publishes.
              export TALENT_SOURCE=recruiting
              FORCE=""
              if [ "${{ steps.task.outputs.task }}" = "preseason-force" ]; then
                FORCE="--force"
                echo "::warning::preseason-force — building on whatever CFBD has published, gate overridden. The rating ships with a stale-talent note on /model."
              elif [ "${{ steps.task.outputs.task }}" = "preseason-refresh" ] && [ "$(date -u +%m)" = "08" ] && [ "$(date -u +%d)" -ge 22 ]; then
                FORCE="--force"
                echo "::warning::Q1 escalation (owner call, 2026-08-18) — from Aug 22 the daily refresh loads the best build available instead of declining. Inert on any day CFBD has published; on any other day the rating carries last season's talent and says so on /model."
              fi
              if ! npx tsx scripts/build-preseason.ts --check $FORCE --out "$DIR-check"; then
                if [ "$(date -u +%m)" = "08" ] && [ "$(date -u +%d)" -ge 20 ]; then
                  echo "::error::preseason inputs STILL not ready with openers on Aug 29. Q1 is answered, so this is notice rather than a question: from Aug 22 this job stops declining and loads the best build available. Dispatch preseason-force to do it sooner, or move the date in this file to hold it off"
                  exit 1
                fi
                echo "::notice::preseason inputs not ready — nothing loaded"
                exit 0
              fi
              npx tsx scripts/build-preseason.ts --out "$DIR" --top 40
              if [ "${{ steps.task.outputs.task }}" = "preseason-bootstrap" ]; then
                npx tsx scripts/load-preseason.ts --dir "$DIR" --bootstrap
              else
                npx tsx scripts/load-preseason.ts --dir "$DIR"
              fi
              # Read back what landed. Reached only when a load actually ran —
              # a declined refresh exits 0 above, so this cannot go red on the
              # days the gate is correctly saying "not yet".
              npx tsx scripts/verify-preseason.ts ;;
            questions|verdicts|drop)
              if [ -z "$ANTHROPIC_API_KEY" ]; then
                echo "ANTHROPIC_API_KEY not set — skipping LLM generation"
              elif [ "${{ steps.task.outputs.task }}" = "questions" ]; then
                npx tsx scripts/generate-questions.ts
              elif [ "${{ steps.task.outputs.task }}" = "drop" ]; then
                npx tsx scripts/generate-drop.ts
              else
                npx tsx scripts/generate-verdicts.ts
              fi ;;
            *) echo "no task matched schedule '${{ github.event.schedule }}'" && exit 1 ;;
          esac
      # OPS-4b, 2026-08-20. The scoreboard loops overlap by design and the
      # concurrency group cancels the old one; recordJobRun's SIGTERM handler
      # was supposed to record that and does not, because the runner kills the
      # `npx tsx` tree ~0.3s after cancelling and the signal never reaches the
      # process holding the row. This step does reach it — a cancelled job
      # still runs its `if: cancelled()` steps — and it is the only thing here
      # that runs on a cancellation, so it costs nothing on a normal run.
      - name: Record the cancellation
        if: cancelled()
        env:
          JOB_RUN_ID_FILE: ${{ runner.temp }}/job-run-id
        run: npx tsx scripts/settle-canceled-run.ts

      # What the CFBD key's TIER grants — a different question from what CFBD
      # has published, and the one `build-preseason.ts --check` cannot answer,
      # because the tier-gated endpoints are exactly the ones the preseason
      # build never touches. `/scoreboard` in particular is never called in the
      # offseason (scoreboard-loop exits via idleSkip), so without this its
      # first real call would land ~2 days before the opener.
      #
      # Its own step, not chained into "Run job": a declined preseason refresh
      # exits 0 deliberately, and an `&&` chain would let that silently skip
      # the probe. Allowed to fail the run — a tier denial is not transient, so
      # unlike the preseason decline it will not go red every morning for
      # three weeks and train everyone to ignore it.
      - name: CFBD access probe
        if: ${{ always() && (steps.task.outputs.task == 'preseason-refresh' || steps.task.outputs.task == 'cfbd-probe') }}
        run: npx tsx scripts/probe-cfbd.ts
      # The coverage probe, dispatch-only and deliberately NOT chained to
      # preseason-refresh: 78 calls is cheap once and wasteful daily, and a
      # completed season's coverage does not change. `--write` updates the
      # committed manifest; the diff is the deliverable and has to be reviewed
      # and committed by hand, because it is what turns assertFeedCoverage from
      # a warning into a gate.
      - name: CFBD history probe
        if: ${{ always() && steps.task.outputs.task == 'probe-history' }}
        run: npx tsx scripts/probe-cfbd-history.ts --write
      - name: Upload coverage manifest
        if: ${{ always() && steps.task.outputs.task == 'probe-history' }}
        uses: actions/upload-artifact@v4
        with:
          name: cfbd-coverage
          path: scripts/lib/cfbd-coverage.json
          if-no-files-found: warn
      # ...and print it, because an artifact you have to download is a worse
      # review surface than a diff. The manifest is committed by hand, so the
      # bytes have to reach a human somehow; the summary puts them one click
      # from the run and keeps them after the artifact's retention lapses.
      # `tee`, not a plain redirect: sending the group's stdout to the summary
      # file alone leaves the job log empty, which is how the last step that did
      # this produced a green run nobody could read.
      - name: Print coverage manifest
        if: ${{ always() && steps.task.outputs.task == 'probe-history' }}
        run: |
          {
            echo '### scripts/lib/cfbd-coverage.json'
            echo '```json'
            cat scripts/lib/cfbd-coverage.json
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      # The raw board, kept whether the run passed or failed — a STALE verdict
      # is precisely when you want the samples, and the window it saw cannot be
      # replayed (/scoreboard has no year/week parameter).
      - name: Upload observed board
        if: ${{ always() && steps.task.outputs.task == 'observe-scoreboard' }}
        uses: actions/upload-artifact@v4
        with:
          name: scoreboard-samples
          path: ${{ runner.temp }}/board.jsonl
          retention-days: 30
          if-no-files-found: ignore
      # Keep the weekly dump for a season; the retention outlives the free
      # tier's own 7-day PITR window, which is the point.
      - name: Upload backup
        if: ${{ steps.task.outputs.task == 'backup' && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: db-backup
          path: backup-*.sql.gz
          retention-days: 90
          if-no-files-found: ignore
      # Dead-man's switch (audit 07): failure emails only fire when a run
      # ERRORS — a cron that silently stops firing (Actions outage, schedule
      # drift, the 60-day inactivity auto-disable) alerts nobody. Pinging an
      # absence-alerting service (healthchecks.io or similar) on every
      # successful run flips that: the alert fires when the ping STOPS.
      # Inert until the HEALTHCHECK_PING_URL secret exists; the task name is
      # appended so one project can hold a check per job (slug-mode URLs).
      # A ping that never leaves the runner used to look exactly like one that
      # landed: `curl -fsS … > /dev/null || true` discarded the outcome and the
      # run went green with the dead-man switch silently absent. Proved on run
      # #120 — the secret was set, and curl said `(3) URL rejected: No host
      # part in the URL`. Nothing reached healthchecks; the run was green.
      # That is the same defect the backup step was fixed for one row above,
      # in the step immediately below it.
      #
      # Still never fails the run — observability must not break the thing it
      # observes (scripts/lib/jobs-core.ts) — so a bad ping is a WARNING, which
      # is visible on the run summary without turning a good job red.
      - name: Dead-man ping
        if: ${{ success() }}
        env:
          HEALTHCHECK_PING_URL: ${{ secrets.HEALTHCHECK_PING_URL }}
        run: |
          if [ -z "$HEALTHCHECK_PING_URL" ]; then
            echo "::notice::HEALTHCHECK_PING_URL not set — dead-man ping skipped"
            exit 0
          fi
          # No -f: we want the status code, not an exit code that hides it.
          # A `||` branch here means curl never got an answer at all.
          code=$(curl -sS -m 10 --retry 3 -o /dev/null -w '%{http_code}' \
            "$HEALTHCHECK_PING_URL/${{ steps.task.outputs.task }}") || code=""
          case "$code" in
            200|201)
              echo "dead-man ping ok — ${{ steps.task.outputs.task }} (HTTP $code)" ;;
            404)
              # Expected for the 18 tasks with no check: healthchecks 404s an
              # unknown slug, and that is the designed way to monitor a subset.
              echo "::notice::No healthchecks check with slug '${{ steps.task.outputs.task }}' (HTTP 404) — expected unless this task is meant to be monitored" ;;
            "")
              echo "::warning::Dead-man ping never reached healthchecks — see the curl error above. HEALTHCHECK_PING_URL must be https://hc-ping.com/<ping-key>, with a scheme and no trailing slash." ;;
            *)
              echo "::warning::Dead-man ping returned HTTP $code for slug '${{ steps.task.outputs.task }}'" ;;
          esac
