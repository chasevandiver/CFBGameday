# The CFB Slate — scheduled jobs (docs/SPEC.md §8).
# GitHub Actions is the v1 scheduler; the pg_cron + edge-function path lives in
# supabase/functions/jobs/ for when it can be deployed. Actions schedules can
# lag 5–30 min, which is fine for everything except the closing-line burst —
# that one runs every 10 min in a window, so worst case the "closing" snapshot
# is a bit stale (documented proxy, docs/SPEC.md §5.3).
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   CFBD_API_KEY, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY

name: jobs

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Job to run"
        required: true
        type: choice
        options:
          - refresh-lines
          - refresh-lines-burst
          - sync-games
          - sync-rankings
          - sync-systems
          - scoreboard
          - scoreboard-loop
          - weather
          - ratings-update
          - freeze
          - questions
          - verdicts
          # Read-only preview: builds the preseason ratings and prints the
          # ranking table to the log. Writes JSON to a scratch dir that is
          # thrown away with the runner — nothing reaches the database.
          - preseason-preview
          # Readiness gate: reports which preseason inputs are live and which
          # are falling back, and fails when the data isn't complete enough to
          # build on. Read-only.
          - preseason-check
          # Rebuild the preseason ratings and load them. Gated on
          # preseason-check passing, and skips the append-only tables — see
          # scripts/load-preseason.ts.
          - preseason-refresh
          # First load of a new season: the same build, but writes the
          # append-only tables (line_snapshots, predictions) too. Running this
          # twice duplicates them, so it is dispatch-only and never scheduled.
          - preseason-bootstrap
  schedule:
    # Lines 4x daily (8am/1pm/6pm/11pm ET)
    - cron: "0 3,12,17,22 * * *"
    # Lines hourly on Saturdays (daytime UTC)
    - cron: "0 13-23 * * 6"
    # Closing-line burst: every 10 min around Saturday kickoff waves
    - cron: "*/10 15-23 * * 6"
    - cron: "*/10 0-3 * * 0"
    # Games sync daily
    - cron: "0 9 * * *"
    # Scoreboard: hourly launches of a continuous polling loop (Actions cron
    # can't fire sub-5-minute reliably). Each run polls every 30s while games
    # are live, 120s around kickoffs, and makes zero CFBD calls when idle;
    # realtime pushes every write to browsers instantly, so ~30s is the
    # score-freshness ceiling. Runs overlap by ~3 min and the concurrency
    # group cancels the old run for a seamless handoff.
    - cron: "0 15-23 * * 6"
    - cron: "0 0-4 * * 0"
    - cron: "0 0-3 * * 5,6"
    # Weather Saturday mornings
    - cron: "0 10 * * 6"
    # Sunday ratings update + grading (8am ET)
    - cron: "0 13 * * 0"
    # Thursday-night prediction freeze (10pm CT)
    - cron: "0 3 * * 5"
    # Three Questions per game, Friday morning after the freeze (LLM; green
    # no-op until the ANTHROPIC_API_KEY secret exists)
    - cron: "0 9 * * 5"
    # Preseason refresh, daily at 11am UTC through most of August. CFBD
    # publishes the preseason inputs (talent, returning production, coach
    # moves) on its own schedule during the summer, and a rating built before
    # they land is built on a fallback. Rather than watching for it, this
    # retries every morning and preseason-check decides: NOT READY loads
    # nothing, READY loads that day.
    #
    # Stops on the 27th: openers are the last weekend of August, and once a
    # game is final the ratings belong to the Sunday ratings-update job, not to
    # a preseason rebuild. load-preseason.ts refuses to write a season that has
    # already played anyway — this window just keeps the job from waking up to
    # be told no.
    - cron: "0 11 1-27 8 *"

concurrency:
  group: jobs-${{ github.event.schedule || inputs.task }}
  # the hourly scoreboard loops overlap by design; the new run replaces the old
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Resolve task from schedule
        id: task
        run: |
          case "${{ github.event.schedule }}" in
            "0 3,12,17,22 * * *"|"0 13-23 * * 6") echo "task=refresh-lines" >> "$GITHUB_OUTPUT" ;;
            "*/10 15-23 * * 6"|"*/10 0-3 * * 0") echo "task=refresh-lines-burst" >> "$GITHUB_OUTPUT" ;;
            "0 9 * * *") echo "task=sync-games" >> "$GITHUB_OUTPUT" ;;
            "0 15-23 * * 6"|"0 0-4 * * 0"|"0 0-3 * * 5,6") echo "task=scoreboard-loop" >> "$GITHUB_OUTPUT" ;;
            "0 10 * * 6") echo "task=weather" >> "$GITHUB_OUTPUT" ;;
            "0 13 * * 0") echo "task=ratings-update" >> "$GITHUB_OUTPUT" ;;
            "0 3 * * 5") echo "task=freeze" >> "$GITHUB_OUTPUT" ;;
            "0 9 * * 5") echo "task=questions" >> "$GITHUB_OUTPUT" ;;
            "0 11 1-27 8 *") echo "task=preseason-refresh" >> "$GITHUB_OUTPUT" ;;
            "") echo "task=${{ inputs.task }}" >> "$GITHUB_OUTPUT" ;;
            *) echo "task=unknown" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Run job
        run: |
          case "${{ steps.task.outputs.task }}" in
            refresh-lines) npx tsx scripts/refresh-lines.ts ;;
            refresh-lines-burst) npx tsx scripts/refresh-lines.ts --burst ;;
            # daily slot also refreshes poll rankings (AP Sun, CFP Tue — 1 call/day)
            sync-games) npx tsx scripts/sync-games.ts && npx tsx scripts/run-job.ts sync-rankings && npx tsx scripts/run-job.ts sync-systems ;;
            scoreboard-loop) npx tsx scripts/scoreboard-loop.ts --minutes 63 ;;
            sync-rankings|sync-systems|scoreboard|weather|ratings-update|freeze) npx tsx scripts/run-job.ts "${{ steps.task.outputs.task }}" ;;
            # Preview only — the JSON goes to a scratch dir and is discarded.
            preseason-preview) npx tsx scripts/build-preseason.ts --out "$RUNNER_TEMP/preseason" --top 40 ;;
            preseason-check) npx tsx scripts/build-preseason.ts --check --out "$RUNNER_TEMP/preseason-check" ;;
            # Build, then load. --check is the gate: it exits non-zero when an
            # input is still falling back, and we stop there rather than
            # shipping a rating built on last year's talent.
            #
            # A declined refresh exits 0 — on the daily August cron "not ready
            # yet" is the expected answer for most of the month, and a red run
            # every morning would train everyone to ignore it. The standalone
            # preseason-check task keeps its non-zero exit for when you ask the
            # question directly.
            preseason-refresh|preseason-bootstrap)
              DIR="$RUNNER_TEMP/preseason"
              if ! npx tsx scripts/build-preseason.ts --check --out "$DIR-check"; then
                echo "::notice::preseason inputs not ready — nothing loaded"
                exit 0
              fi
              npx tsx scripts/build-preseason.ts --out "$DIR" --top 40
              if [ "${{ steps.task.outputs.task }}" = "preseason-bootstrap" ]; then
                npx tsx scripts/load-preseason.ts --dir "$DIR" --bootstrap
              else
                npx tsx scripts/load-preseason.ts --dir "$DIR"
              fi ;;
            questions|verdicts)
              if [ -z "$ANTHROPIC_API_KEY" ]; then
                echo "ANTHROPIC_API_KEY not set — skipping LLM generation"
              elif [ "${{ steps.task.outputs.task }}" = "questions" ]; then
                npx tsx scripts/generate-questions.ts
              else
                npx tsx scripts/generate-verdicts.ts
              fi ;;
            *) echo "no task matched schedule '${{ github.event.schedule }}'" && exit 1 ;;
          esac
