<style>
/* ── Direction D · Focus + Rail ────────────────────────────────
   --ink   #0E1217  ground        --chalk #E8EDF3  primary text
   --panel #161C24  hero + rail   --dim   #7D8A9B  metadata
   --accent#6EA8FF  interactive   --live  #FF4D5A  live + losses
   Type: Bricolage Grotesque (display) / Instrument Sans (body) / JetBrains Mono (data)
*/

*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark;-webkit-text-size-adjust:100%;overflow-x:clip}
a,button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body{overflow-x:hidden;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-9999px;top:0;z-index:60}
.skip:focus{left:8px;top:8px;padding:10px 14px;background:var(--nav-accent);color:#0a0a0a;
  border-radius:4px;font-weight:700;font-size:13px}
:focus-visible{outline:2px solid var(--nav-accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}


nav[data-bottom-nav]{
  position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;
  background:var(--nav-bg);border-top:1px solid var(--nav-line);
  backdrop-filter:blur(14px);padding-bottom:env(safe-area-inset-bottom)
}
nav[data-bottom-nav] a,nav[data-bottom-nav] button{
  flex:1;min-height:var(--nav-h);border:0;background:transparent;cursor:pointer;
  font-family:inherit;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;text-decoration:none;color:var(--nav-dim);
  font-size:11px;font-weight:600;letter-spacing:.02em
}
nav[data-bottom-nav] [aria-current="page"]{color:var(--nav-on);box-shadow:inset 0 2px 0 var(--nav-accent)}
nav[data-bottom-nav] [aria-current="page"] svg{color:var(--nav-accent)}
nav[data-bottom-nav] svg{width:21px;height:21px}


:root{
  --ink:#0E1217; --panel:#161C24; --chalk:#E8EDF3; --dim:#7D8A9B;
  --accent:#6EA8FF; --live:#FF4D5A; --win:#3FD68A;
  --line:rgba(232,237,243,.10);
  --nav-h:64px; --nav-bg:rgba(14,18,23,.95); --nav-line:var(--line);
  --nav-dim:var(--dim); --nav-on:var(--chalk); --nav-accent:var(--accent);
}
body{background:var(--ink);color:var(--chalk);font-family:"Instrument Sans",system-ui,sans-serif;
  font-size:15px;line-height:1.4}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums lining-nums}
.disp{font-family:"Bricolage Grotesque",sans-serif;font-weight:700}

header{position:sticky;top:0;z-index:20;background:rgba(14,18,23,.9);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.hbar{display:flex;align-items:center;gap:12px;height:52px;padding:0 16px}
.mark{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:18px;letter-spacing:-.02em}
.mark i{font-style:normal;color:var(--accent)}
.sp{flex:1}
.sim{min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:transparent;
  color:var(--dim);font:600 12px "Instrument Sans",sans-serif;cursor:pointer}
.sim[aria-pressed="true"]{color:var(--live);border-color:rgba(255,77,90,.5)}
.wk{font-family:"JetBrains Mono",monospace;font-size:13px;font-weight:500;color:var(--chalk)}

/* ── hero ─────────────────────────────────────────────────────────────── */
.hero{margin:12px;border:1px solid var(--line);border-radius:16px;background:var(--panel);overflow:hidden}
.htop{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:12px 14px 0}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;
  font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.chip.live{background:rgba(255,77,90,.16);color:var(--live)}
.chip.gotw{background:rgba(232,237,243,.12);color:var(--chalk)}
.chip.edge{background:rgba(110,168,255,.15);color:var(--accent)}
.chip.big{background:var(--accent);color:#0b1017}
.chip.cons{background:rgba(63,214,138,.15);color:var(--win)}
.chip.pin{background:rgba(232,237,243,.10);color:var(--dim)}
.chip.upset{background:rgba(255,77,90,.16);color:var(--live)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.is-live .dot{animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.tvw{margin-left:auto;font-family:"JetBrains Mono",monospace;font-size:11.5px;color:var(--dim)}

.trow{display:flex;align-items:center;gap:10px;padding:0 14px;min-height:48px}
.rail{width:4px;height:30px;border-radius:2px;flex:none}
.rk{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--dim);flex:none;min-width:22px}
.nm{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:21px;letter-spacing:-.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.trow.lost .nm,.trow.lost .sc{color:var(--dim)}
.rc{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--dim);flex:none}
.ball{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
.sc{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:34px;line-height:1;
  width:62px;text-align:right;flex:none;font-variant-numeric:tabular-nums}

/* field strip — ball at its true yard line, red zone shaded */
.field{position:relative;height:12px;margin:10px 14px 0;border-radius:4px;overflow:hidden;
  background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),rgba(232,237,243,.09) calc(10% - 1px) 10%),#1B2530}
.field i{position:absolute;top:0;bottom:0}
.ez{width:6%;opacity:.6}
.ez.l{left:0} .ez.r{right:0}
.rz{width:16%;background:rgba(255,77,90,.4)}
.bal{width:3px;background:var(--chalk);border-radius:2px}
.sit{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 14px 0;font-size:12.5px}
.sit b{font-family:"JetBrains Mono",monospace;font-weight:500;color:var(--chalk)}
.sit .d4{background:var(--chalk);color:var(--ink);padding:1px 6px;border-radius:5px;font-weight:700}
.play{padding:6px 14px 0;font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* SIGNATURE — the win-probability ribbon. The bar gets a memory: the whole
   game so far, filled in team colours, current split at the right edge. */
.ribbon{margin:12px 14px 0;position:relative}
.ribbon svg{display:block;width:100%;height:58px;border-radius:8px;background:#111820}
.riblab{display:flex;justify-content:space-between;margin-top:5px;font-family:"JetBrains Mono",monospace;
  font-size:11px;color:var(--dim)}
.riblab b{color:var(--chalk);font-weight:500}
.ribnote{font-size:11px;color:var(--dim);margin-top:3px}

/* odds cells — the app's best interaction, kept verbatim in behaviour */
.odds{display:grid;grid-template-columns:22px 1fr 1fr 1fr;gap:6px;align-items:center;padding:0 14px;margin-top:6px}
.odds .lab{font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--dim)}
.cell{min-height:44px;border:1px solid var(--line);border-radius:8px;background:transparent;
  color:var(--chalk);font-family:"JetBrains Mono",monospace;font-size:13px;font-weight:500;cursor:pointer}
.cell[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#0b1017;font-weight:700}
.oddshead{display:grid;grid-template-columns:22px 1fr 1fr 1fr;gap:6px;padding:10px 14px 0;
  font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);text-align:center}

.hfoot{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:12px;padding:10px 14px 12px;
  border-top:1px solid var(--line);font-size:11.5px;color:var(--dim)}
.sys{display:flex;gap:5px;font-family:"JetBrains Mono",monospace;font-size:11px}
.sys span{padding:2px 5px;border-radius:4px;background:rgba(232,237,243,.06)}
.sys span.agree{color:var(--win);background:rgba(63,214,138,.12)}
.mv{font-family:"JetBrains Mono",monospace;font-weight:500}
.mv.good{color:var(--win)} .mv.bad{color:var(--live)}
.crew{display:flex;gap:3px;margin-left:auto}
.av{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:9.5px;
  font-weight:700;background:#26313E;color:var(--chalk)}
.cover{display:flex;align-items:baseline;gap:8px;padding:9px 14px;background:rgba(63,214,138,.1)}
.cover b{font-family:"Bricolage Grotesque",sans-serif;font-size:14px;text-transform:uppercase;color:var(--win)}
.cover em{font-style:normal;font-size:11px;color:var(--dim);margin-left:auto}

/* ── rail ─────────────────────────────────────────────────────────────── */
.railhead{padding:16px 16px 6px;font-size:11px;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;color:var(--dim)}
.ritem{display:grid;grid-template-columns:3px 1fr auto auto;gap:10px;align-items:center;width:100%;
  min-height:60px;padding:8px 16px;border:0;border-top:1px solid var(--line);background:transparent;
  color:var(--chalk);text-align:left;cursor:pointer;font-family:inherit}
.ritem[aria-current="true"]{background:rgba(110,168,255,.07)}
.rbar{width:3px;height:34px;border-radius:2px;background:linear-gradient(var(--ca),var(--ch))}
.rteams{min-width:0}
.rteams div{display:flex;align-items:baseline;gap:6px;min-width:0}
.rteams .n{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rteams .n.lost{color:var(--dim)}
.rsc{font-family:"JetBrains Mono",monospace;font-size:15px;font-weight:500;text-align:right;width:26px}
.rsc.lost{color:var(--dim)}
.rmeta{text-align:right;font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--dim);min-width:64px}
.rmeta .st{display:block;color:var(--live);font-weight:500}
.rmeta .st.pre{color:var(--dim)}

</style>
</head>

<script>
var SLATE={"week":3,"games":[{"id":401,"status":"in_progress","featured":true,"pinned":true,"away":{"school":"Ohio State","abbr":"OSU","rank":3,"record":"2-0","color":"#BB0000"},"home":{"school":"Texas","abbr":"TEX","rank":7,"record":"1-1","color":"#BF5700"},"awayPoints":24,"homePoints":21,"period":4,"clock":"2:47","possession":"away","situation":"3rd & 7 at TEX 34","down":3,"distance":7,"yardLine":34,"sideToken":"TEX","redZone":false,"lastPlay":"R. Henderson rush for 4 yds to the TEX 34","tv":"FOX","startTs":"3:30 PM","slot":"Afternoon","lines":{"spread":-2.5,"spreadOpen":-3.5,"total":52.5,"totalOpen":54,"mlHome":-135,"mlAway":115},"ratings":{"model":0.6,"sp":-3,"fpi":0.3,"elo":1.1},"watchability":94,"watchCount":84,"weather":{"tempF":78,"windMph":9},"homeWp":0.34,"wpHistory":[0.58,0.61,0.55,0.49,0.52,0.44,0.4,0.47,0.51,0.43,0.38,0.41,0.35,0.3,0.36,0.34],"lineHistory":[{"t":"Mon","v":-3.5},{"t":"Tue","v":-3.5},{"t":"Wed","v":-3},{"t":"Thu","v":-3},{"t":"Fri","v":-2.5},{"t":"Sat","v":-2.5}],"myPick":{"side":"away","label":"OSU","line":2.5},"crewPicks":[{"i":"CV","side":"away"},{"i":"DM","side":"away"},{"i":"RT","side":"home"},{"i":"JL","side":"away"}],"cover":null,"upsetAlert":false},{"id":402,"status":"in_progress","featured":false,"pinned":false,"away":{"school":"Miami (OH)","abbr":"M-OH","rank":null,"record":"0-2","color":"#C3142D"},"home":{"school":"Western Michigan","abbr":"WMU","rank":null,"record":"1-1","color":"#6C4023"},"awayPoints":10,"homePoints":13,"period":2,"clock":"0:41","possession":"home","situation":"1st & 10 at WMU 41","down":1,"distance":10,"yardLine":41,"sideToken":"WMU","redZone":false,"lastPlay":"J. Bell pass complete to T. Owusu for 12 yds","tv":"ESPN+","startTs":"12:00 PM","slot":"Noon","lines":{"spread":-6.5,"spreadOpen":-7.5,"total":48.5,"totalOpen":47.5,"mlHome":-260,"mlAway":210},"ratings":{"model":-5.3,"sp":-7.1,"fpi":-6,"elo":-5.9},"watchability":31,"watchCount":6,"weather":{"tempF":71,"windMph":14},"homeWp":0.62,"wpHistory":[0.71,0.68,0.66,0.7,0.63,0.59,0.64,0.61,0.58,0.62],"lineHistory":[{"t":"Mon","v":-7.5},{"t":"Wed","v":-7},{"t":"Thu","v":-7},{"t":"Fri","v":-6.5},{"t":"Sat","v":-6.5}],"myPick":null,"crewPicks":[{"i":"DM","side":"away"}],"cover":null,"upsetAlert":false},{"id":403,"status":"in_progress","featured":false,"pinned":false,"away":{"school":"Michigan","abbr":"MICH","rank":18,"record":"1-1","color":"#00274C"},"home":{"school":"Oklahoma","abbr":"OU","rank":11,"record":"2-0","color":"#841617"},"awayPoints":17,"homePoints":14,"period":2,"clock":null,"possession":null,"situation":null,"down":null,"distance":null,"yardLine":null,"sideToken":null,"redZone":false,"lastPlay":null,"tv":"NBC","startTs":"7:00 PM","slot":"Primetime","lines":{"spread":-7.5,"spreadOpen":-6.5,"total":45.5,"totalOpen":46.5,"mlHome":-290,"mlAway":235},"ratings":{"model":-5.1,"sp":-6.2,"fpi":-4.9,"elo":-6.8},"watchability":78,"watchCount":41,"weather":{"tempF":84,"windMph":6},"homeWp":0.44,"wpHistory":[0.74,0.7,0.66,0.61,0.58,0.63,0.55,0.49,0.46,0.44],"lineHistory":[{"t":"Mon","v":-6.5},{"t":"Wed","v":-7},{"t":"Thu","v":-7},{"t":"Fri","v":-7.5},{"t":"Sat","v":-7.5}],"myPick":{"side":"away","label":"MICH","line":7.5},"crewPicks":[{"i":"CV","side":"away"},{"i":"RT","side":"away"}],"cover":null,"upsetAlert":true},{"id":404,"status":"completed","featured":false,"pinned":false,"away":{"school":"Alabama","abbr":"ALA","rank":5,"record":"2-0","color":"#9E1B32"},"home":{"school":"Florida State","abbr":"FSU","rank":12,"record":"2-0","color":"#782F40"},"awayPoints":31,"homePoints":27,"period":4,"clock":null,"possession":null,"situation":null,"down":null,"distance":null,"yardLine":null,"sideToken":null,"redZone":false,"lastPlay":null,"tv":"ABC","startTs":"12:00 PM","slot":"Noon","lines":{"spread":3.5,"spreadOpen":2.5,"total":55.5,"totalOpen":54.5,"mlHome":145,"mlAway":-170},"ratings":{"model":1.7,"sp":4.2,"fpi":2.9,"elo":3.1},"watchability":71,"watchCount":52,"weather":{"tempF":88,"windMph":4},"homeWp":0,"wpHistory":[0.42,0.47,0.39,0.44,0.36,0.3,0.35,0.22,0.28,0.14,0.06,0],"lineHistory":[{"t":"Mon","v":2.5},{"t":"Wed","v":3},{"t":"Thu","v":3},{"t":"Fri","v":3.5},{"t":"Sat","v":3.5}],"myPick":{"side":"away","label":"ALA","line":-3.5},"crewPicks":[{"i":"CV","side":"away"},{"i":"DM","side":"home"},{"i":"JL","side":"away"}],"cover":{"word":"Covered","margin":"+0.5","sub":"won by 4, laid 3.5","pick":"ALA -3.5","result":"win"},"upsetAlert":false},{"id":405,"status":"scheduled","featured":false,"pinned":false,"away":{"school":"LSU","abbr":"LSU","rank":9,"record":"2-0","color":"#461D7C"},"home":{"school":"Clemson","abbr":"CLEM","rank":14,"record":"1-1","color":"#F66733"},"awayPoints":null,"homePoints":null,"period":null,"clock":null,"possession":null,"situation":null,"down":null,"distance":null,"yardLine":null,"sideToken":null,"redZone":false,"lastPlay":null,"tv":"ABC","startTs":"7:00 PM","slot":"Primetime","lines":{"spread":-1.5,"spreadOpen":-3,"total":51.5,"totalOpen":50.5,"mlHome":-125,"mlAway":105},"ratings":{"model":-4.4,"sp":-3.8,"fpi":-5.1,"elo":-4},"watchability":88,"watchCount":63,"weather":{"tempF":74,"windMph":3},"homeWp":null,"wpHistory":null,"lineHistory":[{"t":"Mon","v":-3},{"t":"Tue","v":-2.5},{"t":"Wed","v":-2.5},{"t":"Thu","v":-2},{"t":"Fri","v":-1.5},{"t":"Sat","v":-1.5}],"myPick":null,"crewPicks":[{"i":"CV","side":"away"},{"i":"DM","side":"away"},{"i":"RT","side":"away"},{"i":"JL","side":"away"}],"cover":null,"upsetAlert":false},{"id":406,"status":"scheduled","featured":false,"pinned":false,"away":{"school":"App State","abbr":"APP","rank":null,"record":"1-1","color":"#FFCC00"},"home":{"school":"Coastal Carolina","abbr":"CCU","rank":null,"record":"2-0","color":"#007073"},"awayPoints":null,"homePoints":null,"period":null,"clock":null,"possession":null,"situation":null,"down":null,"distance":null,"yardLine":null,"sideToken":null,"redZone":false,"lastPlay":null,"tv":null,"startTs":"10:30 PM","slot":"Late","lines":{"spread":-9.5,"spreadOpen":-8.5,"total":55.5,"totalOpen":56.5,"mlHome":-380,"mlAway":300},"ratings":{"model":-14,"sp":-13.1,"fpi":-8.9,"elo":-13.6},"watchability":42,"watchCount":3,"weather":{"tempF":79,"windMph":11},"homeWp":null,"wpHistory":null,"lineHistory":[{"t":"Mon","v":-8.5},{"t":"Wed","v":-9},{"t":"Thu","v":-9},{"t":"Fri","v":-9.5},{"t":"Sat","v":-9.5}],"myPick":null,"crewPicks":[],"cover":null,"upsetAlert":false}]};

var ord=function(p){return p===1?"1st":p===2?"2nd":p===3?"3rd":p===4?"4th":"OT"};
var sp=function(n){return n===null?"–":(n>0?"+":"")+n.toFixed(1)};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
var isLive=function(g){return g.status==="in_progress"};
var isDone=function(g){return g.status==="completed"};
var isPre=function(g){return g.status==="scheduled"};
var teamSpread=function(g,side){return side==="home"?g.lines.spread:-g.lines.spread};
var ml=function(g,side){var v=side==="home"?g.lines.mlHome:g.lines.mlAway;return v===null?"–":(v>0?"+":"")+v};

/* The model's edge, in points, and which side it lands on. */
var edgeOf=function(g){
  var d=g.ratings.model-g.lines.spread;
  return { pts:Math.abs(d), side: d>0?"away":"home" };
};
var edgeFlag=function(g){var e=edgeOf(g).pts;return e>=4?"BIG":e>=2.5?"EDGE":null};

/* spec §4 consensus: model AND SP+ AND FPI AND Elo all disagree with the
   line in the same direction. Computed, not hardcoded. */
var consensusOf=function(g){
  var m=g.lines.spread, r=g.ratings;
  var v=[r.model,r.sp,r.fpi,r.elo];
  if(v.every(function(x){return x>m})) return "away";
  if(v.every(function(x){return x<m})) return "home";
  return null;
};

/* Movement coloured against the model's side, not by direction. Fixes the
   meaningless green/red in chips.tsx:105-119 — green means "moving your way". */
var moveOf=function(g){
  var d=g.lines.spread-g.lines.spreadOpen;
  if(d===0) return { pts:0, label:"—", tone:"flat" };
  var towards = d>0 ? "away" : "home";
  var side = g.myPick ? g.myPick.side : edgeOf(g).side;
  return { pts:Math.abs(d), label:(d>0?"+":"")+d.toFixed(1), tone: towards===side?"good":"bad", towards:towards };
};

var sideLabel=function(g,s){return s==="home"?g.home.abbr:s==="away"?g.away.abbr:s};
/* True when this rating leans the same way the model does, by a real margin. */
var leansWith=function(g,v){
  var m=g.lines.spread;
  return Math.abs(v-m)>=0.5 && (v>m)===(g.ratings.model>m);
};
var crewSplit=function(g){
  var a=g.crewPicks.filter(function(c){return c.side==="away"}).length;
  return { away:a, home:g.crewPicks.length-a };
};

/* Points → an SVG polyline inside a w×h box. */
var poly=function(vals,w,h,pad){
  pad=pad||0;
  if(!vals||vals.length<2) return "";
  var lo=Math.min.apply(null,vals), hi=Math.max.apply(null,vals), r=(hi-lo)||1;
  return vals.map(function(v,i){
    var x=(i/(vals.length-1))*w;
    var y=pad+(1-(v-lo)/r)*(h-pad*2);
    return x.toFixed(1)+","+y.toFixed(1);
  }).join(" ");
};


var focusId = SLATE.games[0].id;

function ribbon(g){
  var h=58,w=320,vals=g.wpHistory;
  if(!vals) return "";
  var pts=vals.map(function(v,i){return [(i/(vals.length-1))*w, (1-v)*h];});
  var line=pts.map(function(p){return p[0].toFixed(1)+","+p[1].toFixed(1)}).join(" ");
  var homeArea="0,"+h+" "+line+" "+w+","+h;
  var awayArea="0,0 "+line+" "+w+",0";
  var cur=Math.round(g.homeWp*100);
  return '<div class="ribbon">'
    +'<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" role="img" aria-label="Win probability through the game: '+esc(g.home.abbr)+' now '+cur+' percent">'
      +'<polygon points="'+awayArea+'" fill="'+g.away.color+'" opacity=".8"/>'
      +'<polygon points="'+homeArea+'" fill="'+g.home.color+'" opacity=".8"/>'
      +'<line x1="0" y1="'+(h/2)+'" x2="'+w+'" y2="'+(h/2)+'" stroke="rgba(232,237,243,.35)" stroke-width="1" stroke-dasharray="3 3"/>'
      +'<polyline points="'+line+'" fill="none" stroke="#0E1217" stroke-width="2"/>'
    +'</svg>'
    +'<div class="riblab"><span>'+esc(g.away.abbr)+' <b>'+(100-cur)+'%</b></span>'
      +'<span><b>'+cur+'%</b> '+esc(g.home.abbr)+'</span></div>'
    +'<p class="ribnote">Win probability across the whole game — not just now.</p>'
  +'</div>';
}

function fieldStrip(g){
  if(g.yardLine===null) return "";
  var own=g.sideToken===g.home.abbr;
  var pct=own?(100-g.yardLine):g.yardLine;
  return '<div class="field" role="img" aria-label="Ball at the '+esc(g.sideToken)+' '+g.yardLine+'">'
    +'<i class="ez l" style="background:'+g.away.color+'"></i>'
    +'<i class="ez r" style="background:'+g.home.color+'"></i>'
    +(g.redZone?'<i class="rz" style="right:6%"></i>':'')
    +'<i class="bal" style="left:'+pct+'%"></i>'
  +'</div>';
}

function sysRow(g){
  var m=g.lines.spread, r=g.ratings, con=consensusOf(g);
  var keys=[["MOD",r.model],["SP+",r.sp],["FPI",r.fpi],["ELO",r.elo]];
  return '<span class="sys" role="img" aria-label="Model '+sp(r.model)+', SP+ '+sp(r.sp)+', FPI '+sp(r.fpi)+', Elo '+sp(r.elo)+' versus a market line of '+sp(m)+'">'
    + keys.map(function(k){
        return '<span class="'+(leansWith(g,k[1])?"agree":"")+'">'+k[0]+' '+sp(k[1])+'</span>';
      }).join("") + '</span>';
}

function oddsGrid(g){
  var rows=[["away",g.away],["home",g.home]];
  return '<div class="oddshead"><span></span><span>Spread</span><span>Total</span><span>Money</span></div>'
    + rows.map(function(r){
      var side=r[0], t=r[1];
      var tot=(side==="home"?"U ":"O ")+g.lines.total.toFixed(1);
      return '<div class="odds">'
        +'<span class="lab">'+esc(t.abbr)+'</span>'
        +'<button class="cell" aria-pressed="false" aria-label="'+esc(t.abbr)+' '+sp(teamSpread(g,side))+' spread, add to bet slip">'+sp(teamSpread(g,side))+'</button>'
        +'<button class="cell" aria-pressed="false" aria-label="'+(side==="home"?"Under":"Over")+' '+g.lines.total.toFixed(1)+', add to bet slip">'+tot+'</button>'
        +'<button class="cell" aria-pressed="false" aria-label="'+esc(t.abbr)+' moneyline '+ml(g,side)+', add to bet slip">'+ml(g,side)+'</button>'
      +'</div>';
    }).join("");
}

function hero(g){
  var live=isLive(g), done=isDone(g), pre=isPre(g), half=live&&!g.clock;
  var e=edgeOf(g), fl=edgeFlag(g), con=consensusOf(g), mv=moveOf(g);
  var awLost=done&&g.awayPoints<g.homePoints, hmLost=done&&g.homePoints<g.awayPoints;
  var chips="";
  if(live) chips+='<span class="chip live"><i class="dot"></i>'+(half?"Half":ord(g.period)+" "+g.clock)+'</span>';
  if(done) chips+='<span class="chip gotw">Final</span>';
  if(pre)  chips+='<span class="chip gotw">'+esc(g.startTs)+'</span>';
  if(g.featured) chips+='<span class="chip gotw">Game of the week</span>';
  if(g.pinned) chips+='<span class="chip pin">Pinned</span>';
  if(g.upsetAlert) chips+='<span class="chip upset">Upset alert</span>';
  if(fl==="BIG") chips+='<span class="chip big">Big edge '+e.pts.toFixed(1)+' '+sideLabel(g,e.side)+'</span>';
  else if(fl==="EDGE") chips+='<span class="chip edge">Edge '+e.pts.toFixed(1)+' '+sideLabel(g,e.side)+'</span>';
  if(con) chips+='<span class="chip cons">Consensus '+sideLabel(g,con)+'</span>';

  function tr(t,pts,lost,ballSide){
    return '<div class="trow'+(lost?" lost":"")+'">'
      +'<i class="rail" style="background:'+t.color+'"></i>'
      +'<span class="rk">'+(t.rank?"#"+t.rank:"")+'</span>'
      +'<span class="nm">'+esc(t.school)+'</span>'
      +(ballSide?'<i class="ball" aria-label="has possession"></i>':'')
      +'<span class="rc">'+esc(t.record)+'</span>'
      +(pre?'':'<span class="sc">'+pts+'</span>')
    +'</div>';
  }

  var cs=crewSplit(g);
  return '<article class="hero'+(live?" is-live":"")+'">'
    +'<div class="htop">'+chips+'<span class="tvw">'+(g.tv?esc(g.tv):"TBD")+' · '+g.weather.tempF+'° · '+g.weather.windMph+'mph</span></div>'
    +'<p class="sr" aria-live="polite">'+esc(g.away.abbr)+' '+(g.awayPoints===null?"":g.awayPoints)+', '+esc(g.home.abbr)+' '+(g.homePoints===null?"":g.homePoints)+'</p>'
    +tr(g.away,g.awayPoints,awLost,g.possession==="away")
    +tr(g.home,g.homePoints,hmLost,g.possession==="home")
    +fieldStrip(g)
    +(g.situation?'<div class="sit"><b>'+(g.down===4?'<span class="d4">4th &amp; '+g.distance+'</span>':esc(g.situation))+'</b>'
        +(g.redZone?'<span class="chip upset">Red zone</span>':'')+'</div>':'')
    +(g.lastPlay?'<p class="play"><span class="rk">LAST</span> '+esc(g.lastPlay)+'</p>':'')
    +ribbon(g)
    +oddsGrid(g)
    +'<div class="hfoot">'+sysRow(g)
      +'<span class="mv '+mv.tone+'">'+mv.label+' since open</span>'
      +'<span>'+g.watchCount+' watching</span>'
      +'<span>W '+g.watchability+'</span>'
      +(g.crewPicks.length?'<span class="crew">'+g.crewPicks.map(function(c){return '<span class="av" title="'+esc(c.i)+' on '+sideLabel(g,c.side)+'">'+esc(c.i)+'</span>'}).join("")+'</span>':'')
    +'</div>'
    +(g.crewPicks.length?'<div class="hfoot" style="border-top:0;padding-top:0">Crew: '+cs.away+' '+esc(g.away.abbr)+' · '+cs.home+' '+esc(g.home.abbr)+(g.myPick?' · you on '+esc(g.myPick.label)+' '+sp(g.myPick.line):'')+'</div>':'')
    +(g.cover?'<div class="cover"><b>'+esc(g.cover.word)+' '+esc(g.cover.margin)+'</b><em>'+esc(g.cover.pick)+' · '+esc(g.cover.sub)+'</em></div>':'')
  +'</article>';
}

function railItem(g){
  var live=isLive(g), done=isDone(g), pre=isPre(g), half=live&&!g.clock;
  var awLost=done&&g.awayPoints<g.homePoints, hmLost=done&&g.homePoints<g.awayPoints;
  var st = live ? (half?"Half":ord(g.period)+" "+g.clock) : done ? "Final" : g.startTs;
  return '<button class="ritem" data-id="'+g.id+'" aria-current="'+(g.id===focusId)+'" '
    +'style="--ca:'+g.away.color+';--ch:'+g.home.color+'">'
    +'<i class="rbar"></i>'
    +'<span class="rteams">'
      +'<div><span class="n'+(awLost?" lost":"")+'">'+esc(g.away.school)+'</span></div>'
      +'<div><span class="n'+(hmLost?" lost":"")+'">'+esc(g.home.school)+'</span></div>'
    +'</span>'
    +'<span class="rteams" style="text-align:right">'
      +'<div><span class="rsc'+(awLost?" lost":"")+'">'+(pre?"":g.awayPoints)+'</span></div>'
      +'<div><span class="rsc'+(hmLost?" lost":"")+'">'+(pre?"":g.homePoints)+'</span></div>'
    +'</span>'
    +'<span class="rmeta"><span class="st'+(pre?" pre":"")+'">'+esc(st)+'</span>'
      +esc(g.home.abbr)+' '+sp(g.lines.spread)+'</span>'
  +'</button>';
}

function render(){
  var g=SLATE.games.filter(function(x){return x.id===focusId})[0];
  document.getElementById("hero").innerHTML=hero(g);
  document.getElementById("rail").innerHTML=SLATE.games
    .filter(function(x){return x.id!==focusId}).map(railItem).join("");
  document.querySelectorAll(".ritem").forEach(function(b){
    b.addEventListener("click",function(){focusId=+this.dataset.id;render();
      document.getElementById("hero").scrollIntoView({block:"start",behavior:"smooth"});});
  });
  document.querySelectorAll(".cell").forEach(function(c){
    c.addEventListener("click",function(){this.setAttribute("aria-pressed",this.getAttribute("aria-pressed")==="true"?"false":"true")});
  });
}
render();

var timer=null;
document.getElementById("sim").addEventListener("click",function(){
  var on=this.getAttribute("aria-pressed")==="true";
  this.setAttribute("aria-pressed",on?"false":"true");
  if(on){clearInterval(timer);timer=null;return}
  timer=setInterval(function(){
    SLATE.games.forEach(function(g){
      if(!isLive(g))return;
      if(Math.random()<.45){if(Math.random()<.5)g.awayPoints+=(Math.random()<.5?3:7);else g.homePoints+=(Math.random()<.5?3:7);}
      if(g.clock){var p=g.clock.split(":"),s=(+p[0])*60+(+p[1])-13;if(s<0)s=899;g.clock=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}
    });
    // text-node updates only — no re-render, so scroll and layout are untouched
    var g=SLATE.games.filter(function(x){return x.id===focusId})[0];
    var scs=document.querySelectorAll(".hero .sc");
    if(scs[0])scs[0].textContent=g.awayPoints;
    if(scs[1])scs[1].textContent=g.homePoints;
    var lc=document.querySelector(".hero .chip.live");
    if(lc&&g.clock)lc.innerHTML='<i class="dot"></i>'+ord(g.period)+" "+g.clock;
    SLATE.games.forEach(function(x){
      var el=document.querySelector('.ritem[data-id="'+x.id+'"]');
      if(!el||!isLive(x))return;
      var r=el.querySelectorAll(".rsc");
      if(r[0])r[0].textContent=x.awayPoints;
      if(r[1])r[1].textContent=x.homePoints;
      var st=el.querySelector(".st");
      if(st&&x.clock)st.textContent=ord(x.period)+" "+x.clock;
    });
  },2200);
});

</script>
