<style>
/* ── Direction F · Stadium Glass ───────────────────────────────
   --night  #0A0E1A  ground      --chalk #F2F5FA  primary text
   --glass  white 6%  panels     --dim   #8894AB  metadata
   --accent #A78BFA  interactive --live  #FF4D6D  live + losses
   Type: Sora 700 (display) / Figtree 400,600 (body) / DM Mono 500 (data)
   Team colours are the only saturated colour, and they light the card from behind.
*/

*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark;-webkit-text-size-adjust:100%;overflow-x:clip}
a,button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body{overflow-x:hidden;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-9999px;top:0;z-index:60}
.skip:focus{left:8px;top:8px;padding:10px 14px;background:var(--nav-accent);color:#0a0a0a;
  border-radius:4px;font-weight:700;font-size:13px}
:focus-visible{outline:2px solid var(--nav-accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}


nav[data-bottom-nav]{
  position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;
  background:var(--nav-bg);border-top:1px solid var(--nav-line);
  backdrop-filter:blur(14px);padding-bottom:env(safe-area-inset-bottom)
}
nav[data-bottom-nav] a,nav[data-bottom-nav] button{
  flex:1;min-height:var(--nav-h);border:0;background:transparent;cursor:pointer;
  font-family:inherit;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;text-decoration:none;color:var(--nav-dim);
  font-size:11px;font-weight:600;letter-spacing:.02em
}
nav[data-bottom-nav] [aria-current="page"]{color:var(--nav-on);box-shadow:inset 0 2px 0 var(--nav-accent)}
nav[data-bottom-nav] [aria-current="page"] svg{color:var(--nav-accent)}
nav[data-bottom-nav] svg{width:21px;height:21px}


:root{
  --night:#0A0E1A; --chalk:#F2F5FA; --dim:#8894AB; --accent:#A78BFA;
  --live:#FF4D6D; --win:#48E5A0;
  --glass:rgba(242,245,250,.055); --line:rgba(242,245,250,.12);
  --nav-h:64px; --nav-bg:rgba(10,14,26,.9); --nav-line:var(--line);
  --nav-dim:var(--dim); --nav-on:var(--chalk); --nav-accent:var(--accent);
}
body{background:var(--night);color:var(--chalk);font-family:Figtree,system-ui,sans-serif;
  font-size:15px;line-height:1.4}
.m{font-family:"DM Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums lining-nums}
.disp{font-family:Sora,sans-serif;font-weight:700;letter-spacing:-.03em}

header{position:sticky;top:0;z-index:20;background:rgba(10,14,26,.72);backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.hbar{display:flex;align-items:center;gap:12px;height:54px;padding:0 16px}
.mark{font-family:Sora,sans-serif;font-weight:700;font-size:17px;letter-spacing:-.03em}
.mark i{font-style:normal;color:var(--accent)}
.sp{flex:1}
.sim{min-height:44px;padding:0 13px;border:1px solid var(--line);border-radius:11px;background:var(--glass);
  color:var(--dim);font:600 12px Figtree,sans-serif;cursor:pointer}
.sim[aria-pressed="true"]{color:var(--live);border-color:rgba(255,77,109,.5)}
.wk{font-family:"DM Mono",monospace;font-size:13px}

main{padding:14px 14px 20px;display:flex;flex-direction:column;gap:16px}

/* SIGNATURE — the aura. Each card floats over a blurred wash of the two team
   colours; live games burn brighter, a game inside two minutes brightest of
   all, and a pinned game keeps a ring. Depth is the hierarchy: finals recede. */
.wrap{position:relative;isolation:isolate;overflow:visible}
.aura{position:absolute;inset:-16px 0;z-index:-1;border-radius:32px;filter:blur(34px);opacity:var(--glow)}
.aura i{position:absolute;top:0;bottom:0;width:58%;border-radius:50%}
.aura .a{left:0} .aura .b{right:0}

.card{position:relative;border:1px solid var(--line);border-radius:20px;background:rgba(11,15,28,.80);
  backdrop-filter:blur(22px);overflow:hidden}
.card.pinned{box-shadow:0 0 0 1px var(--accent), 0 0 0 5px rgba(167,139,250,.16)}
.card.done{opacity:.62;filter:saturate(.7)}

.top{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:13px 15px 0}
.chip{display:inline-flex;align-items:center;gap:5px;height:23px;padding:0 9px;border-radius:999px;
  font-size:11px;font-weight:600;letter-spacing:.03em;white-space:nowrap;
  background:rgba(242,245,250,.1)}
.chip.live{background:rgba(255,77,109,.2);color:#FFA9BC}
.chip.edge{background:rgba(167,139,250,.2);color:#CDBDFF}
.chip.big{background:var(--accent);color:#160E2A}
.chip.cons{background:rgba(72,229,160,.18);color:var(--win)}
.chip.upset{background:rgba(255,77,109,.2);color:#FFA9BC}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.is-live .dot{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.tv{margin-left:auto;font-family:"DM Mono",monospace;font-size:11.5px;color:var(--dim)}

.tm{display:flex;align-items:center;gap:10px;padding:0 15px;min-height:48px}
.mk{width:9px;height:30px;border-radius:999px;flex:none}
.rk{font-family:"DM Mono",monospace;font-size:11.5px;color:var(--dim);flex:none;min-width:21px}
.rk:empty{display:none}
.nm{font-family:Sora,sans-serif;font-weight:700;font-size:19px;letter-spacing:-.03em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.tm.lost .nm,.tm.lost .sc{color:var(--dim)}
.rc{font-family:"DM Mono",monospace;font-size:11px;color:var(--dim);flex:none}
.ball{width:7px;height:7px;border-radius:50%;background:var(--chalk);flex:none}
.sc{font-family:Sora,sans-serif;font-weight:700;font-size:30px;line-height:1;width:56px;
  text-align:right;flex:none;font-variant-numeric:tabular-nums;letter-spacing:-.04em}

.field{position:relative;height:10px;margin:9px 15px 0;border-radius:999px;overflow:hidden;
  background:rgba(242,245,250,.08)}
.field i{position:absolute;top:0;bottom:0}
.ez{width:7%;opacity:.75} .ez.l{left:0} .ez.r{right:0}
.rz{width:16%;right:7%;background:rgba(255,77,109,.5)}
.bal{width:3px;background:var(--chalk);border-radius:2px}
.sit{padding:8px 15px 0;font-size:12.5px;font-family:"DM Mono",monospace}
.sit .d4{background:var(--chalk);color:var(--night);padding:1px 6px;border-radius:6px;font-weight:500}
.play{padding:5px 15px 0;font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.wp{padding:11px 15px 0}
.wpbar{display:flex;height:7px;border-radius:999px;overflow:hidden;background:rgba(242,245,250,.1)}
.wplab{display:flex;justify-content:space-between;font-family:"DM Mono",monospace;font-size:10.5px;
  color:var(--dim);margin-bottom:5px}
.wplab b{color:var(--chalk);font-weight:500}

.odds{display:grid;grid-template-columns:26px repeat(3,1fr);gap:6px;padding:10px 15px 0;align-items:center}
.odds .who{font-family:"DM Mono",monospace;font-size:10px;color:var(--dim)}
.cell{min-height:44px;border:1px solid var(--line);border-radius:11px;background:rgba(242,245,250,.04);
  color:var(--chalk);font-family:"DM Mono",monospace;font-size:12.5px;cursor:pointer}
.cell[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#160E2A;font-weight:500}

.foot{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin-top:11px;padding:9px 15px 13px;
  border-top:1px solid var(--line);font-size:11px;color:var(--dim)}
.sys{display:flex;gap:4px;font-family:"DM Mono",monospace;font-size:10.5px}
.sys span{padding:2px 6px;border-radius:999px;background:rgba(242,245,250,.07)}
.sys span.dis{color:var(--accent);background:rgba(167,139,250,.14)}
.mv{font-family:"DM Mono",monospace}
.mv.good{color:var(--win)} .mv.bad{color:var(--live)}
.crew{display:flex;gap:3px;margin-left:auto}
.av{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:9.5px;
  font-weight:600;background:rgba(242,245,250,.13);color:var(--chalk)}
.cover{display:flex;align-items:baseline;gap:9px;padding:10px 15px;background:rgba(72,229,160,.12)}
.cover b{font-family:Sora,sans-serif;font-size:14px;color:var(--win);letter-spacing:-.02em}
.cover em{font-style:normal;font-size:11px;color:var(--dim);margin-left:auto}

:-380,"mlAway":300},"ratings":{"model":-14,"sp":-13.1,"fpi":-8.9,"elo":-13.6},"watchability":42,"watchCount":3,"weather":{"tempF":79,"windMph":11},"homeWp":null,"wpHistory":null,"lineHistory":[{"t":"Mon","v":-8.5},{"t":"Wed","v":-9},{"t":"Thu","v":-9},{"t":"Fri","v":-9.5},{"t":"Sat","v":-9.5}],"myPick":null,"crewPicks":[],"cover":null,"upsetAlert":false}]};

var ord=function(p){return p===1?"1st":p===2?"2nd":p===3?"3rd":p===4?"4th":"OT"};
var sp=function(n){return n===null?"–":(n>0?"+":"")+n.toFixed(1)};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
var isLive=function(g){return g.status==="in_progress"};
var isDone=function(g){return g.status==="completed"};
var isPre=function(g){return g.status==="scheduled"};
var teamSpread=function(g,side){return side==="home"?g.lines.spread:-g.lines.spread};
var ml=function(g,side){var v=side==="home"?g.lines.mlHome:g.lines.mlAway;return v===null?"–":(v>0?"+":"")+v};

/* The model's edge, in points, and which side it lands on. */
var edgeOf=function(g){
  var d=g.ratings.model-g.lines.spread;
  return { pts:Math.abs(d), side: d>0?"away":"home" };
};
var edgeFlag=function(g){var e=edgeOf(g).pts;return e>=4?"BIG":e>=2.5?"EDGE":null};

/* spec §4 consensus: model AND SP+ AND FPI AND Elo all disagree with the
   line in the same direction. Computed, not hardcoded. */
var consensusOf=function(g){
  var m=g.lines.spread, r=g.ratings;
  var v=[r.model,r.sp,r.fpi,r.elo];
  if(v.every(function(x){return x>m})) return "away";
  if(v.every(function(x){return x<m})) return "home";
  return null;
};

/* Movement coloured against the model's side, not by direction. Fixes the
   meaningless green/red in chips.tsx:105-119 — green means "moving your way". */
var moveOf=function(g){
  var d=g.lines.spread-g.lines.spreadOpen;
  if(d===0) return { pts:0, label:"—", tone:"flat" };
  var towards = d>0 ? "away" : "home";
  var side = g.myPick ? g.myPick.side : edgeOf(g).side;
  return { pts:Math.abs(d), label:(d>0?"+":"")+d.toFixed(1), tone: towards===side?"good":"bad", towards:towards };
};

var sideLabel=function(g,s){return s==="home"?g.home.abbr:s==="away"?g.away.abbr:s};
/* True when this rating leans the same way the model does, by a real margin. */
var leansWith=function(g,v){
  var m=g.lines.spread;
  return Math.abs(v-m)>=0.5 && (v>m)===(g.ratings.model>m);
};
var crewSplit=function(g){
  var a=g.crewPicks.filter(function(c){return c.side==="away"}).length;
  return { away:a, home:g.crewPicks.length-a };
};

/* Points → an SVG polyline inside a w×h box. */
var poly=function(vals,w,h,pad){
  pad=pad||0;
  if(!vals||vals.length<2) return "";
  var lo=Math.min.apply(null,vals), hi=Math.max.apply(null,vals), r=(hi-lo)||1;
  return vals.map(function(v,i){
    var x=(i/(vals.length-1))*w;
    var y=pad+(1-(v-lo)/r)*(h-pad*2);
    return x.toFixed(1)+","+y.toFixed(1);
  }).join(" ");
};


/* Urgency drives the aura: inside two minutes burns hardest. */
function glowOf(g){
  if(isDone(g)) return 0;
  if(!isLive(g)) return .22;
  if(g.period>=4 && g.clock){var p=g.clock.split(":");if((+p[0])<2) return 1;}
  return .6;
}

function card(g){
  var live=isLive(g), done=isDone(g), pre=isPre(g), half=live&&!g.clock;
  var e=edgeOf(g), fl=edgeFlag(g), con=consensusOf(g), mv=moveOf(g);
  var awLost=done&&g.awayPoints<g.homePoints, hmLost=done&&g.homePoints<g.awayPoints;
  var m=g.lines.spread, r=g.ratings;
  var chips="";
  if(live) chips+='<span class="chip live"><i class="dot"></i>'+(half?"Half":ord(g.period)+" "+g.clock)+'</span>';
  if(done) chips+='<span class="chip">Final</span>';
  if(pre)  chips+='<span class="chip">'+esc(g.startTs)+'</span>';
  if(g.featured) chips+='<span class="chip">Game of the week</span>';
  if(g.upsetAlert) chips+='<span class="chip upset">Upset alert</span>';
  if(fl==="BIG") chips+='<span class="chip big">Big edge '+e.pts.toFixed(1)+'</span>';
  else if(fl==="EDGE") chips+='<span class="chip edge">Edge '+e.pts.toFixed(1)+' '+esc(sideLabel(g,e.side))+'</span>';
  if(con) chips+='<span class="chip cons">Consensus '+esc(sideLabel(g,con))+'</span>';
  if(g.myPick) chips+='<span class="chip">You '+esc(g.myPick.label)+' '+sp(g.myPick.line)+'</span>';

  function tm(t,pts,lost,ball){
    return '<div class="tm'+(lost?" lost":"")+'">'
      +'<i class="mk" style="background:'+t.color+'"></i>'
      +'<span class="rk">'+(t.rank?"#"+t.rank:"")+'</span>'
      +'<span class="nm">'+esc(t.school)+'</span>'
      +(ball?'<i class="ball" aria-label="has possession"></i>':'')
      +'<span class="rc">'+esc(t.record)+'</span>'
      +(pre?'':'<span class="sc">'+pts+'</span>')
    +'</div>';
  }
  var wpHome = g.homeWp===null ? null : Math.round(g.homeWp*100);
  var cs=crewSplit(g);

  return '<div class="wrap">'
    +'<div class="aura" aria-hidden="true" style="--glow:'+glowOf(g)+'">'
      +'<i class="a" style="background:'+g.away.color+'"></i><i class="b" style="background:'+g.home.color+'"></i>'
    +'</div>'
    +'<article class="card'+(live?" is-live":"")+(done?" done":"")+(g.pinned?" pinned":"")+'" data-id="'+g.id+'">'
      +'<div class="top">'+chips+'<span class="tv">'+(g.tv?esc(g.tv):"TBD")+' · '+g.weather.tempF+'°</span></div>'
      +'<p class="sr" aria-live="polite">'+esc(g.away.abbr)+' '+(g.awayPoints===null?"":g.awayPoints)+', '+esc(g.home.abbr)+' '+(g.homePoints===null?"":g.homePoints)+'</p>'
      +tm(g.away,g.awayPoints,awLost,g.possession==="away")
      +tm(g.home,g.homePoints,hmLost,g.possession==="home")
      +(g.yardLine!==null?'<div class="field" role="img" aria-label="Ball at the '+esc(g.sideToken)+' '+g.yardLine+'"><i class="ez l" style="background:'+g.away.color+'"></i><i class="ez r" style="background:'+g.home.color+'"></i>'+(g.redZone?'<i class="rz"></i>':'')+'<i class="bal" style="left:'+(g.sideToken===g.home.abbr?100-g.yardLine:g.yardLine)+'%"></i></div>':'')
      +(g.situation?'<div class="sit">'+(g.down===4?'<span class="d4">4th &amp; '+g.distance+'</span>':esc(g.situation))+'</div>':'')
      +(g.lastPlay?'<p class="play">'+esc(g.lastPlay)+'</p>':'')
      +(wpHome!==null?'<div class="wp"><div class="wplab"><span>'+esc(g.away.abbr)+' <b>'+(100-wpHome)+'%</b></span><span><b>'+wpHome+'%</b> '+esc(g.home.abbr)+'</span></div>'
        +'<div class="wpbar" role="img" aria-label="Win probability '+esc(g.away.abbr)+' '+(100-wpHome)+' percent, '+esc(g.home.abbr)+' '+wpHome+' percent">'
        +'<i style="width:'+(100-wpHome)+'%;background:'+g.away.color+'"></i><i style="flex:1;background:'+g.home.color+'"></i></div></div>':'')
      +'<div class="odds"><span class="who">'+esc(g.away.abbr)+'</span>'
        +'<button class="cell" aria-pressed="false" aria-label="'+esc(g.away.abbr)+' '+sp(teamSpread(g,"away"))+' spread, add to bet slip">'+sp(teamSpread(g,"away"))+'</button>'
        +'<button class="cell" aria-pressed="false" aria-label="Over '+g.lines.total.toFixed(1)+', add to bet slip">O '+g.lines.total.toFixed(1)+'</button>'
        +'<button class="cell" aria-pressed="false" aria-label="'+esc(g.away.abbr)+' moneyline '+ml(g,"away")+', add to bet slip">'+ml(g,"away")+'</button>'
      +'</div>'
      +'<div class="odds"><span class="who">'+esc(g.home.abbr)+'</span>'
        +'<button class="cell" aria-pressed="false" aria-label="'+esc(g.home.abbr)+' '+sp(teamSpread(g,"home"))+' spread, add to bet slip">'+sp(teamSpread(g,"home"))+'</button>'
        +'<button class="cell" aria-pressed="false" aria-label="Under '+g.lines.total.toFixed(1)+', add to bet slip">U '+g.lines.total.toFixed(1)+'</button>'
        +'<button class="cell" aria-pressed="false" aria-label="'+esc(g.home.abbr)+' moneyline '+ml(g,"home")+', add to bet slip">'+ml(g,"home")+'</button>'
      +'</div>'
      +'<div class="foot">'
        +'<span class="sys">'
          +[["MOD",r.model],["SP+",r.sp],["FPI",r.fpi],["ELO",r.elo]].map(function(k){
              return '<span class="'+(leansWith(g,k[1])?"dis":"")+'">'+k[0]+' '+sp(k[1])+'</span>';
            }).join("")
        +'</span>'
        +'<span class="mv '+mv.tone+'">'+mv.label+'</span>'
        +'<span>'+g.watchCount+' watching · W'+g.watchability+'</span>'
        +(g.pinned?'<span>Pinned</span>':'')
        +(g.crewPicks.length?'<span class="crew">'+g.crewPicks.map(function(c){return '<span class="av" title="'+esc(c.i)+' on '+esc(sideLabel(g,c.side))+'">'+esc(c.i)+'</span>'}).join("")+'</span>':'')
      +'</div>'
      +(g.crewPicks.length?'<div class="foot" style="border-top:0;padding-top:0;margin-top:0">Crew '+cs.away+' '+esc(g.away.abbr)+' · '+cs.home+' '+esc(g.home.abbr)+'</div>':'')
      +(g.cover?'<div class="cover"><b>'+esc(g.cover.word)+' '+esc(g.cover.margin)+'</b><em>'+esc(g.cover.pick)+'</em></div>':'')
    +'</article>'
  +'</div>';
}

document.getElementById("list").innerHTML=SLATE.games.map(card).join("");
document.querySelectorAll(".cell").forEach(function(c){
  c.addEventListener("click",function(){this.setAttribute("aria-pressed",this.getAttribute("aria-pressed")==="true"?"false":"true")});
});

document.getElementById("sim").addEventListener("click",function(){
  var on=this.getAttribute("aria-pressed")==="true";
  this.setAttribute("aria-pressed",on?"false":"true");
  if(on){clearInterval(timer);timer=null;return}
  timer=setInterval(function(){
    SLATE.games.forEach(function(g){
      if(!isLive(g))return;
      if(Math.random()<.45){if(Math.random()<.5)g.awayPoints+=(Math.random()<.5?3:7);else g.homePoints+=(Math.random()<.5?3:7);}
      if(g.clock){var p=g.clock.split(":"),s=(+p[0])*60+(+p[1])-13;if(s<0)s=899;g.clock=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}
      var el=document.querySelector('.card[data-id="'+g.id+'"]');if(!el)return;
      var sc=el.querySelectorAll(".sc");
      if(sc[0])sc[0].textContent=g.awayPoints;
      if(sc[1])sc[1].textContent=g.homePoints;
      var lc=el.querySelector(".chip.live");
      if(lc&&g.clock)lc.innerHTML='<i class="dot"></i>'+ord(g.period)+" "+g.clock;
      var au=el.parentNode.querySelector(".aura");
      if(au)au.style.setProperty("--glow",glowOf(g));
    });
  },2200);
});

</script>
</body>
</html>
