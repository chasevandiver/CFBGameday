<style>
/* ── Direction C · Night Ticket ────────────────────────────────────────────
   Palette (6 named values)
   --deep      #0D1220  page ground, behind the tickets
   --night     #131A2B  the ticket body
   --stub      #E8E1CE  the torn stub — the one light surface in the app
   --stub-ink  #2A2418  type on the stub
   --stamp     #C8462F  the LIVE stamp
   --gold      #D9A441  signage gold: lines, totals, the FINAL stamp
   Type: Alfa Slab One (display, sparing) / Work Sans (body) / Courier Prime (data) */

:root{
  --deep:#0D1220; --night:#131A2B; --stub:#E8E1CE; --stub-ink:#2A2418;
  --stamp:#C8462F; --gold:#D9A441;
  --paper-dim:#7A705A; --chalk:#EFECE3; --dim:#8792A8;
  --nav-h:64px; --stub-w:88px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark}
a,button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--deep); color:var(--chalk);
  font-family:"Work Sans",system-ui,sans-serif; font-size:14px; line-height:1.4;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
  overflow-x:hidden;
}
.mono{font-family:"Courier Prime",ui-monospace,monospace;font-variant-numeric:tabular-nums lining-nums}

header{
  position:sticky;top:0;z-index:20;background:rgba(13,18,32,.9);backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(239,236,227,.09);padding-top:env(safe-area-inset-top)
}
.hbar{display:flex;align-items:center;gap:var(--s3);height:54px;padding:0 var(--s4)}
.mark{font-family:"Alfa Slab One",serif;font-size:17px;color:var(--gold);letter-spacing:.01em}
.hspacer{flex:1}
.simbtn{min-height:44px;padding:0 var(--s3);border:1px solid rgba(239,236,227,.16);border-radius:4px;
  background:transparent;color:var(--dim);font:600 12px "Work Sans",sans-serif;cursor:pointer}
.simbtn[aria-pressed="true"]{color:var(--stamp);border-color:rgba(200,70,47,.6)}
.wk{font-family:"Courier Prime",monospace;font-weight:700;font-size:13px;color:var(--chalk);
  letter-spacing:.08em}

main{padding:var(--s3) var(--s3) var(--s4);display:flex;flex-direction:column;gap:var(--s3)}

/* ── the ticket ───────────────────────────────────────────────────────── */
.ticket{
  position:relative;display:grid;grid-template-columns:minmax(0,1fr) var(--stub-w);
  background:var(--night);border-radius:8px;
  box-shadow:0 1px 0 rgba(239,236,227,.05) inset, 0 10px 22px -14px rgba(0,0,0,.9)
}
.body{padding:var(--s3) 10px var(--s3) var(--s3);min-width:0}

/* SIGNATURE — the perforated stub. Dashed tear line plus punched notches
   top and bottom, so the stub reads as a physically separable piece.      */
.stub{
  position:relative;background:var(--stub);color:var(--stub-ink);
  border-radius:0 8px 8px 0;padding:var(--s2) 6px 10px;
  display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center
}
.stub::before{
  content:"";position:absolute;left:0;top:7px;bottom:7px;
  border-left:2px dashed rgba(42,36,24,.34)
}
.notch{position:absolute;left:-5px;width:10px;height:10px;border-radius:50%;background:var(--deep)}
.notch.t{top:-5px} .notch.b{bottom:-5px}

/* stamped onto the stub — ink on paper, never over the score */
.stamp{
  font-family:"Alfa Slab One",serif;font-size:15px;letter-spacing:.06em;
  transform:rotate(-7deg);border:2px solid currentColor;border-radius:3px;
  padding:1px 7px;opacity:.82;line-height:1.25;margin-top:2px
}
.stamp.live{color:var(--stamp)}
.stamp.final{color:var(--paper-dim)}
.stamp.kick{color:var(--paper-dim);font-family:"Courier Prime",monospace;font-weight:700;
  font-size:12px;border-style:dashed;transform:rotate(-3deg)}
.is-live .stamp.live{animation:ink 2.6s ease-in-out infinite}
@keyframes ink{0%,100%{opacity:.85}50%{opacity:.5}}

.stublab{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--paper-dim)}
.stubpick{font-family:"Courier Prime",monospace;font-weight:700;font-size:15px;line-height:1.15}
.stubline{font-family:"Courier Prime",monospace;font-size:13px;color:#5C5340}
.pickbtn{
  width:100%;min-height:44px;border:1.5px solid rgba(42,36,24,.3);border-radius:4px;
  background:transparent;color:var(--stub-ink);cursor:pointer;
  font-family:"Courier Prime",monospace;font-weight:700;font-size:12.5px;
  display:flex;flex-direction:column;justify-content:center;line-height:1.2
}
.pickbtn + .pickbtn{margin-top:-1px}
.pickbtn:active{background:rgba(42,36,24,.09)}
.pickbtn span{font-family:"Work Sans",sans-serif;font-size:11px;font-weight:600;color:#6B6250}

/* crew picks as punched holes, tinted with the side they took */
.holes{display:flex;gap:4px;margin-top:auto;padding-top:6px}
.holes i{width:11px;height:11px;border-radius:50%;display:block;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.45)}
.holes.empty{color:var(--paper-dim);font-size:11px;font-style:normal}

/* ── matchup body ─────────────────────────────────────────────────────── */
.top{display:flex;align-items:center;gap:var(--s2);min-height:18px}
.gotw{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.upset{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--stamp)}
.tv{margin-left:auto;font-family:"Courier Prime",monospace;font-size:11.5px;color:var(--dim);letter-spacing:.04em}

.tm{display:flex;align-items:center;gap:7px;min-height:44px}
.rail{width:3px;height:26px;border-radius:2px;flex:none}
.rk{font-family:"Courier Prime",monospace;font-size:11.5px;color:var(--dim);flex:none;min-width:19px}
.rk:empty{display:none}
.nm{font-size:15.5px;font-weight:600;letter-spacing:-.012em;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;min-width:0;flex:1}
.tm.lost .nm{color:var(--dim)}
.rc{font-family:"Courier Prime",monospace;font-size:11px;color:var(--dim);flex:none}
.ball{width:7px;height:7px;border-radius:50%;background:var(--gold);flex:none}
/* fixed box so 9 → 10 shifts nothing, whatever the display face does */
.sc{font-family:"Alfa Slab One",serif;font-size:25px;line-height:1;width:45px;text-align:right;
  flex:none;font-variant-numeric:tabular-nums}
.tm.lost .sc{color:var(--dim)}

.strip{
  display:flex;align-items:center;gap:var(--s2);margin-top:10px;padding-top:9px;
  border-top:1px solid rgba(239,236,227,.09);font-size:11.5px;color:var(--dim);min-width:0
}
.strip .sit{color:var(--chalk);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.strip .num{font-family:"Courier Prime",monospace;color:var(--gold);font-weight:700;flex:none}
.strip .edge{font-family:"Courier Prime",monospace;font-weight:700;color:#E8913C;flex:none}
.strip .edge.big{background:#E8913C;color:var(--night);padding:1px 5px;border-radius:3px}
.strip .cons{color:var(--gold);font-weight:600;flex:none}
.play{margin-top:6px;font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cover{margin-top:8px;padding-top:8px;border-top:1px solid rgba(239,236,227,.09);
  font-size:12px;color:#79D6A4;font-weight:600}
.cover b{font-family:"Courier Prime",monospace}
.cover em{font-style:normal;color:var(--dim);font-weight:400}

/* ── bottom nav, styled as a strip of stubs ───────────────────────────── */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
  background:rgba(13,18,32,.95);backdrop-filter:blur(14px);
  border-top:1px solid rgba(239,236,227,.1);
  padding-bottom:env(safe-area-inset-bottom)
}
nav a, nav button.navitem{
  border:0;background:transparent;cursor:pointer;font-family:inherit;
  flex:1;min-height:var(--nav-h);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;text-decoration:none;color:var(--dim);
  font-size:10.5px;font-weight:600;letter-spacing:.03em;position:relative
}
nav a + a::before{content:"";position:absolute;left:0;top:14px;bottom:14px;
  border-left:1px dashed rgba(239,236,227,.13)}
nav a[aria-current="page"], nav .navitem[aria-current="page"]{color:var(--stub)}
nav a[aria-current="page"], nav .navitem[aria-current="page"] svg{color:var(--gold)}
nav svg{width:21px;height:21px}
.sheet{
  overscroll-behavior:contain;
  position:fixed;inset:auto 0 0 0;z-index:40;background:var(--stub);color:var(--stub-ink);
  border-radius:12px 12px 0 0;
  padding:var(--s4) var(--s4) calc(var(--s4) + env(safe-area-inset-bottom));
  transform:translateY(101%);transition:transform .22s ease
}
.sheet[data-open="true"]{transform:translateY(0)}
.sheet h2{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--paper-dim);margin-bottom:var(--s3)}
.sheet div{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--s2)}
.sheet a{min-height:48px;display:flex;align-items:center;padding:0 var(--s3);
  border:1.5px solid rgba(42,36,24,.25);border-radius:5px;color:var(--stub-ink);
  text-decoration:none;font-size:14px;font-weight:600}
.scrim{position:fixed;inset:0;z-index:35;background:rgba(13,18,32,.66);opacity:0;pointer-events:none;transition:opacity .22s}
.scrim[data-open="true"]{opacity:1;pointer-events:auto}

:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-9999px;top:0;z-index:60}
.skip:focus{left:8px;top:8px;padding:8px 12px;background:var(--gold);color:#0B0B09;border-radius:4px;font-weight:700;font-size:13px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<a class="skip" href="#main">Skip to scores</a>
<h1 class="sr">Direction C — Night Ticket — live scores, week 3</h1>

<header>
  <div class="hbar">
    <div class="mark">The CFB Slate</div>
    <div class="hspacer"></div>
    <button class="simbtn" id="sim" aria-pressed="false">Sim</button>
    <div class="wk">WK 3</div>
  </div>
</header>

<main id="main"><div id="list" style="display:flex;flex-direction:column;gap:12px"></div></main>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="More pages">
  <h2>More</h2>
  <div>
    <a href="#">Rankings</a><a href="#">Ratings</a>
    <a href="#">Standings</a><a href="#">Teams</a>
    <a href="#">Receipts</a><a href="#">Rules</a>
  </div>
</div>

<nav aria-label="Primary">
  <a href="#" aria-current="page"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="14" width="18" height="6" rx="1.5"/></svg>Slate</a>
  <a href="#"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17l5-6 4 4 8-9"/><path d="M16 6h5v5"/></svg>Edges</a>
  <a href="#"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v14H4z"/><path d="M8 9h8M8 13h5"/></svg>Ledger</a>
  <a href="#"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0112 0"/><circle cx="17" cy="9" r="2.5"/></svg>Crew</a>
  <button type="button" class="navitem" id="more" aria-expanded="false" aria-controls="sheet"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>More</button>
</nav>

<script>
/* Shared mock slate — field names mirror GameView in src/lib/slate.ts:69. */
window.SLATE={week:3,games:[
{id:401,status:"in_progress",featured:true,away:{school:"Ohio State",abbr:"OSU",rank:3,record:"2-0",color:"#BB0000"},home:{school:"Texas",abbr:"TEX",rank:7,record:"1-1",color:"#BF5700"},awayPoints:24,homePoints:21,period:4,clock:"2:47",possession:"away",situation:"3rd & 7 at TEX 34",lastPlay:"R. Henderson rush for 4 yds to the TEX 34",tv:"FOX",startTs:null,lines:{spread:-2.5,spreadOpen:-3.5,total:52.5,totalOpen:54},edge:3.1,edgeFlag:"EDGE",consensus:false,myPick:{side:"OSU",line:2.5},crewPicks:[{initials:"CV",side:"away"},{initials:"DM",side:"away"},{initials:"RT",side:"home"},{initials:"JL",side:"away"}],cover:null,upsetAlert:false},
{id:402,status:"in_progress",featured:false,away:{school:"Miami (OH)",abbr:"M-OH",rank:null,record:"0-2",color:"#C3142D"},home:{school:"Western Michigan",abbr:"WMU",rank:null,record:"1-1",color:"#6C4023"},awayPoints:10,homePoints:13,period:2,clock:"0:41",possession:"home",situation:"1st & 10 at WMU 41",lastPlay:"J. Bell pass complete to T. Owusu for 12 yds",tv:"ESPN+",startTs:null,lines:{spread:-6.5,spreadOpen:-7.5,total:48.5,totalOpen:47.5},edge:1.2,edgeFlag:null,consensus:false,myPick:null,crewPicks:[{initials:"DM",side:"away"}],cover:null,upsetAlert:false},
{id:403,status:"in_progress",featured:false,away:{school:"Michigan",abbr:"MICH",rank:18,record:"1-1",color:"#00274C"},home:{school:"Oklahoma",abbr:"OU",rank:11,record:"2-0",color:"#841617"},awayPoints:17,homePoints:14,period:2,clock:null,possession:null,situation:null,lastPlay:null,tv:"NBC",startTs:null,lines:{spread:-7.5,spreadOpen:-6.5,total:45.5,totalOpen:46.5},edge:2.4,edgeFlag:null,consensus:false,myPick:{side:"MICH",line:7.5},crewPicks:[{initials:"CV",side:"away"},{initials:"RT",side:"away"}],cover:null,upsetAlert:true},
{id:404,status:"completed",featured:false,away:{school:"Alabama",abbr:"ALA",rank:5,record:"2-0",color:"#9E1B32"},home:{school:"Florida State",abbr:"FSU",rank:12,record:"2-0",color:"#782F40"},awayPoints:31,homePoints:27,period:4,clock:null,possession:null,situation:null,lastPlay:null,tv:"ABC",startTs:null,lines:{spread:3.5,spreadOpen:2.5,total:55.5,totalOpen:54.5},edge:1.8,edgeFlag:null,consensus:false,myPick:{side:"ALA",line:-3.5},crewPicks:[{initials:"CV",side:"away"},{initials:"DM",side:"home"},{initials:"JL",side:"away"}],cover:{word:"Covered",margin:"+0.5",sub:"won by 4, laid 3.5",pick:"ALA -3.5"},upsetAlert:false},
{id:405,status:"scheduled",featured:false,away:{school:"LSU",abbr:"LSU",rank:9,record:"2-0",color:"#461D7C"},home:{school:"Clemson",abbr:"CLEM",rank:14,record:"1-1",color:"#F66733"},awayPoints:null,homePoints:null,period:null,clock:null,possession:null,situation:null,lastPlay:null,tv:"ABC",startTs:"7:00 PM",lines:{spread:-1.5,spreadOpen:-3.0,total:51.5,totalOpen:50.5},edge:2.9,edgeFlag:"EDGE",consensus:true,myPick:null,crewPicks:[{initials:"CV",side:"away"},{initials:"DM",side:"away"},{initials:"RT",side:"away"},{initials:"JL",side:"away"}],cover:null,upsetAlert:false},
{id:406,status:"scheduled",featured:false,away:{school:"App State",abbr:"APP",rank:null,record:"1-1",color:"#FFCC00"},home:{school:"Coastal Carolina",abbr:"CCU",rank:null,record:"2-0",color:"#007073"},awayPoints:null,homePoints:null,period:null,clock:null,possession:null,situation:null,lastPlay:null,tv:null,startTs:"3:30 PM",lines:{spread:-9.5,spreadOpen:-8.5,total:55.5,totalOpen:56.5},edge:4.5,edgeFlag:"BIG_EDGE",consensus:false,myPick:null,crewPicks:[],cover:null,upsetAlert:false},
]};

var ord=function(p){return p===1?"1st":p===2?"2nd":p===3?"3rd":p===4?"4th":"OT"};
var sp=function(n){return (n>0?"+":"")+n.toFixed(1)};
var esc=function(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})};

function ticket(g){
  var live=g.status==="in_progress", done=g.status==="completed", pre=g.status==="scheduled";
  var half=live&&!g.clock;
  var awLost=done&&g.awayPoints<g.homePoints, hmLost=done&&g.homePoints<g.awayPoints;

  var stamp = live ? '<div class="stamp live">'+(half?"HALF":ord(g.period)+" "+g.clock)+'</div>'
            : done ? '<div class="stamp final">FINAL</div>'
                   : '<div class="stamp kick">'+esc(g.startTs)+'</div>';

  // the stub is the primary action: it either shows your pick or offers one
  var stubBody;
  if(g.myPick){
    stubBody='<div class="stublab">Your pick</div>'
      +'<div class="stubpick">'+esc(g.myPick.side)+'</div>'
      +'<div class="stubline">'+sp(g.myPick.line)+'</div>';
  }else if(pre){
    stubBody='<div class="stublab">Tap to pick</div>'
      +'<button class="pickbtn">'+esc(g.away.abbr)+'<span>'+sp(-g.lines.spread)+'</span></button>'
      +'<button class="pickbtn">'+esc(g.home.abbr)+'<span>'+sp(g.lines.spread)+'</span></button>';
  }else{
    stubBody='<div class="stublab">No pick</div><div class="stubline">—</div>';
  }

  var holes = g.crewPicks.length
    ? '<div class="holes" role="img" aria-label="'+g.crewPicks.length+' crew picks">'
      +g.crewPicks.map(function(c){
          return '<i style="background:'+(c.side==="away"?g.away.color:g.home.color)+'" title="'+esc(c.initials)+'"></i>'
        }).join("")+'</div>'
    : '<div class="holes empty">no crew</div>';

  function tmRow(t,pts,lost,hasBall){
    return '<div class="tm'+(lost?" lost":"")+'">'
      +'<i class="rail" style="background:'+t.color+'"></i>'
      +'<span class="rk">'+(t.rank?"#"+t.rank:"")+'</span>'
      +'<span class="nm">'+esc(t.school)+'</span>'
      +(hasBall?'<i class="ball" aria-label="has possession"></i>':'')
      +'<span class="rc">'+esc(t.record)+'</span>'
      +(pre?'':'<span class="sc">'+pts+'</span>')
      +'</div>';
  }

  var strip='';
  if(live) strip+='<span class="sit">'+(g.situation?esc(g.situation):(half?"Halftime":ord(g.period)))+'</span>';
  else if(done) strip+='<span class="sit">Final</span>';
  else strip+='<span class="sit">'+esc(g.home.abbr)+' '+sp(g.lines.spread)+'</span>';
  strip+='<span class="num">o'+g.lines.total.toFixed(1)+'</span>';
  if(g.edgeFlag==="BIG_EDGE") strip+='<span class="edge big">Big edge '+g.edge.toFixed(1)+'</span>';
  else if(g.edgeFlag==="EDGE") strip+='<span class="edge">Edge '+g.edge.toFixed(1)+'</span>';
  if(g.consensus) strip+='<span class="cons">Consensus</span>';

  return '<article class="ticket'+(live?" is-live":"")+'" data-id="'+g.id+'">'
    +'<div class="body">'
      +'<div class="top">'
        +(g.featured?'<span class="gotw">Game of the week</span>':'')
        +(g.upsetAlert?'<span class="upset">Upset alert</span>':'')
        +'<span class="tv">'+(g.tv?esc(g.tv):"TBD")+'</span>'
      +'</div>'
      +'<p class="sr" aria-live="polite">'+esc(g.away.abbr)+' '+(g.awayPoints===null?"":g.awayPoints)+', '+esc(g.home.abbr)+' '+(g.homePoints===null?"":g.homePoints)+'</p>'
      +tmRow(g.away,g.awayPoints,awLost,g.possession==="away")
      +tmRow(g.home,g.homePoints,hmLost,g.possession==="home")
      +'<div class="strip">'+strip+'</div>'
      +(g.lastPlay?'<p class="play">'+esc(g.lastPlay)+'</p>':'')
      +(g.cover?'<div class="cover"><b>'+esc(g.cover.word)+' '+esc(g.cover.margin)+'</b> <em>· '+esc(g.cover.pick)+', '+esc(g.cover.sub)+'</em></div>':'')
    +'</div>'
    +'<div class="stub">'
      +'<i class="notch t" aria-hidden="true"></i><i class="notch b" aria-hidden="true"></i>'
      +stamp+stubBody+holes
    +'</div>'
  +'</article>';
}

document.getElementById("list").innerHTML=window.SLATE.games.map(ticket).join("");

/* update-in-place: text nodes only, no re-render, no scroll change */
var timer=null;
document.getElementById("sim").addEventListener("click",function(){
  var on=this.getAttribute("aria-pressed")==="true";
  this.setAttribute("aria-pressed",on?"false":"true");
  if(on){clearInterval(timer);timer=null;return}
  timer=setInterval(function(){
    window.SLATE.games.forEach(function(g){
      if(g.status!=="in_progress")return;
      if(Math.random()<.45) (Math.random()<.5?g.awayPoints+=(Math.random()<.5?3:7):g.homePoints+=(Math.random()<.5?3:7));
      if(g.clock){var p=g.clock.split(":"),s=(+p[0])*60+(+p[1])-13;if(s<0)s=899;g.clock=Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
      var el=document.querySelector('.ticket[data-id="'+g.id+'"]');if(!el)return;
      var sc=el.querySelectorAll(".sc");
      if(sc[0])sc[0].textContent=g.awayPoints;
      if(sc[1])sc[1].textContent=g.homePoints;
      var st=el.querySelector(".stamp.live");
      if(st&&g.clock)st.textContent=ord(g.period)+" "+g.clock;
    });
  },2200);
});

var sheet=document.getElementById("sheet"),scrim=document.getElementById("scrim");
function close(){sheet.dataset.open="false";scrim.dataset.open="false";
  var m=document.getElementById("more");if(m)m.setAttribute("aria-expanded","false")}
document.getElementById("more").addEventListener("click",function(e){
  e.preventDefault();
  var open=sheet.dataset.open==="true";
  sheet.dataset.open=open?"false":"true";scrim.dataset.open=open?"false":"true";
  this.setAttribute("aria-expanded",open?"false":"true");
});
scrim.addEventListener("click",close);
document.addEventListener("keydown",function(e){if(e.key==="Escape")close()});
</script>
</body>
</html>
