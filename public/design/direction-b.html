<style>
/* ── Direction B · Betting Sheet ───────────────────────────────────────────
   Palette (6 named values)
   --ground   #0B0B09  ground, near-black with a warm cast
   --rule     #1E1D17  hairline rules and row separators
   --phosphor #F5C518  every number that matters — amber CRT
   --body     #C9C4B4  names and labels, warm gray
   --up       #6FCF6B  line moved toward the away side
   --down     #E5544B  line moved toward the home side
   Type: IBM Plex Mono 400/500/700 (everything) + Plex Sans Condensed (labels) */

:root{
  --ground:#0B0B09; --rule:#1E1D17; --phosphor:#F5C518; --body:#C9C4B4;
  --up:#6FCF6B; --down:#E5544B;
  --hi:#F2EFE4;
  --nav-h:60px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark}
a,button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--ground); color:var(--body);
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:13px; line-height:1.35;
  font-variant-numeric:tabular-nums lining-nums;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
  overflow-x:hidden;
}
.lab{font-family:"IBM Plex Sans Condensed",sans-serif;letter-spacing:.06em;text-transform:uppercase}

header{
  position:sticky;top:0;z-index:20;background:var(--ground);
  border-bottom:1px solid var(--rule);padding-top:env(safe-area-inset-top)
}
.hbar{display:flex;align-items:center;gap:var(--s3);height:48px;padding:0 var(--s3)}
.mark{font-weight:700;font-size:14px;color:var(--phosphor);letter-spacing:.02em}
.mark span{color:var(--body);font-weight:400}
.hspacer{flex:1}
.simbtn{min-height:44px;padding:0 10px;background:transparent;border:1px solid var(--rule);
  color:var(--body);font:600 11px "IBM Plex Sans Condensed",sans-serif;letter-spacing:.08em;
  text-transform:uppercase;cursor:pointer}
.simbtn[aria-pressed="true"]{color:var(--phosphor);border-color:rgba(245,197,24,.55)}
.wk{font-weight:700;color:var(--hi);font-size:13px}

/* column header — the board legend */
.colhead{
  position:sticky;top:calc(48px + env(safe-area-inset-top));z-index:15;
  display:grid;grid-template-columns:18px minmax(0,1fr) 40px 64px;column-gap:10px;
  padding:5px var(--s3);background:#111008;border-bottom:1px solid var(--rule);
  font-family:"IBM Plex Sans Condensed",sans-serif;font-size:10.5px;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;color:#6E6A5C
}
.colhead b:nth-child(3),.colhead b:nth-child(4){text-align:right;font-weight:600}

/* ── row ──────────────────────────────────────────────────────────────── */
.row{
  display:grid;
  grid-template-columns:18px minmax(0,1fr) 40px 64px;
  grid-template-areas:"lad away asc aln" "lad home hsc hln" "met met met met";
  column-gap:10px;
  padding:9px var(--s3);
  border-bottom:1px solid var(--rule);
  position:relative
}
/* live state is a row tint + the ladder — no badges anywhere in this design */
.row.is-live{background:rgba(245,197,24,.055)}
.row.is-live::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--phosphor)}
.row.is-done{opacity:.72}

.tm{display:flex;align-items:baseline;gap:6px;min-width:0}
.tm.away{grid-area:away} .tm.home{grid-area:home}
.rk{font-size:10.5px;color:#6E6A5C;flex:none;min-width:20px}
.nm{
  font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:600;font-size:15px;color:var(--hi);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1;letter-spacing:.005em
}
.row.is-done .nm.lost{color:#6E6A5C}
.rc{font-size:10.5px;color:#6E6A5C;flex:none}
.ball{color:var(--phosphor);flex:none;font-size:11px}

.sc{text-align:right;font-weight:700;font-size:17px;color:var(--hi)}
.sc.away{grid-area:asc} .sc.home{grid-area:hsc}
.sc.lost{color:#6E6A5C;font-weight:400}
.sc.time{font-size:12px;font-weight:500;color:var(--body);white-space:nowrap;letter-spacing:-.03em}

.ln{text-align:right;font-size:14px;white-space:nowrap}
.ln.away{grid-area:aln} .ln.home{grid-area:hln}
.ln .spread{color:var(--phosphor);font-weight:700}
.ln .total{color:var(--body);font-weight:400;font-size:12.5px}
.ln .total::before{content:"o";color:#6E6A5C;margin-right:1px}

.met{
  grid-area:met;display:flex;align-items:center;gap:var(--s2);
  margin-top:5px;font-size:11px;color:#6E6A5C;min-width:0
}
.met .sit{color:var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.met .edge{color:#E8913C;font-weight:700;flex:none}
.met .edge.big{background:#E8913C;color:#0B0B09;padding:1px 5px;flex:none}
.met .cons{color:var(--up);flex:none}
.met .mine{color:var(--phosphor);flex:none}
.met .tv{margin-left:auto;flex:none;letter-spacing:.06em}
.met .res{flex:none;font-weight:700}
.met .res.win{color:var(--up)} .met .res.loss{color:var(--down)}
.crew{display:flex;gap:2px;flex:none}
.crew i{width:15px;height:15px;font-style:normal;font-size:8px;font-weight:700;
  display:grid;place-items:center;background:#221F16;color:var(--body)}

/* SIGNATURE — the line-movement ladder. Nine rungs; the open number sits on
   the centre rung, the current number on its own. Reads at a glance as
   "this line has travelled, and which way".                               */
.lad{grid-area:lad;display:flex;flex-direction:column;justify-content:center;gap:2px;padding-top:2px}
.lad i{display:block;height:2px;background:var(--rule)}
.lad i.open{background:#4A4638}
.lad i.cur{height:3px}
.lad i.cur.up{background:var(--up)} .lad i.cur.dn{background:var(--down)}
.lad i.cur.flat{background:var(--phosphor)}

/* ── bottom bar: nav left, slip right ─────────────────────────────────── */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;align-items:stretch;
  background:#100F0B;border-top:1px solid var(--rule);
  padding-bottom:env(safe-area-inset-bottom)
}
nav a{
  flex:1;min-height:var(--nav-h);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;text-decoration:none;color:#6E6A5C;
  font-family:"IBM Plex Sans Condensed",sans-serif;font-size:10px;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase
}
nav a[aria-current="page"]{color:var(--phosphor)}
nav svg{width:19px;height:19px}
.slipbtn{
  flex:none;min-width:104px;min-height:var(--nav-h);border:0;border-left:1px solid var(--rule);
  background:var(--phosphor);color:#0B0B09;cursor:pointer;
  font-family:"IBM Plex Mono",monospace;font-weight:700;font-size:13px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px
}
.slipbtn small{font-family:"IBM Plex Sans Condensed",sans-serif;font-size:9.5px;
  letter-spacing:.12em;text-transform:uppercase;font-weight:600;opacity:.72}

.drawer{
  overscroll-behavior:contain;
  position:fixed;left:0;right:0;bottom:0;z-index:40;background:#100F0B;
  border-top:1px solid rgba(245,197,24,.4);
  padding:var(--s3) var(--s3) calc(var(--s3) + env(safe-area-inset-bottom));
  transform:translateY(101%);transition:transform .2s ease
}
.drawer[data-open="true"]{transform:translateY(0)}
.grab{width:34px;height:3px;background:var(--rule);margin:0 auto var(--s3)}
.drawer h2{font-family:"IBM Plex Sans Condensed",sans-serif;font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:#6E6A5C;margin-bottom:var(--s2)}
.slipline{display:flex;align-items:center;gap:var(--s2);padding:9px 0;border-top:1px solid var(--rule);min-height:44px}
.slipline b{color:var(--hi);font-weight:500;font-size:13px;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slipline .n{color:var(--phosphor);font-weight:700}
.slipline .rm{background:transparent;border:1px solid var(--rule);color:#6E6A5C;
  min-width:44px;min-height:44px;cursor:pointer;font-family:inherit;font-size:15px}
.place{width:100%;min-height:48px;margin-top:var(--s3);background:var(--phosphor);border:0;
  color:#0B0B09;font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:700;font-size:14px;
  letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.scrim{position:fixed;inset:0;z-index:35;background:rgba(11,11,9,.66);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim[data-open="true"]{opacity:1;pointer-events:auto}

:focus-visible{outline:2px solid var(--phosphor);outline-offset:1px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-9999px;top:0;z-index:60}
.skip:focus{left:8px;top:8px;padding:8px 12px;background:var(--phosphor);color:#0B0B09;border-radius:4px;font-weight:700;font-size:13px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<a class="skip" href="#main">Skip to scores</a>
<h1 class="sr">Direction B — Betting Sheet — live scores, week 3</h1>

<header>
  <div class="hbar">
    <div class="mark">CFB<span>/</span>SLATE</div>
    <div class="hspacer"></div>
    <button class="simbtn" id="sim" aria-pressed="false">Sim</button>
    <div class="wk">WK&nbsp;3</div>
  </div>
</header>

<div class="colhead" aria-hidden="true"><b></b><b>Matchup</b><b>Sc</b><b>Line / Tot</b></div>

<main id="main"><div id="list"></div></main>

<div class="scrim" id="scrim"></div>
<div class="drawer" id="drawer" role="dialog" aria-label="Bet slip">
  <div class="grab" aria-hidden="true"></div>
  <h2>Slip · 2 open</h2>
  <div class="slipline"><b>Ohio State <span class="n">+2.5</span></b><span class="n">1u</span><button class="rm" aria-label="Remove Ohio State +2.5">×</button></div>
  <div class="slipline"><b>Michigan <span class="n">+7.5</span></b><span class="n">1u</span><button class="rm" aria-label="Remove Michigan +7.5">×</button></div>
  <button class="place">Lock 2 picks</button>
</div>

<nav aria-label="Primary">
  <a href="#" aria-current="page"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>Slate</a>
  <a href="#"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17l5-6 4 4 8-9"/><path d="M16 6h5v5"/></svg>Edges</a>
  <a href="#"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v14H4z"/><path d="M8 9h8M8 13h5"/></svg>Ledger</a>
  <a href="#"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0112 0"/><circle cx="17" cy="9" r="2.5"/></svg>Crew</a>
  <button class="slipbtn" id="slip"><small>Slip</small>2 · 2u</button>
</nav>

<script>
/* Shared mock slate — field names mirror GameView in src/lib/slate.ts:69. */
window.SLATE={week:3,games:[
{id:401,status:"in_progress",featured:true,away:{school:"Ohio State",abbr:"OSU",rank:3,record:"2-0",color:"#BB0000"},home:{school:"Texas",abbr:"TEX",rank:7,record:"1-1",color:"#BF5700"},awayPoints:24,homePoints:21,period:4,clock:"2:47",possession:"away",situation:"3rd & 7 at TEX 34",lastPlay:"R. Henderson rush for 4 yds to the TEX 34",tv:"FOX",startTs:null,lines:{spread:-2.5,spreadOpen:-3.5,total:52.5,totalOpen:54},edge:3.1,edgeFlag:"EDGE",consensus:false,myPick:{side:"OSU",line:2.5},crewPicks:[{initials:"CV"},{initials:"DM"},{initials:"RT"},{initials:"JL"}],cover:null,upsetAlert:false},
{id:402,status:"in_progress",featured:false,away:{school:"Miami (OH)",abbr:"M-OH",rank:null,record:"0-2",color:"#C3142D"},home:{school:"Western Michigan",abbr:"WMU",rank:null,record:"1-1",color:"#6C4023"},awayPoints:10,homePoints:13,period:2,clock:"0:41",possession:"home",situation:"1st & 10 at WMU 41",lastPlay:"J. Bell pass complete to T. Owusu for 12 yds",tv:"ESPN+",startTs:null,lines:{spread:-6.5,spreadOpen:-7.5,total:48.5,totalOpen:47.5},edge:1.2,edgeFlag:null,consensus:false,myPick:null,crewPicks:[{initials:"DM"}],cover:null,upsetAlert:false},
{id:403,status:"in_progress",featured:false,away:{school:"Michigan",abbr:"MICH",rank:18,record:"1-1",color:"#00274C"},home:{school:"Oklahoma",abbr:"OU",rank:11,record:"2-0",color:"#841617"},awayPoints:17,homePoints:14,period:2,clock:null,possession:null,situation:null,lastPlay:null,tv:"NBC",startTs:null,lines:{spread:-7.5,spreadOpen:-6.5,total:45.5,totalOpen:46.5},edge:2.4,edgeFlag:null,consensus:false,myPick:{side:"MICH",line:7.5},crewPicks:[{initials:"CV"},{initials:"RT"}],cover:null,upsetAlert:true},
{id:404,status:"completed",featured:false,away:{school:"Alabama",abbr:"ALA",rank:5,record:"2-0",color:"#9E1B32"},home:{school:"Florida State",abbr:"FSU",rank:12,record:"2-0",color:"#782F40"},awayPoints:31,homePoints:27,period:4,clock:null,possession:null,situation:null,lastPlay:null,tv:"ABC",startTs:null,lines:{spread:3.5,spreadOpen:2.5,total:55.5,totalOpen:54.5},edge:1.8,edgeFlag:null,consensus:false,myPick:{side:"ALA",line:-3.5},crewPicks:[{initials:"CV"},{initials:"DM"},{initials:"JL"}],cover:{word:"Covered",margin:"+0.5",sub:"won by 4, laid 3.5",pick:"ALA -3.5"},upsetAlert:false},
{id:405,status:"scheduled",featured:false,away:{school:"LSU",abbr:"LSU",rank:9,record:"2-0",color:"#461D7C"},home:{school:"Clemson",abbr:"CLEM",rank:14,record:"1-1",color:"#F66733"},awayPoints:null,homePoints:null,period:null,clock:null,possession:null,situation:null,lastPlay:null,tv:"ABC",startTs:"7:00 PM",lines:{spread:-1.5,spreadOpen:-3.0,total:51.5,totalOpen:50.5},edge:2.9,edgeFlag:"EDGE",consensus:true,myPick:null,crewPicks:[{initials:"CV"},{initials:"DM"},{initials:"RT"},{initials:"JL"}],cover:null,upsetAlert:false},
{id:406,status:"scheduled",featured:false,away:{school:"App State",abbr:"APP",rank:null,record:"1-1",color:"#FFCC00"},home:{school:"Coastal Carolina",abbr:"CCU",rank:null,record:"2-0",color:"#007073"},awayPoints:null,homePoints:null,period:null,clock:null,possession:null,situation:null,lastPlay:null,tv:null,startTs:"3:30 PM",lines:{spread:-9.5,spreadOpen:-8.5,total:55.5,totalOpen:56.5},edge:4.5,edgeFlag:"BIG_EDGE",consensus:false,myPick:null,crewPicks:[],cover:null,upsetAlert:false},
]};

var ord=function(p){return p===1?"1st":p===2?"2nd":p===3?"3rd":p===4?"4th":"OT"};
var sp=function(n){return (n>0?"+":n<0?"":"")+n.toFixed(1)};
var esc=function(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})};

/* nine rungs; centre is the opening number, the lit rung is where it sits now */
function ladder(move){
  var steps=Math.max(-4,Math.min(4,Math.round(move*2)));
  var cur=4-steps, dir=move>0?"up":move<0?"dn":"flat", out="";
  for(var i=0;i<9;i++){
    var cls=i===4?"open":"";
    if(i===cur)cls="cur "+dir;
    out+='<i class="'+cls+'"></i>';
  }
  return '<div class="lad" role="img" aria-label="Line moved '+(move===0?"not at all":sp(move))+' from open">'+out+'</div>';
}

function row(g){
  var live=g.status==="in_progress", done=g.status==="completed", pre=g.status==="scheduled";
  var half=live&&!g.clock;
  var homeFav=g.lines.spread<0;
  var move=g.lines.spread-g.lines.spreadOpen;
  var awLost=done&&g.awayPoints<g.homePoints, hmLost=done&&g.homePoints<g.awayPoints;

  // authentic sheet layout: the number sits on the favourite's line, total below
  var awLn = homeFav ? '<span class="total">'+g.lines.total.toFixed(1)+'</span>' : '<span class="spread">'+sp(-g.lines.spread)+'</span>';
  var hmLn = homeFav ? '<span class="spread">'+sp(g.lines.spread)+'</span>' : '<span class="total">'+g.lines.total.toFixed(1)+'</span>';

  var kick = esc(g.startTs).replace(" PM","p").replace(" AM","a");
  var scA = pre ? '<div class="sc away time">'+kick+'</div>'
                : '<div class="sc away'+(awLost?" lost":"")+'">'+g.awayPoints+'</div>';
  var scB = pre ? '<div class="sc home time">ET</div>'
                : '<div class="sc home'+(hmLost?" lost":"")+'">'+g.homePoints+'</div>';

  var met='';
  if(live) met+='<span class="sit">'+(half?"Half":ord(g.period)+" "+g.clock)+(g.situation?" · "+esc(g.situation):"")+'</span>';
  else if(done) met+='<span class="sit">Final</span>';
  else met+='<span class="sit">'+(g.featured?"Game of the week":"&nbsp;")+'</span>';
  if(g.upsetAlert) met+='<span class="res loss">Upset</span>';
  if(g.cover) met+='<span class="res win">'+esc(g.cover.word)+' '+esc(g.cover.margin)+'</span>';
  if(g.edgeFlag==="BIG_EDGE") met+='<span class="edge big">'+g.edge.toFixed(1)+'</span>';
  else if(g.edgeFlag==="EDGE") met+='<span class="edge">'+g.edge.toFixed(1)+'</span>';
  if(g.consensus) met+='<span class="cons">Consensus</span>';
  if(g.myPick) met+='<span class="mine">You '+esc(g.myPick.side)+'</span>';
  if(g.crewPicks.length) met+='<span class="crew">'+g.crewPicks.map(function(c){return '<i>'+esc(c.initials)+'</i>'}).join("")+'</span>';
  met+='<span class="tv">'+(g.tv?esc(g.tv):"—")+'</span>';

  return '<article class="row'+(live?" is-live":"")+(done?" is-done":"")+'" data-id="'+g.id+'">'
    +ladder(move)
    +'<div class="tm away"><span class="rk">'+(g.away.rank?"#"+g.away.rank:"")+'</span>'
      +'<span class="nm'+(awLost?" lost":"")+'">'+esc(g.away.school)+'</span>'
      +(g.possession==="away"?'<span class="ball" aria-label="has possession">●</span>':'')
      +'<span class="rc">'+esc(g.away.record)+'</span></div>'
    +scA+'<div class="ln away">'+awLn+'</div>'
    +'<div class="tm home"><span class="rk">'+(g.home.rank?"#"+g.home.rank:"")+'</span>'
      +'<span class="nm'+(hmLost?" lost":"")+'">'+esc(g.home.school)+'</span>'
      +(g.possession==="home"?'<span class="ball" aria-label="has possession">●</span>':'')
      +'<span class="rc">'+esc(g.home.record)+'</span></div>'
    +scB+'<div class="ln home">'+hmLn+'</div>'
    +'<div class="met">'+met+'</div>'
    +'<p class="sr" aria-live="polite">'+esc(g.away.abbr)+' '+(g.awayPoints===null?"":g.awayPoints)+', '+esc(g.home.abbr)+' '+(g.homePoints===null?"":g.homePoints)+'</p>'
  +'</article>';
}

document.getElementById("list").innerHTML=window.SLATE.games.map(row).join("");

/* update-in-place: text nodes only, no re-render, no scroll change */
var timer=null;
document.getElementById("sim").addEventListener("click",function(){
  var on=this.getAttribute("aria-pressed")==="true";
  this.setAttribute("aria-pressed",on?"false":"true");
  if(on){clearInterval(timer);timer=null;return}
  timer=setInterval(function(){
    window.SLATE.games.forEach(function(g){
      if(g.status!=="in_progress")return;
      if(Math.random()<.45) (Math.random()<.5?g.awayPoints+=(Math.random()<.5?3:7):g.homePoints+=(Math.random()<.5?3:7));
      if(g.clock){var p=g.clock.split(":"),s=(+p[0])*60+(+p[1])-13;if(s<0)s=899;g.clock=Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
      var el=document.querySelector('.row[data-id="'+g.id+'"]');if(!el)return;
      el.querySelector(".sc.away").textContent=g.awayPoints;
      el.querySelector(".sc.home").textContent=g.homePoints;
      var sit=el.querySelector(".met .sit");
      if(sit&&g.clock)sit.textContent=ord(g.period)+" "+g.clock+(g.situation?" · "+g.situation:"");
    });
  },2200);
});

var drawer=document.getElementById("drawer"),scrim=document.getElementById("scrim");
function close(){drawer.dataset.open="false";scrim.dataset.open="false"}
document.getElementById("slip").addEventListener("click",function(){
  var open=drawer.dataset.open==="true";
  drawer.dataset.open=open?"false":"true";scrim.dataset.open=open?"false":"true";
});
scrim.addEventListener("click",close);
document.addEventListener("keydown",function(e){if(e.key==="Escape")close()});
</script>
</body>
</html>
