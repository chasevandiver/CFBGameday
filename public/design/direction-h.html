<style>
/* ── Direction H · Adaptive Tiles ──────────────────────────────
   --coal   #14120F  ground     --chalk  #F6F1E7  primary text
   --tile   #201C16  tiles      --dim    #948B79  metadata
   --accent #FF4F8B  interactive + the watchability meter
   --cool   #5AD2C4  covers and "moving your way"
   Type: Saira Condensed 600,700 (display) / Saira 400,600 (body) — one superfamily.
*/

*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark;-webkit-text-size-adjust:100%;overflow-x:clip}
a,button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body{overflow-x:hidden;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-9999px;top:0;z-index:60}
.skip:focus{left:8px;top:8px;padding:10px 14px;background:var(--nav-accent);color:#0a0a0a;
  border-radius:4px;font-weight:700;font-size:13px}
:focus-visible{outline:2px solid var(--nav-accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}


nav[data-bottom-nav]{
  position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;
  background:var(--nav-bg);border-top:1px solid var(--nav-line);
  backdrop-filter:blur(14px);padding-bottom:env(safe-area-inset-bottom)
}
nav[data-bottom-nav] a,nav[data-bottom-nav] button{
  flex:1;min-height:var(--nav-h);border:0;background:transparent;cursor:pointer;
  font-family:inherit;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;text-decoration:none;color:var(--nav-dim);
  font-size:11px;font-weight:600;letter-spacing:.02em
}
nav[data-bottom-nav] [aria-current="page"]{color:var(--nav-on);box-shadow:inset 0 2px 0 var(--nav-accent)}
nav[data-bottom-nav] [aria-current="page"] svg{color:var(--nav-accent)}
nav[data-bottom-nav] svg{width:21px;height:21px}


:root{
  --coal:#14120F; --tile:#201C16; --chalk:#F6F1E7; --dim:#948B79;
  --accent:#FF4F8B; --cool:#5AD2C4;
  --line:rgba(246,241,231,.11);
  --nav-h:64px; --nav-bg:rgba(20,18,15,.95); --nav-line:var(--line);
  --nav-dim:var(--dim); --nav-on:var(--chalk); --nav-accent:var(--accent);
}
body{background:var(--coal);color:var(--chalk);font-family:Saira,system-ui,sans-serif;
  font-size:14px;line-height:1.35}
.cond{font-family:"Saira Condensed",sans-serif;font-weight:700}
.m{font-variant-numeric:tabular-nums lining-nums}

header{position:sticky;top:0;z-index:20;background:rgba(20,18,15,.92);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.hbar{display:flex;align-items:center;gap:12px;height:52px;padding:0 14px}
.mark{font-family:"Saira Condensed",sans-serif;font-weight:700;font-size:20px;text-transform:uppercase;
  letter-spacing:.01em}
.mark i{font-style:normal;color:var(--accent)}
.sp{flex:1}
.sim{min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:7px;background:transparent;
  color:var(--dim);font:600 12px Saira,sans-serif;cursor:pointer}
.sim[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}
.wk{font-weight:600;font-size:13px}
.sub{padding:10px 14px 0;font-size:11.5px;color:var(--dim)}

main{padding:8px 10px 20px}
.mos{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* SIGNATURE — size is the watchability score (spec §7). A 94 takes the full
   width and shows everything; a 31 is a quarter of that. The slate reshapes
   itself around what is worth watching, instead of treating every game the
   same. Small tiles expand in place, so nothing is actually lost. */
.tile{grid-column:span 1;border:1px solid var(--line);border-radius:12px;background:var(--tile);
  overflow:hidden;position:relative}
.tile[data-size="hero"],.tile[data-size="mid"],.tile.open{grid-column:span 2}
.tile.is-live{border-color:rgba(255,79,139,.4)}
.expand{display:block;width:100%;min-height:44px;margin-top:6px;border:0;border-top:1px solid var(--line);
  background:transparent;color:var(--dim);font-family:Saira,sans-serif;font-size:11px;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.tile.open .expand{color:var(--accent)}

.wm{position:absolute;left:0;top:0;height:3px;background:var(--accent);opacity:.85}
.thead{display:flex;align-items:center;gap:7px;padding:11px 12px 0;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:5px;
  font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;
  background:rgba(246,241,231,.1)}
.chip.live{background:rgba(255,79,139,.2);color:#FF9CC0}
.chip.big{background:var(--accent);color:#20101a}
.chip.cons{background:rgba(90,210,196,.16);color:var(--cool)}
.chip.upset{background:rgba(255,79,139,.2);color:#FF9CC0}
.dot{width:5px;height:5px;border-radius:50%;background:currentColor}
.is-live .dot{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.wsc{margin-left:auto;font-family:"Saira Condensed",sans-serif;font-weight:700;font-size:15px;color:var(--accent)}
.wsc b{font-family:Saira,sans-serif;font-size:8.5px;font-weight:600;letter-spacing:.1em;color:var(--dim);
  text-transform:uppercase;margin-right:3px}

.tm{display:flex;align-items:center;gap:8px;padding:0 12px;min-height:40px}
.mk{width:3px;height:22px;border-radius:2px;flex:none}
.rk{font-size:10.5px;color:var(--dim);flex:none;min-width:18px}
.rk:empty{display:none}
.nm{font-family:"Saira Condensed",sans-serif;font-weight:600;font-size:18px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.tm.lost .nm,.tm.lost .sc{color:var(--dim)}
.rc{font-size:10.5px;color:var(--dim);flex:none}
.ball{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}
.sc{font-family:"Saira Condensed",sans-serif;font-weight:700;font-size:26px;line-height:1;width:44px;
  text-align:right;flex:none;font-variant-numeric:tabular-nums}
.tile[data-size="sm"] .nm{font-size:15px}
.tile[data-size="sm"] .sc{font-size:20px;width:32px}
.tile[data-size="sm"] .tm{min-height:34px;gap:6px}
.tile[data-size="sm"] .rc{display:none}

.line{display:flex;gap:10px;padding:7px 12px 0;font-size:11.5px;color:var(--dim)}
.line b{color:var(--chalk);font-weight:600}
.st{font-weight:600}
.st.live{color:var(--accent)}

/* everything below is hidden on small tiles until they are opened */
.more{display:none}
.tile[data-size="hero"] .more,.tile[data-size="mid"] .more,.tile.open .more{display:block}
.tile[data-size="mid"] .heroonly{display:none}
.tile.open .heroonly{display:block}

.field{position:relative;height:9px;margin:9px 12px 0;border-radius:5px;overflow:hidden;background:#2B261E}
.field i{position:absolute;top:0;bottom:0}
.ez{width:7%;opacity:.7} .ez.l{left:0} .ez.r{right:0}
.rz{width:16%;right:7%;background:rgba(255,79,139,.45)}
.bal{width:3px;background:var(--chalk);border-radius:2px}
.sit{padding:7px 12px 0;font-size:12px;color:var(--chalk)}
.play{padding:4px 12px 0;font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wp{padding:9px 12px 0}
.wplab{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim);margin-bottom:4px}
.wplab b{color:var(--chalk);font-weight:600}
.wpbar{display:flex;height:6px;border-radius:999px;overflow:hidden;background:rgba(246,241,231,.1)}
.odds{display:grid;grid-template-columns:24px repeat(3,1fr);gap:5px;padding:9px 12px 0;align-items:center}
.who{font-size:10px;color:var(--dim)}
.cell{min-height:44px;border:1px solid var(--line);border-radius:7px;background:transparent;color:var(--chalk);
  font-size:12.5px;font-weight:600;cursor:pointer;font-family:Saira,sans-serif;font-variant-numeric:tabular-nums}
.cell[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#20101a}
.foot{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px;padding:8px 12px 11px;
  border-top:1px solid var(--line);font-size:10.5px;color:var(--dim)}
.sys{display:flex;gap:4px}
.sys span{padding:2px 5px;border-radius:4px;background:rgba(246,241,231,.07)}
.sys span.dis{color:var(--accent);background:rgba(255,79,139,.13)}
.mv.good{color:var(--cool)} .mv.bad{color:var(--accent)}
.crew{display:flex;gap:3px;margin-left:auto}
.av{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:9px;font-weight:600;
  background:rgba(246,241,231,.12);color:var(--chalk)}
.cover{padding:8px 12px;background:rgba(90,210,196,.12);font-family:"Saira Condensed",sans-serif;
  font-weight:700;font-size:14px;color:var(--cool);text-transform:uppercase}
.cover em{font-family:Saira,sans-serif;font-style:normal;font-size:10.5px;font-weight:400;color:var(--dim);
  text-transform:none;margin-left:8px}


</style>
</head>

<script>
var SLATE={"week":3,"games":[{"id":401,"status":"in_progress","featured":true,"pinned":true,"away":{"school":"Ohio State","abbr":"OSU","rank":3,"record":"2-0","color":"#BB0000"},"home":{"school":"Texas","abbr":"TEX","rank":7,"record":"1-1","color":"#BF5700"},"awayPoints":24,"homePoints":21,"period":4,"clock":"2:47","possession":"away","situation":"3rd & 7 at TEX 34","down":3,"distance":7,"yardLine":34,"sideToken":"TEX","redZone":false,"lastPlay":"R. Henderson rush for 4 yds to the TEX 34","tv":"FOX","startTs":"3:30 PM","slot":"Afternoon","lines":{"spread":-2.5,"spreadOpen":-3.5,"total":52.5,"totalOpen":54,"mlHome":-135,"mlAway":115},"ratings":{"model":0.6,"sp":-3,"fpi":0.3,"elo":1.1},"watchability":94,"watchCount":84,"weather":{"tempF":78,"windMph":9},"homeWp":0.34,"wpHistory":[0.58,0.61,0.55,0.49,0.52,0.44,0.4,0.47,0.51,0.43,0.38,0.41,0.35,0.3,0.36,0.34],"lineHistory":[{"t":"Mon","v":-3.5},{"t":"Tue","v":-3.5},{"t":"Wed","v":-3},{"t":"Thu","v":-3},{"t":"Fri","v":-2.5},{"t":"Sat","v":-2.5}],"myPick":{"side":"away","label":"OSU","line":2.5},"crewPicks":[{"i":"CV","side":"away"},{"i":"DM","side":"away"},{"i":"RT","side":"home"},{"i":"JL","side":"away"}],"cover":null,"upsetAlert":false},{"id":402,"status":"in_progress","featured":false,"pinned":false,"away":{"school":"Miami (OH)","abbr":"M-OH","rank":null,"record":"0-2","color":"#C3142D"},"home":{"school":"Western Michigan","abbr":"WMU","rank":null,"record":"1-1","color":"#6C4023"},"awayPoints":10,"homePoints":13,"period":2,"clock":"0:41","possession":"home","situation":"1st & 10 at WMU 41","down":1,"distance":10,"yardLine":41,"sideToken":"WMU","redZone":false,"lastPlay":"J. Bell pass complete to T. Owusu for 12 yds","tv":"ESPN+","startTs":"12:00 PM","slot":"Noon","lines":{"spread":-6.5,"spreadOpen":-7.5,"total":48.5,"totalOpen":47.5,"mlHome":-260,"mlAway":210},"ratings":{"model":-5.3,"sp":-7.1,"fpi":-6,"elo":-5.9},"watchability":31,"watchCount":6,"weather":{"tempF":71,"windMph":14},"homeWp":0.62,"wpHistory":[0.71,0.68,0.66,0.7,0.63,0.59,0.64,0.61,0.58,0.62],"lineHistory":[{"t":"Mon","v":-7.5},{"t":"Wed","v":-7},{"t":"Thu","v":-7},{"t":"Fri","v":-6.5},{"t":"Sat","v":-6.5}],"myPick":null,"crewPicks":[{"i":"DM","side":"away"}],"cover":null,"upsetAlert":false},{"id":403,"status":"in_progress","featured":false,"pinned":false,"away":{"school":"Michigan","abbr":"MICH","rank":18,"record":"1-1","color":"#00274C"},"home":{"school":"Oklahoma","abbr":"OU","rank":11,"record":"2-0","color":"#841617"},"awayPoints":17,"homePoints":14,"period":2,"clock":null,"possession":null,"situation":null,"down":null,"distance":null,"yardLine":null,"sideToken":null,"redZone":false,"lastPlay":null,"tv":"NBC","startTs":"7:00 PM","slot":"Primetime","lines":{"spread":-7.5,"spreadOpen":-6.5,"total":45.5,"totalOpen":46.5,"mlHome":-290,"mlAway":235},"ratings":{"model":-5.1,"sp":-6.2,"fpi":-4.9,"elo":-6.8},"watchability":78,"watchCount":41,"weather":{"tempF":84,"windMph":6},"homeWp":0.44,"wpHistory":[0.74,0.7,0.66,0.61,0.58,0.63,0.55,0.49,0.46,0.44],"lineHistory":[{"t":"Mon","v":-6.5},{"t":"Wed","v":-7},{"t":"Thu","v":-7},{"t":"Fri","v":-7.5},{"t":"Sat","v":-7.5}],"myPick":{"side":"away","label":"MICH","line":7.5},"crewPicks":[{"i":"CV","side":"away"},{"i":"RT","side":"away"}],"cover":null,"upsetAlert":true},{"id":404,"status":"completed","featured":false,"pinned":false,"away":{"school":"Alabama","abbr":"ALA","rank":5,"record":"2-0","color":"#9E1B32"},"home":{"school":"Florida State","abbr":"FSU","rank":12,"record":"2-0","color":"#782F40"},"awayPoints":31,"homePoints":27,"period":4,"clock":null,"possession":null,"situation":null,"down":null,"distance":null,"yardLine":null,"sideToken":null,"redZone":false,"lastPlay":null,"tv":"ABC","startTs":"12:00 PM","slot":"Noon","lines":{"spread":3.5,"spreadOpen":2.5,"total":55.5,"totalOpen":54.5,"mlHome":145,"mlAway":-170},"ratings":{"model":1.7,"sp":4.2,"fpi":2.9,"elo":3.1},"watchability":71,"watchCount":52,"weather":{"tempF":88,"windMph":4},"homeWp":0,"wpHistory":[0.42,0.47,0.39,0.44,0.36,0.3,0.35,0.22,0.28,0.14,0.06,0],"lineHistory":[{"t":"Mon","v":2.5},{"t":"Wed","v":3},{"t":"Thu","v":3},{"t":"Fri","v":3.5},{"t":"Sat","v":3.5}],"myPick":{"side":"away","label":"ALA","line":-3.5},"crewPicks":[{"i":"CV","side":"away"},{"i":"DM","side":"home"},{"i":"JL","side":"away"}],"cover":{"word":"Covered","margin":"+0.5","sub":"won by 4, laid 3.5","pick":"ALA -3.5","result":"win"},"upsetAlert":false},{"id":405,"status":"scheduled","featured":false,"pinned":false,"away":{"school":"LSU","abbr":"LSU","rank":9,"record":"2-0","color":"#461D7C"},"home":{"school":"Clemson","abbr":"CLEM","rank":14,"record":"1-1","color":"#F66733"},"awayPoints":null,"homePoints":null,"period":null,"clock":null,"possession":null,"situation":null,"down":null,"distance":null,"yardLine":null,"sideToken":null,"redZone":false,"lastPlay":null,"tv":"ABC","startTs":"7:00 PM","slot":"Primetime","lines":{"spread":-1.5,"spreadOpen":-3,"total":51.5,"totalOpen":50.5,"mlHome":-125,"mlAway":105},"ratings":{"model":-4.4,"sp":-3.8,"fpi":-5.1,"elo":-4},"watchability":88,"watchCount":63,"weather":{"tempF":74,"windMph":3},"homeWp":null,"wpHistory":null,"lineHistory":[{"t":"Mon","v":-3},{"t":"Tue","v":-2.5},{"t":"Wed","v":-2.5},{"t":"Thu","v":-2},{"t":"Fri","v":-1.5},{"t":"Sat","v":-1.5}],"myPick":null,"crewPicks":[{"i":"CV","side":"away"},{"i":"DM","side":"away"},{"i":"RT","side":"away"},{"i":"JL","side":"away"}],"cover":null,"upsetAlert":false},{"id":406,"status":"scheduled","featured":false,"pinned":false,"away":{"school":"App State","abbr":"APP","rank":null,"record":"1-1","color":"#FFCC00"},"home":{"school":"Coastal Carolina","abbr":"CCU","rank":null,"record":"2-0","color":"#007073"},"awayPoints":null,"homePoints":null,"period":null,"clock":null,"possession":null,"situation":null,"down":null,"distance":null,"yardLine":null,"sideToken":null,"redZone":false,"lastPlay":null,"tv":null,"startTs":"10:30 PM","slot":"Late","lines":{"spread":-9.5,"spreadOpen":-8.5,"total":55.5,"totalOpen":56.5,"mlHome":-380,"mlAway":300},"ratings":{"model":-14,"sp":-13.1,"fpi":-8.9,"elo":-13.6},"watchability":42,"watchCount":3,"weather":{"tempF":79,"windMph":11},"homeWp":null,"wpHistory":null,"lineHistory":[{"t":"Mon","v":-8.5},{"t":"Wed","v":-9},{"t":"Thu","v":-9},{"t":"Fri","v":-9.5},{"t":"Sat","v":-9.5}],"myPick":null,"crewPicks":[],"cover":null,"upsetAlert":false}]};

var ord=function(p){return p===1?"1st":p===2?"2nd":p===3?"3rd":p===4?"4th":"OT"};
var sp=function(n){return n===null?"–":(n>0?"+":"")+n.toFixed(1)};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
var isLive=function(g){return g.status==="in_progress"};
var isDone=function(g){return g.status==="completed"};
var isPre=function(g){return g.status==="scheduled"};
var teamSpread=function(g,side){return side==="home"?g.lines.spread:-g.lines.spread};
var ml=function(g,side){var v=side==="home"?g.lines.mlHome:g.lines.mlAway;return v===null?"–":(v>0?"+":"")+v};

/* The model's edge, in points, and which side it lands on. */
var edgeOf=function(g){
  var d=g.ratings.model-g.lines.spread;
  return { pts:Math.abs(d), side: d>0?"away":"home" };
};
var edgeFlag=function(g){var e=edgeOf(g).pts;return e>=4?"BIG":e>=2.5?"EDGE":null};

/* spec §4 consensus: model AND SP+ AND FPI AND Elo all disagree with the
   line in the same direction. Computed, not hardcoded. */
var consensusOf=function(g){
  var m=g.lines.spread, r=g.ratings;
  var v=[r.model,r.sp,r.fpi,r.elo];
  if(v.every(function(x){return x>m})) return "away";
  if(v.every(function(x){return x<m})) return "home";
  return null;
};

/* Movement coloured against the model's side, not by direction. Fixes the
   meaningless green/red in chips.tsx:105-119 — green means "moving your way". */
var moveOf=function(g){
  var d=g.lines.spread-g.lines.spreadOpen;
  if(d===0) return { pts:0, label:"—", tone:"flat" };
  var towards = d>0 ? "away" : "home";
  var side = g.myPick ? g.myPick.side : edgeOf(g).side;
  return { pts:Math.abs(d), label:(d>0?"+":"")+d.toFixed(1), tone: towards===side?"good":"bad", towards:towards };
};

var sideLabel=function(g,s){return s==="home"?g.home.abbr:s==="away"?g.away.abbr:s};
/* True when this rating leans the same way the model does, by a real margin. */
var leansWith=function(g,v){
  var m=g.lines.spread;
  return Math.abs(v-m)>=0.5 && (v>m)===(g.ratings.model>m);
};
var crewSplit=function(g){
  var a=g.crewPicks.filter(function(c){return c.side==="away"}).length;
  return { away:a, home:g.crewPicks.length-a };
};

/* Points → an SVG polyline inside a w×h box. */
var poly=function(vals,w,h,pad){
  pad=pad||0;
  if(!vals||vals.length<2) return "";
  var lo=Math.min.apply(null,vals), hi=Math.max.apply(null,vals), r=(hi-lo)||1;
  return vals.map(function(v,i){
    var x=(i/(vals.length-1))*w;
    var y=pad+(1-(v-lo)/r)*(h-pad*2);
    return x.toFixed(1)+","+y.toFixed(1);
  }).join(" ");
};


function sizeOf(g){ return g.watchability>=85 ? "hero" : g.watchability>=60 ? "mid" : "sm"; }

function tile(g){
  var live=isLive(g), done=isDone(g), pre=isPre(g), half=live&&!g.clock;
  var awLost=done&&g.awayPoints<g.homePoints, hmLost=done&&g.homePoints<g.awayPoints;
  var e=edgeOf(g), fl=edgeFlag(g), con=consensusOf(g), mv=moveOf(g), cs=crewSplit(g);
  var m=g.lines.spread, r=g.ratings, size=sizeOf(g);
  var st = live ? (half?"Half":ord(g.period)+" "+g.clock) : done ? "Final" : g.startTs;
  var wpHome = g.homeWp===null?null:Math.round(g.homeWp*100);

  function tm(t,pts,lost,ball){
    return '<div class="tm'+(lost?" lost":"")+'">'
      +'<i class="mk" style="background:'+t.color+'"></i>'
      +'<span class="rk">'+(t.rank?"#"+t.rank:"")+'</span>'
      +'<span class="nm">'+esc(size==="sm"?t.abbr:t.school)+'</span>'
      +(ball?'<i class="ball" aria-label="has possession"></i>':'')
      +'<span class="rc">'+esc(t.record)+'</span>'
      +(pre?'':'<span class="sc">'+pts+'</span>')
    +'</div>';
  }
  function oddsRow(side,t){
    var tot=(side==="home"?"U ":"O ")+g.lines.total.toFixed(1);
    return '<div class="odds"><span class="who">'+esc(t.abbr)+'</span>'
      +'<button class="cell" aria-pressed="false" aria-label="'+esc(t.abbr)+' '+sp(teamSpread(g,side))+' spread, add to bet slip">'+sp(teamSpread(g,side))+'</button>'
      +'<button class="cell" aria-pressed="false" aria-label="'+(side==="home"?"Under":"Over")+' '+g.lines.total.toFixed(1)+', add to bet slip">'+tot+'</button>'
      +'<button class="cell" aria-pressed="false" aria-label="'+esc(t.abbr)+' moneyline '+ml(g,side)+', add to bet slip">'+ml(g,side)+'</button>'
    +'</div>';
  }

  return '<article class="tile'+(live?" is-live":"")+'" data-size="'+size+'" data-id="'+g.id+'">'
    +'<i class="wm" style="width:'+g.watchability+'%" aria-hidden="true"></i>'
    +'<p class="sr" aria-live="polite">'+esc(g.away.abbr)+' '+(g.awayPoints===null?"":g.awayPoints)+', '+esc(g.home.abbr)+' '+(g.homePoints===null?"":g.homePoints)+'</p>'
    +'<div class="thead">'
      +(live?'<span class="chip live"><i class="dot"></i>'+esc(st)+'</span>':'<span class="chip">'+esc(st)+'</span>')
      +(g.upsetAlert?'<span class="chip upset">Upset</span>':'')
      +(size!=="sm"&&fl==="BIG"?'<span class="chip big">Big edge '+e.pts.toFixed(1)+'</span>':'')
      +(size!=="sm"&&fl==="EDGE"?'<span class="chip">Edge '+e.pts.toFixed(1)+'</span>':'')
      +(size!=="sm"&&con?'<span class="chip cons">Consensus</span>':'')
      +(g.pinned?'<span class="chip">Pinned</span>':'')
      +'<span class="wsc"><b>Watch</b>'+g.watchability+'</span>'
    +'</div>'
    +tm(g.away,g.awayPoints,awLost,g.possession==="away")
    +tm(g.home,g.homePoints,hmLost,g.possession==="home")
    +'<div class="line"><span><b>'+esc(g.home.abbr)+' '+sp(m)+'</b></span><span>O '+g.lines.total.toFixed(1)+'</span>'
      +(g.tv?'<span style="margin-left:auto">'+esc(g.tv)+'</span>':'<span style="margin-left:auto">TBD</span>')+'</div>'
    +(size==="sm"?'<button type="button" class="expand" aria-expanded="false">Full card</button>':'')
    +'<div class="more">'
      +(g.yardLine!==null?'<div class="field" role="img" aria-label="Ball at the '+esc(g.sideToken)+' '+g.yardLine+'"><i class="ez l" style="background:'+g.away.color+'"></i><i class="ez r" style="background:'+g.home.color+'"></i>'+(g.redZone?'<i class="rz"></i>':'')+'<i class="bal" style="left:'+(g.sideToken===g.home.abbr?100-g.yardLine:g.yardLine)+'%"></i></div>':'')
      +(g.situation?'<div class="sit">'+esc(g.situation)+'</div>':'')
      +(g.lastPlay?'<p class="play">'+esc(g.lastPlay)+'</p>':'')
      +(wpHome!==null?'<div class="wp"><div class="wplab"><span>'+esc(g.away.abbr)+' <b>'+(100-wpHome)+'%</b></span><span><b>'+wpHome+'%</b> '+esc(g.home.abbr)+'</span></div>'
        +'<div class="wpbar" role="img" aria-label="Win probability '+esc(g.away.abbr)+' '+(100-wpHome)+' percent"><i style="width:'+(100-wpHome)+'%;background:'+g.away.color+'"></i><i style="flex:1;background:'+g.home.color+'"></i></div></div>':'')
      +'<div class="heroonly">'+oddsRow("away",g.away)+oddsRow("home",g.home)+'</div>'
      +'<div class="foot">'
        +'<span class="sys">'+[["MOD",r.model],["SP+",r.sp],["FPI",r.fpi],["ELO",r.elo]].map(function(k){
            return '<span class="'+(leansWith(g,k[1])?"dis":"")+'">'+k[0]+' '+sp(k[1])+'</span>'}).join("")+'</span>'
        +'<span class="mv '+mv.tone+'">'+mv.label+'</span>'
        +'<span>'+g.watchCount+' watching</span>'
        +(g.myPick?'<span>You '+esc(g.myPick.label)+' '+sp(g.myPick.line)+'</span>':'')
        +(g.crewPicks.length?'<span class="crew">'+g.crewPicks.map(function(c){return '<span class="av" title="'+esc(c.i)+' on '+esc(sideLabel(g,c.side))+'">'+esc(c.i)+'</span>'}).join("")+'</span>':'')
      +'</div>'
      +(g.crewPicks.length?'<div class="foot" style="border-top:0;margin-top:0;padding-top:0">Crew '+cs.away+' '+esc(g.away.abbr)+' · '+cs.home+' '+esc(g.home.abbr)+'</div>':'')
      +(g.cover?'<div class="cover">'+esc(g.cover.word)+' '+esc(g.cover.margin)+'<em>'+esc(g.cover.pick)+' · '+esc(g.cover.sub)+'</em></div>':'')
    +'</div>'
  +'</article>';
}

var ordered = SLATE.games.slice().sort(function(a,b){return b.watchability-a.watchability});
document.getElementById("list").innerHTML=ordered.map(tile).join("");

document.querySelectorAll(".expand").forEach(function(b){
  b.addEventListener("click",function(){
    var tile=this.closest(".tile");
    var open=tile.classList.toggle("open");
    this.setAttribute("aria-expanded",open?"true":"false");
    this.textContent=open?"Less":"Full card";
  });
});
document.querySelectorAll(".cell").forEach(function(c){
  c.addEventListener("click",function(){
    this.setAttribute("aria-pressed",this.getAttribute("aria-pressed")==="true"?"false":"true")});
});

var timer=null;
document.getElementById("sim").addEventListener("click",function(){
  var on=this.getAttribute("aria-pressed")==="true";
  this.setAttribute("aria-pressed",on?"false":"true");
  if(on){clearInterval(timer);timer=null;return}
  timer=setInterval(function(){
    SLATE.games.forEach(function(g){
      if(!isLive(g))return;
      if(Math.random()<.45){if(Math.random()<.5)g.awayPoints+=(Math.random()<.5?3:7);else g.homePoints+=(Math.random()<.5?3:7);}
      if(g.clock){var p=g.clock.split(":"),s=(+p[0])*60+(+p[1])-13;if(s<0)s=899;g.clock=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}
      var el=document.querySelector('.tile[data-id="'+g.id+'"]');if(!el)return;
      var sc=el.querySelectorAll(".sc");
      if(sc[0])sc[0].textContent=g.awayPoints;
      if(sc[1])sc[1].textContent=g.homePoints;
      var lc=el.querySelector(".chip.live");
      if(lc&&g.clock)lc.innerHTML='<i class="dot"></i>'+ord(g.period)+" "+g.clock;
    });
  },2200);
});

</script>
