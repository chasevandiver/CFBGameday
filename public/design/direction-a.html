<style>
/* ── Direction A · Broadcast Scorebug ──────────────────────────────────────
   Palette (6 named values)
   --ink    #0A0E14  ground, truck-feed blue-black
   --panel  #141A24  raised band
   --chalk  #EDF1F7  primary text
   --dim    #8A97A8  metadata
   --live   #FF3B30  live state + losses
   --win    #3DD68C  covers
   No fixed brand accent — team colors supply the accent per game.
   Type: Anton (scores) / Inter Tight (body) / Roboto Mono (data)          */

:root{
  --ink:#0A0E14; --panel:#141A24; --chalk:#EDF1F7; --dim:#8A97A8;
  --live:#FF3B30; --win:#3DD68C;
  --line:rgba(237,241,247,.10);
  --nav-h:64px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px;
  --r1:6px; --r2:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark}
a,button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--ink); color:var(--chalk);
  font-family:"Inter Tight",system-ui,sans-serif;
  font-size:15px; line-height:1.4;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
  overflow-x:hidden;
}
.num{font-family:"Roboto Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums lining-nums}

/* ── header ───────────────────────────────────────────────────────────── */
header{
  position:sticky; top:0; z-index:20;
  background:rgba(10,14,20,.88); backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
.hbar{display:flex;align-items:center;gap:var(--s3);height:52px;padding:0 var(--s4)}
.mark{font-family:Anton,sans-serif;font-size:19px;letter-spacing:.02em;text-transform:uppercase}
.mark em{font-style:normal;color:var(--dim)}
.hspacer{flex:1}
.wk{
  display:flex;align-items:center;gap:var(--s2);height:36px;padding:0 var(--s3);
  border:1px solid var(--line);border-radius:var(--r1);background:var(--panel);
  font-size:13px;font-weight:600;color:var(--chalk)
}
.simbtn{
  min-height:44px;padding:0 var(--s3);border:1px solid var(--line);border-radius:var(--r1);
  background:transparent;color:var(--dim);font:600 12px "Inter Tight",sans-serif;cursor:pointer
}
.simbtn[aria-pressed="true"]{color:var(--live);border-color:rgba(255,59,48,.5)}

/* ── band ─────────────────────────────────────────────────────────────── */
.band{position:relative;overflow:hidden;border-bottom:1px solid var(--line);background:var(--panel)}
.band + .band{margin-top:2px}

/* SIGNATURE — the team-color wedge. Away and home colors meet on a slant
   behind the scorebug, the way a broadcast lower-third splits.            */
.wedge{position:absolute;inset:0;opacity:.42;pointer-events:none}
.wedge i{position:absolute;top:0;bottom:0;display:block}
.wedge .aw{left:0;width:66%;clip-path:polygon(0 0,100% 0,calc(100% - 38px) 100%,0 100%)}
.wedge .hm{right:0;width:42%;clip-path:polygon(38px 0,100% 0,100% 100%,0 100%)}
.band::after{ /* darkens the left so text stays legible over any team color */
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,rgba(10,14,20,.90) 0%,rgba(10,14,20,.64) 46%,rgba(10,14,20,.34) 100%)
}
.band > *:not(.wedge):not(.liveedge){position:relative;z-index:2}

.liveedge{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--live);z-index:3}
.band.is-live .liveedge{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.35}}

.brow{display:flex;align-items:center;gap:var(--s2);padding:var(--s3) var(--s4) 0}
.chips{display:flex;flex-wrap:wrap;gap:var(--s1);flex:1;min-width:0}
.chip{
  display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:var(--r1);
  font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap
}
.chip.live{background:rgba(255,59,48,.16);color:var(--live)}
.chip.gotw{background:rgba(237,241,247,.13);color:var(--chalk)}
.chip.edge{background:rgba(255,138,61,.16);color:#FFA463}
.chip.bigedge{background:#FF8A3D;color:#141A24}
.chip.cons{background:rgba(61,214,140,.15);color:var(--win)}
.chip.pick{background:rgba(237,241,247,.13);color:var(--chalk)}
.chip.upset{background:rgba(255,59,48,.16);color:var(--live)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.band.is-live .dot{animation:breathe 2.4s ease-in-out infinite}
.tv{font-size:11px;font-weight:600;color:var(--dim);white-space:nowrap;letter-spacing:.03em}

.teams{padding:var(--s2) var(--s4) 0}
.trow{display:flex;align-items:center;gap:var(--s2);min-height:44px}
.trow.lost{opacity:.5}
.poss{width:7px;height:7px;border-radius:50%;background:#FFC53D;flex:none}
.poss.off{background:transparent}
.rank{font-size:12px;font-weight:700;color:var(--dim);flex:none;min-width:22px}
.tname{
  font-family:Anton,sans-serif;font-size:21px;letter-spacing:.005em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1
}
.rec{font-size:11px;color:var(--dim);flex:none}
/* Fixed-width score box: no shift when 9 → 10, whatever Anton's metrics do. */
.score{
  font-family:Anton,sans-serif;font-size:40px;line-height:.95;
  width:74px;text-align:right;flex:none;font-variant-numeric:tabular-nums
}
.score.pre{font-size:15px;font-family:"Roboto Mono",monospace;color:var(--dim);font-weight:500}

.sit{
  margin:var(--s3) var(--s4) 0;padding:var(--s2) var(--s3);
  background:rgba(10,14,20,.55);border-left:2px solid rgba(237,241,247,.25);border-radius:0 var(--r1) var(--r1) 0
}
.sit b{font-size:13px;font-weight:700}
.sit p{font-size:12px;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.foot{
  display:flex;align-items:center;gap:var(--s4);
  margin-top:var(--s3);padding:var(--s2) var(--s4) var(--s3);
  border-top:1px solid var(--line)
}
.stat{display:flex;flex-direction:column;gap:1px;min-width:0}
.stat span{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.stat b{font-size:14px;font-weight:600}
.mv{font-size:11px;color:var(--dim);font-weight:500}
.mv.up{color:var(--win)} .mv.dn{color:var(--live)}
.crew{display:flex;gap:3px;margin-left:auto;flex:none;padding-left:var(--s2)}
.av{
  width:25px;height:25px;border-radius:50%;
  display:grid;place-items:center;font-size:10px;font-weight:700;
  background:#2A3444;color:var(--chalk)
}

.cover{display:flex;align-items:center;gap:var(--s2);padding:var(--s2) var(--s4);background:rgba(61,214,140,.10)}
.cover b{font-family:Anton,sans-serif;font-size:15px;letter-spacing:.04em;text-transform:uppercase;color:var(--win)}
.cover .m{color:var(--win);font-weight:600;font-size:13px}
.cover .s{font-size:11.5px;color:var(--dim);margin-left:auto;text-align:right}

/* ── bottom nav — the thumb zone ──────────────────────────────────────── */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:rgba(10,14,20,.94);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
  display:flex
}
nav a, nav button.navitem{
  border:0;background:transparent;cursor:pointer;font-family:inherit;
  flex:1;min-height:var(--nav-h);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  text-decoration:none;color:var(--dim);font-size:10.5px;font-weight:600;letter-spacing:.02em
}
nav a[aria-current="page"], nav .navitem[aria-current="page"]{color:var(--chalk)}
nav a[aria-current="page"], nav .navitem[aria-current="page"] svg{color:#FF8A3D}
nav svg{width:22px;height:22px}
.sheet{
  overscroll-behavior:contain;
  position:fixed;inset:auto 0 0 0;z-index:40;background:var(--panel);
  border-top:1px solid var(--line);border-radius:14px 14px 0 0;
  padding:var(--s4) var(--s4) calc(var(--s4) + env(safe-area-inset-bottom));
  transform:translateY(101%);transition:transform .22s ease
}
.sheet[data-open="true"]{transform:translateY(0)}
.sheet h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin-bottom:var(--s3)}
.sheet div{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--s2)}
.sheet a{
  min-height:48px;display:flex;align-items:center;padding:0 var(--s3);
  border:1px solid var(--line);border-radius:var(--r2);
  color:var(--chalk);text-decoration:none;font-size:14px;font-weight:600
}
.scrim{position:fixed;inset:0;z-index:35;background:rgba(10,14,20,.6);opacity:0;pointer-events:none;transition:opacity .22s}
.scrim[data-open="true"]{opacity:1;pointer-events:auto}

:focus-visible{outline:2px solid #FF8A3D;outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-9999px;top:0;z-index:60}
.skip:focus{left:8px;top:8px;padding:8px 12px;background:#FF8A3D;color:#0B0B09;border-radius:4px;font-weight:700;font-size:13px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<a class="skip" href="#main">Skip to scores</a>
<h1 class="sr">Direction A — Broadcast Scorebug — live scores, week 3</h1>

<header>
  <div class="hbar">
    <div class="mark">The CFB <em>Slate</em></div>
    <div class="hspacer"></div>
    <button class="simbtn" id="sim" aria-pressed="false">Sim</button>
    <div class="wk num">Wk 3</div>
  </div>
</header>

<main id="main"><div id="list"></div></main>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="More pages" aria-modal="false">
  <h2>More</h2>
  <div>
    <a href="#">Rankings</a><a href="#">Ratings</a>
    <a href="#">Standings</a><a href="#">Teams</a>
    <a href="#">Receipts</a><a href="#">Rules</a>
  </div>
</div>

<nav aria-label="Primary">
  <a href="#" aria-current="page"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="14" width="18" height="6" rx="1.5"/></svg>Slate</a>
  <a href="#"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17l5-6 4 4 8-9"/><path d="M16 6h5v5"/></svg>Edges</a>
  <a href="#"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v14H4z"/><path d="M8 9h8M8 13h5"/></svg>Ledger</a>
  <a href="#"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0112 0"/><circle cx="17" cy="9" r="2.5"/><path d="M15 20a5 5 0 016-4.6"/></svg>Crew</a>
  <button type="button" class="navitem" id="more" aria-expanded="false" aria-controls="sheet"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>More</button>
</nav>

<script>
/* Shared mock slate — field names mirror GameView in src/lib/slate.ts:69. */
window.SLATE={week:3,games:[
{id:401,status:"in_progress",featured:true,away:{school:"Ohio State",abbr:"OSU",rank:3,record:"2-0",color:"#BB0000"},home:{school:"Texas",abbr:"TEX",rank:7,record:"1-1",color:"#BF5700"},awayPoints:24,homePoints:21,period:4,clock:"2:47",possession:"away",situation:"3rd & 7 at TEX 34",lastPlay:"R. Henderson rush for 4 yds to the TEX 34",tv:"FOX",startTs:null,lines:{spread:-2.5,spreadOpen:-3.5,total:52.5,totalOpen:54},edge:3.1,edgeFlag:"EDGE",consensus:false,myPick:{side:"OSU",line:2.5},crewPicks:[{initials:"CV"},{initials:"DM"},{initials:"RT"},{initials:"JL"}],cover:null,upsetAlert:false},
{id:402,status:"in_progress",featured:false,away:{school:"Miami (OH)",abbr:"M-OH",rank:null,record:"0-2",color:"#C3142D"},home:{school:"Western Michigan",abbr:"WMU",rank:null,record:"1-1",color:"#6C4023"},awayPoints:10,homePoints:13,period:2,clock:"0:41",possession:"home",situation:"1st & 10 at WMU 41",lastPlay:"J. Bell pass complete to T. Owusu for 12 yds",tv:"ESPN+",startTs:null,lines:{spread:-6.5,spreadOpen:-7.5,total:48.5,totalOpen:47.5},edge:1.2,edgeFlag:null,consensus:false,myPick:null,crewPicks:[{initials:"DM"}],cover:null,upsetAlert:false},
{id:403,status:"in_progress",featured:false,away:{school:"Michigan",abbr:"MICH",rank:18,record:"1-1",color:"#00274C"},home:{school:"Oklahoma",abbr:"OU",rank:11,record:"2-0",color:"#841617"},awayPoints:17,homePoints:14,period:2,clock:null,possession:null,situation:null,lastPlay:null,tv:"NBC",startTs:null,lines:{spread:-7.5,spreadOpen:-6.5,total:45.5,totalOpen:46.5},edge:2.4,edgeFlag:null,consensus:false,myPick:{side:"MICH",line:7.5},crewPicks:[{initials:"CV"},{initials:"RT"}],cover:null,upsetAlert:true},
{id:404,status:"completed",featured:false,away:{school:"Alabama",abbr:"ALA",rank:5,record:"2-0",color:"#9E1B32"},home:{school:"Florida State",abbr:"FSU",rank:12,record:"2-0",color:"#782F40"},awayPoints:31,homePoints:27,period:4,clock:null,possession:null,situation:null,lastPlay:null,tv:"ABC",startTs:null,lines:{spread:3.5,spreadOpen:2.5,total:55.5,totalOpen:54.5},edge:1.8,edgeFlag:null,consensus:false,myPick:{side:"ALA",line:-3.5},crewPicks:[{initials:"CV"},{initials:"DM"},{initials:"JL"}],cover:{word:"Covered",margin:"+0.5",sub:"won by 4, laid 3.5",pick:"ALA -3.5"},upsetAlert:false},
{id:405,status:"scheduled",featured:false,away:{school:"LSU",abbr:"LSU",rank:9,record:"2-0",color:"#461D7C"},home:{school:"Clemson",abbr:"CLEM",rank:14,record:"1-1",color:"#F66733"},awayPoints:null,homePoints:null,period:null,clock:null,possession:null,situation:null,lastPlay:null,tv:"ABC",startTs:"7:00 PM",lines:{spread:-1.5,spreadOpen:-3.0,total:51.5,totalOpen:50.5},edge:2.9,edgeFlag:"EDGE",consensus:true,myPick:null,crewPicks:[{initials:"CV"},{initials:"DM"},{initials:"RT"},{initials:"JL"}],cover:null,upsetAlert:false},
{id:406,status:"scheduled",featured:false,away:{school:"App State",abbr:"APP",rank:null,record:"1-1",color:"#FFCC00"},home:{school:"Coastal Carolina",abbr:"CCU",rank:null,record:"2-0",color:"#007073"},awayPoints:null,homePoints:null,period:null,clock:null,situation:null,lastPlay:null,possession:null,tv:null,startTs:"3:30 PM",lines:{spread:-9.5,spreadOpen:-8.5,total:55.5,totalOpen:56.5},edge:4.5,edgeFlag:"BIG_EDGE",consensus:false,myPick:null,crewPicks:[],cover:null,upsetAlert:false},
]};

var ord=function(p){return p===1?"1st":p===2?"2nd":p===3?"3rd":p===4?"4th":"OT"};
var sp=function(n){return n>0?"+"+n.toFixed(1):n.toFixed(1)};
var esc=function(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})};

function band(g){
  var live=g.status==="in_progress", done=g.status==="completed", pre=g.status==="scheduled";
  var half=live&&!g.clock;
  var aw=g.awayPoints, hm=g.homePoints;
  var awLost=done&&aw<hm, hmLost=done&&hm<aw;
  var mvd=(g.lines.spread-g.lines.spreadOpen);

  var chips="";
  if(live) chips+='<span class="chip live"><i class="dot"></i>'+(half?"Half":ord(g.period)+" "+g.clock)+'</span>';
  if(done) chips+='<span class="chip gotw">Final</span>';
  if(pre)  chips+='<span class="chip gotw">'+esc(g.startTs)+' ET</span>';
  if(g.featured) chips+='<span class="chip gotw">Game of the Week</span>';
  if(g.upsetAlert) chips+='<span class="chip upset">Upset alert</span>';
  if(g.edgeFlag==="BIG_EDGE") chips+='<span class="chip bigedge">Big Edge '+g.edge.toFixed(1)+'</span>';
  else if(g.edgeFlag==="EDGE") chips+='<span class="chip edge">Edge '+g.edge.toFixed(1)+'</span>';
  if(g.consensus) chips+='<span class="chip cons">Consensus</span>';
  if(g.myPick) chips+='<span class="chip pick">Picked '+esc(g.myPick.side)+'</span>';

  function trow(t,pts,lost,hasBall){
    return '<div class="trow'+(lost?" lost":"")+'">'
      +'<i class="poss'+(hasBall?"":" off")+'" aria-hidden="true"></i>'
      +'<span class="rank num">'+(t.rank?"#"+t.rank:"")+'</span>'
      +'<span class="tname">'+esc(t.school)+'</span>'
      +'<span class="rec num">'+esc(t.record)+'</span>'
      +'<span class="score">'+pts+'</span>'
      +'</div>';
  }
  // pregame shows the number that matters instead of a 0-0 score
  function preRow(t,isHome){
    var n=isHome?sp(g.lines.spread):sp(-g.lines.spread);
    return '<div class="trow">'
      +'<i class="poss off" aria-hidden="true"></i>'
      +'<span class="rank num">'+(t.rank?"#"+t.rank:"")+'</span>'
      +'<span class="tname">'+esc(t.school)+'</span>'
      +'<span class="rec num">'+esc(t.record)+'</span>'
      +'<span class="score pre num">'+n+'</span></div>';
  }

  return ''
  +'<article class="band'+(live?" is-live":"")+'" data-id="'+g.id+'">'
    +'<div class="wedge" aria-hidden="true"><i class="aw" style="background:'+g.away.color+'"></i><i class="hm" style="background:'+g.home.color+'"></i></div>'
    +(live?'<div class="liveedge" aria-hidden="true"></div>':'')
    +'<div class="brow"><div class="chips">'+chips+'</div>'+(g.tv?'<span class="tv">'+esc(g.tv)+'</span>':'<span class="tv">TBD</span>')+'</div>'
    +'<p class="sr" aria-live="polite">'+esc(g.away.abbr)+' '+(aw===null?"":aw)+', '+esc(g.home.abbr)+' '+(hm===null?"":hm)+'</p>'
    +'<div class="teams">'
      +(pre?preRow(g.away,false):trow(g.away,aw,awLost,g.possession==="away"))
      +(pre?preRow(g.home,true):trow(g.home,hm,hmLost,g.possession==="home"))
    +'</div>'
    +(g.situation?'<div class="sit"><b>'+esc(g.situation)+'</b><p>'+esc(g.lastPlay||"")+'</p></div>':'')
    +'<div class="foot">'
      +'<div class="stat"><span>Spread</span><b class="num">'+esc(g.home.abbr)+' '+sp(g.lines.spread)+'</b></div>'
      +'<div class="stat"><span>Total</span><b class="num">'+g.lines.total.toFixed(1)+'</b></div>'
      +'<div class="stat"><span>Move</span><b class="mv num '+(mvd<0?"dn":mvd>0?"up":"")+'">'+(mvd===0?"—":sp(mvd))+'</b></div>'
      +(g.crewPicks.length?'<div class="crew" title="'+g.crewPicks.length+' crew picks">'+g.crewPicks.map(function(c){return '<span class="av">'+esc(c.initials)+'</span>'}).join("")+'</div>':'')
    +'</div>'
    +(g.cover?'<div class="cover"><b>'+esc(g.cover.word)+'</b><span class="m num">'+esc(g.cover.margin)+'</span><span class="s">'+esc(g.cover.pick)+' · '+esc(g.cover.sub)+'</span></div>':'')
  +'</article>';
}

document.getElementById("list").innerHTML=window.SLATE.games.map(band).join("");

/* ── update-in-place demo ──────────────────────────────────────────────
   Rewrites only the score/clock text nodes — never re-renders the list —
   so scroll position and layout are provably untouched.                  */
var timer=null;
document.getElementById("sim").addEventListener("click",function(){
  var on=this.getAttribute("aria-pressed")==="true";
  this.setAttribute("aria-pressed",on?"false":"true");
  if(on){clearInterval(timer);timer=null;return}
  timer=setInterval(function(){
    window.SLATE.games.forEach(function(g){
      if(g.status!=="in_progress")return;
      if(Math.random()<.45) (Math.random()<.5?g.awayPoints+=(Math.random()<.5?3:7):g.homePoints+=(Math.random()<.5?3:7));
      if(g.clock){var p=g.clock.split(":"),s=(+p[0])*60+(+p[1])-13;if(s<0)s=899;g.clock=Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
      var el=document.querySelector('.band[data-id="'+g.id+'"]');
      if(!el)return;
      var sc=el.querySelectorAll(".score");
      if(sc[0])sc[0].textContent=g.awayPoints;
      if(sc[1])sc[1].textContent=g.homePoints;
      var lc=el.querySelector(".chip.live");
      if(lc&&g.clock)lc.innerHTML='<i class="dot"></i>'+ord(g.period)+" "+g.clock;
    });
  },2200);
});

var sheet=document.getElementById("sheet"),scrim=document.getElementById("scrim");
function close(){sheet.dataset.open="false";scrim.dataset.open="false";
  var m=document.getElementById("more");if(m)m.setAttribute("aria-expanded","false")}
document.getElementById("more").addEventListener("click",function(e){
  e.preventDefault();
  var open=sheet.dataset.open==="true";
  sheet.dataset.open=open?"false":"true";scrim.dataset.open=open?"false":"true";
  this.setAttribute("aria-expanded",open?"false":"true");
});
scrim.addEventListener("click",close);
document.addEventListener("keydown",function(e){if(e.key==="Escape")close()});
</script>
</body>
