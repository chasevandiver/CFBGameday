<style>
/* ── Direction E · Swiss Grid ──────────────────────────────────
   --ground #131416  ground     --chalk  #F2F3F5  primary text
   --panel  #1B1D20  blocks     --dim    #868A92  labels
   --rule   #2A2D32  hairlines  --accent #FF3B00  the single accent
   Type: Archivo 400/700 (all type) / DM Mono 400/500 (every number)
   Zero radius anywhere. One accent, used only for disagreement with the market.
*/

*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark;-webkit-text-size-adjust:100%;overflow-x:clip}
a,button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body{overflow-x:hidden;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-9999px;top:0;z-index:60}
.skip:focus{left:8px;top:8px;padding:10px 14px;background:var(--nav-accent);color:#0a0a0a;
  border-radius:4px;font-weight:700;font-size:13px}
:focus-visible{outline:2px solid var(--nav-accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}


nav[data-bottom-nav]{
  position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;
  background:var(--nav-bg);border-top:1px solid var(--nav-line);
  backdrop-filter:blur(14px);padding-bottom:env(safe-area-inset-bottom)
}
nav[data-bottom-nav] a,nav[data-bottom-nav] button{
  flex:1;min-height:var(--nav-h);border:0;background:transparent;cursor:pointer;
  font-family:inherit;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;text-decoration:none;color:var(--nav-dim);
  font-size:11px;font-weight:600;letter-spacing:.02em
}
nav[data-bottom-nav] [aria-current="page"]{color:var(--nav-on);box-shadow:inset 0 2px 0 var(--nav-accent)}
nav[data-bottom-nav] [aria-current="page"] svg{color:var(--nav-accent)}
nav[data-bottom-nav] svg{width:21px;height:21px}


:root{
  --ground:#131416; --panel:#1B1D20; --chalk:#F2F3F5; --dim:#868A92;
  --rule:#2A2D32; --accent:#FF3B00; --live:#FF3B00; --win:#4ADE80;
  --nav-h:64px; --nav-bg:rgba(19,20,22,.96); --nav-line:var(--rule);
  --nav-dim:var(--dim); --nav-on:var(--chalk); --nav-accent:var(--accent);
}
body{background:var(--ground);color:var(--chalk);font-family:Archivo,system-ui,sans-serif;
  font-size:14px;line-height:1.35}
.m{font-family:"DM Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums lining-nums}
.lab{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}

header{position:sticky;top:0;z-index:20;background:var(--ground);border-bottom:1px solid var(--rule);
  padding-top:env(safe-area-inset-top)}
.hbar{display:flex;align-items:center;gap:14px;height:50px;padding:0 14px}
.mark{font-weight:700;font-size:15px;letter-spacing:-.01em;text-transform:uppercase}
.mark i{font-style:normal;color:var(--accent)}
.sp{flex:1}
.sim{min-height:44px;padding:0 12px;border:1px solid var(--rule);background:transparent;color:var(--dim);
  font:700 11px Archivo,sans-serif;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
.sim[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}
.wk{font-family:"DM Mono",monospace;font-size:13px;font-weight:500}

.colhead{display:grid;grid-template-columns:30px 1fr 42px 58px;gap:8px;padding:6px 14px;
  border-bottom:1px solid var(--rule);background:var(--ground);position:sticky;
  top:calc(50px + env(safe-area-inset-top));z-index:15}
.colhead span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.colhead span:nth-child(3),.colhead span:nth-child(4){text-align:right}

.blk{border-bottom:1px solid var(--rule);padding:10px 0 0}
.blk.is-live{box-shadow:inset 3px 0 0 var(--accent)}
.grid{display:grid;grid-template-columns:30px 1fr 42px 58px;gap:8px;padding:0 14px;align-items:center}
/* the gutter number is the watchability score (spec §7), not decoration */
.w{grid-row:1/3;font-family:"DM Mono",monospace;font-size:19px;font-weight:500;color:var(--dim);
  align-self:start;line-height:1}
.w b{display:block;font-family:Archivo,sans-serif;font-size:8.5px;font-weight:700;letter-spacing:.1em;color:#5C5F66}
.tm{display:flex;align-items:baseline;gap:7px;min-width:0;min-height:30px}
.rk{font-family:"DM Mono",monospace;font-size:11px;color:var(--dim);flex:none;min-width:19px}
.rk:empty{display:none}
.nm{font-weight:700;font-size:15.5px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;min-width:0;flex:1}
.nm.lost{color:var(--dim)}
.rc{font-family:"DM Mono",monospace;font-size:10.5px;color:var(--dim);flex:none}
.ball{width:6px;height:6px;background:var(--accent);flex:none}
.sc{font-family:"DM Mono",monospace;font-size:21px;font-weight:500;text-align:right}
.sc.lost{color:var(--dim)}
.ln{font-family:"DM Mono",monospace;font-size:13px;text-align:right;color:var(--chalk)}
.ln small{display:block;font-size:11px;color:var(--dim)}

/* SIGNATURE — the four-systems matrix. Market on the left, then every rating
   system the app already syncs. A system that disagrees with the market is
   marked; all four marked is the spec §4 consensus, and the row underlines. */
.mx{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--rule);margin-top:10px}
.mx div{padding:7px 4px;text-align:center;border-left:1px solid var(--rule)}
.mx div:first-child{border-left:0;background:rgba(242,243,245,.04)}
.mx b{display:block;font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#5C5F66}
.mx span{font-family:"DM Mono",monospace;font-size:13px;font-weight:500}
.mx div.dis span{color:var(--accent)}
.mx.consensus{box-shadow:inset 0 -3px 0 var(--win)}
.mxnote{display:flex;gap:10px;padding:6px 14px;font-size:10.5px;color:var(--dim);
  border-top:1px solid var(--rule)}
.mxnote b{color:var(--chalk);font-weight:700}
.mxnote .cons{color:var(--win);font-weight:700}
.mxnote .mv{font-family:"DM Mono",monospace;margin-left:auto}
.mxnote .mv.good{color:var(--win)} .mxnote .mv.bad{color:var(--accent)}

.odds{display:grid;grid-template-columns:30px repeat(3,1fr);gap:0;border-top:1px solid var(--rule)}
.odds > span{display:grid;place-items:center;font-family:"DM Mono",monospace;font-size:10px;color:var(--dim)}
.cell{min-height:44px;border:0;border-left:1px solid var(--rule);background:transparent;color:var(--chalk);
  font-family:"DM Mono",monospace;font-size:13px;cursor:pointer}
.cell[aria-pressed="true"]{background:var(--accent);color:#131416;font-weight:500}
.meta{display:flex;flex-wrap:wrap;gap:10px;padding:8px 14px;font-size:10.5px;color:var(--dim);
  border-top:1px solid var(--rule)}
.meta .st{color:var(--chalk);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.meta .st.live{color:var(--accent)}
.meta .tv{margin-left:auto;font-family:"DM Mono",monospace}
.meta .sit{font-family:"DM Mono",monospace;color:var(--chalk)}
.cover{padding:8px 14px;border-top:1px solid var(--rule);background:rgba(74,222,128,.08);
  font-size:11px;color:var(--win);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.cover em{font-style:normal;color:var(--dim);font-weight:400;letter-spacing:0;text-transform:none;margin-left:8px}
.field{position:relative;height:8px;margin:0 14px 8px;background:#22252A}
.field i{position:absolute;top:0;bottom:0}
.ez{width:6%} .ez.l{left:0} .ez.r{right:0}
.bal{width:2px;background:var(--chalk)}
.rz{width:16%;right:6%;background:rgba(255,59,0,.45)}

,0.66,0.7,0.63,0.59,0.64,0.61,0.58,0.62],"lineHistory":[{"t":"Mon","v":-7.5},{"t":"Wed","v":-7},{"t":"Thu","v":-7},{"t":"Fri","v":-6.5},{"t":"Sat","v":-6.5}],"myPick":null,"crewPicks":[{"i":"DM","side":"away"}],"cover":null,"upsetAlert":false},{"id":403,"status":"in_progress","featured":false,"pinned":false,"away":{"school":"Michigan","abbr":"MICH","rank":18,"record":"1-1","color":"#00274C"},"home":{"school":"Oklahoma","abbr":"OU","rank":11,"record":"2-0","color":"#841617"},"awayPoints":17,"homePoints":14,"period":2,"clock":null,"possession":null,"situation":null,"down":null,"distance":null,"yardLine":null,"sideToken":null,"redZone":false,"lastPlay":null,"tv":"NBC","startTs":"7:00 PM","slot":"Primetime","lines":{"spread":-7.5,"spreadOpen":-6.5,"total":45.5,"totalOpen":46.5,"mlHome":-290,"mlAway":235},"ratings":{"model":-5.1,"sp":-6.2,"fpi":-4.9,"elo":-6.8},"watchability":78,"watchCount":41,"weather":{"tempF":84,"windMph":6},"homeWp":0.44,"wpHistory":[0.74,0.7,0.66,0.61,0.58,0.63,0.55,0.49,0.46,0.44],"lineHistory":[{"t":"Mon","v":-6.5},{"t":"Wed","v":-7},{"t":"Thu","v":-7},{"t":"Fri","v":-7.5},{"t":"Sat","v":-7.5}],"myPick":{"side":"away","label":"MICH","line":7.5},"crewPicks":[{"i":"CV","side":"away"},{"i":"RT","side":"away"}],"cover":null,"upsetAlert":true},{"id":404,"status":"completed","featured":false,"pinned":false,"away":{"school":"Alabama","abbr":"ALA","rank":5,"record":"2-0","color":"#9E1B32"},"home":{"school":"Florida State","abbr":"FSU","rank":12,"record":"2-0","color":"#782F40"},"awayPoints":31,"homePoints":27,"period":4,"clock":null,"possession":null,"situation":null,"down":null,"distance":null,"yardLine":null,"sideToken":null,"redZone":false,"lastPlay":null,"tv":"ABC","startTs":"12:00 PM","slot":"Noon","lines":{"spread":3.5,"spreadOpen":2.5,"total":55.5,"totalOpen":54.5,"mlHome":145,"mlAway":-170},"ratings":{"model":1.7,"sp":4.2,"fpi":2.9,"elo":3.1},"watchability":71,"watchCount":52,"weather":{"tempF":88,"windMph":4},"homeWp":0,"wpHistory":[0.42,0.47,0.39,0.44,0.36,0.3,0.35,0.22,0.28,0.14,0.06,0],"lineHistory":[{"t":"Mon","v":2.5},{"t":"Wed","v":3},{"t":"Thu","v":3},{"t":"Fri","v":3.5},{"t":"Sat","v":3.5}],"myPick":{"side":"away","label":"ALA","line":-3.5},"crewPicks":[{"i":"CV","side":"away"},{"i":"DM","side":"home"},{"i":"JL","side":"away"}],"cover":{"word":"Covered","margin":"+0.5","sub":"won by 4, laid 3.5","pick":"ALA -3.5","result":"win"},"upsetAlert":false},{"id":405,"status":"scheduled","featured":false,"pinned":false,"away":{"school":"LSU","abbr":"LSU","rank":9,"record":"2-0","color":"#461D7C"},"home":{"school":"Clemson","abbr":"CLEM","rank":14,"record":"1-1","color":"#F66733"},"awayPoints":null,"homePoints":null,"period":null,"clock":null,"possession":null,"situation":null,"down":null,"distance":null,"yardLine":null,"sideToken":null,"redZone":false,"lastPlay":null,"tv":"ABC","startTs":"7:00 PM","slot":"Primetime","lines":{"spread":-1.5,"spreadOpen":-3,"total":51.5,"totalOpen":50.5,"mlHome":-125,"mlAway":105},"ratings":{"model":-4.4,"sp":-3.8,"fpi":-5.1,"elo":-4},"watchability":88,"watchCount":63,"weather":{"tempF":74,"windMph":3},"homeWp":null,"wpHistory":null,"lineHistory":[{"t":"Mon","v":-3},{"t":"Tue","v":-2.5},{"t":"Wed","v":-2.5},{"t":"Thu","v":-2},{"t":"Fri","v":-1.5},{"t":"Sat","v":-1.5}],"myPick":null,"crewPicks":[{"i":"CV","side":"away"},{"i":"DM","side":"away"},{"i":"RT","side":"away"},{"i":"JL","side":"away"}],"cover":null,"upsetAlert":false},{"id":406,"status":"scheduled","featured":false,"pinned":false,"away":{"school":"App State","abbr":"APP","rank":null,"record":"1-1","color":"#FFCC00"},"home":{"school":"Coastal Carolina","abbr":"CCU","rank":null,"record":"2-0","color":"#007073"},"awayPoints":null,"homePoints":null,"period":null,"clock":null,"possession":null,"situation":null,"down":null,"distance":null,"yardLine":null,"sideToken":null,"redZone":false,"lastPlay":null,"tv":null,"startTs":"10:30 PM","slot":"Late","lines":{"spread":-9.5,"spreadOpen":-8.5,"total":55.5,"totalOpen":56.5,"mlHome":-380,"mlAway":300},"ratings":{"model":-14,"sp":-13.1,"fpi":-8.9,"elo":-13.6},"watchability":42,"watchCount":3,"weather":{"tempF":79,"windMph":11},"homeWp":null,"wpHistory":null,"lineHistory":[{"t":"Mon","v":-8.5},{"t":"Wed","v":-9},{"t":"Thu","v":-9},{"t":"Fri","v":-9.5},{"t":"Sat","v":-9.5}],"myPick":null,"crewPicks":[],"cover":null,"upsetAlert":false}]};

var ord=function(p){return p===1?"1st":p===2?"2nd":p===3?"3rd":p===4?"4th":"OT"};
var sp=function(n){return n===null?"–":(n>0?"+":"")+n.toFixed(1)};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
var isLive=function(g){return g.status==="in_progress"};
var isDone=function(g){return g.status==="completed"};
var isPre=function(g){return g.status==="scheduled"};
var teamSpread=function(g,side){return side==="home"?g.lines.spread:-g.lines.spread};
var ml=function(g,side){var v=side==="home"?g.lines.mlHome:g.lines.mlAway;return v===null?"–":(v>0?"+":"")+v};

/* The model's edge, in points, and which side it lands on. */
var edgeOf=function(g){
  var d=g.ratings.model-g.lines.spread;
  return { pts:Math.abs(d), side: d>0?"away":"home" };
};
var edgeFlag=function(g){var e=edgeOf(g).pts;return e>=4?"BIG":e>=2.5?"EDGE":null};

/* spec §4 consensus: model AND SP+ AND FPI AND Elo all disagree with the
   line in the same direction. Computed, not hardcoded. */
var consensusOf=function(g){
  var m=g.lines.spread, r=g.ratings;
  var v=[r.model,r.sp,r.fpi,r.elo];
  if(v.every(function(x){return x>m})) return "away";
  if(v.every(function(x){return x<m})) return "home";
  return null;
};

/* Movement coloured against the model's side, not by direction. Fixes the
   meaningless green/red in chips.tsx:105-119 — green means "moving your way". */
var moveOf=function(g){
  var d=g.lines.spread-g.lines.spreadOpen;
  if(d===0) return { pts:0, label:"—", tone:"flat" };
  var towards = d>0 ? "away" : "home";
  var side = g.myPick ? g.myPick.side : edgeOf(g).side;
  return { pts:Math.abs(d), label:(d>0?"+":"")+d.toFixed(1), tone: towards===side?"good":"bad", towards:towards };
};

var sideLabel=function(g,s){return s==="home"?g.home.abbr:s==="away"?g.away.abbr:s};
/* True when this rating leans the same way the model does, by a real margin. */
var leansWith=function(g,v){
  var m=g.lines.spread;
  return Math.abs(v-m)>=0.5 && (v>m)===(g.ratings.model>m);
};
var crewSplit=function(g){
  var a=g.crewPicks.filter(function(c){return c.side==="away"}).length;
  return { away:a, home:g.crewPicks.length-a };
};

/* Points → an SVG polyline inside a w×h box. */
var poly=function(vals,w,h,pad){
  pad=pad||0;
  if(!vals||vals.length<2) return "";
  var lo=Math.min.apply(null,vals), hi=Math.max.apply(null,vals), r=(hi-lo)||1;
  return vals.map(function(v,i){
    var x=(i/(vals.length-1))*w;
    var y=pad+(1-(v-lo)/r)*(h-pad*2);
    return x.toFixed(1)+","+y.toFixed(1);
  }).join(" ");
};


function matrix(g){
  var m=g.lines.spread, r=g.ratings, con=consensusOf(g);
  var cells=[["MKT",m,false],["MOD",r.model,null],["SP+",r.sp,null],["FPI",r.fpi,null],["ELO",r.elo,null]];
  var tally=[r.model,r.sp,r.fpi,r.elo].filter(function(v){return (v>m)===(r.model>m)}).length;
  var lean=r.model>m?"away":"home";
  return '<div class="mx'+(con?" consensus":"")+'" role="img" aria-label="Market '+sp(m)+'. Model '+sp(r.model)+', SP plus '+sp(r.sp)+', FPI '+sp(r.fpi)+', Elo '+sp(r.elo)+'. '+(con?"All four disagree with the market":tally+" of 4 lean "+sideLabel(g,lean))+'">'
    + cells.map(function(c,i){
        return '<div class="'+(i>0&&leansWith(g,c[1])?"dis":"")+'"><b>'+c[0]+'</b><span>'+sp(c[1])+'</span></div>';
      }).join("")
  +'</div>'
  +'<div class="mxnote">'
    +(con?'<span class="cons">Consensus → '+esc(sideLabel(g,con))+'</span>'
         :'<span><b>'+tally+'/4</b> lean '+esc(sideLabel(g,lean))+'</span>')
    +'<span>Edge <b>'+edgeOf(g).pts.toFixed(1)+'</b> '+esc(sideLabel(g,edgeOf(g).side))+'</span>'
    +'<span class="mv '+moveOf(g).tone+'">'+moveOf(g).label+' vs open</span>'
  +'</div>';
}

function block(g){
  var live=isLive(g), done=isDone(g), pre=isPre(g), half=live&&!g.clock;
  var awLost=done&&g.awayPoints<g.homePoints, hmLost=done&&g.homePoints<g.awayPoints;
  var st = live ? (half?"Half":ord(g.period)+" "+g.clock) : done ? "Final" : g.startTs;
  function tm(t,pts,lost,ball,lnMain){
    return '<div class="tm'+'">'
        +'<span class="rk">'+(t.rank?"#"+t.rank:"")+'</span>'
        +'<span class="nm'+(lost?" lost":"")+'">'+esc(t.school)+'</span>'
        +(ball?'<i class="ball" aria-label="has possession"></i>':'')
        +'<span class="rc">'+esc(t.record)+'</span>'
      +'</div>'
      +'<div class="sc'+(lost?" lost":"")+'">'+(pre?"·":pts)+'</div>'
      +'<div class="ln">'+lnMain+'</div>';
  }
  return '<article class="blk'+(live?" is-live":"")+'" data-id="'+g.id+'">'
    +'<p class="sr" aria-live="polite">'+esc(g.away.abbr)+' '+(g.awayPoints===null?"":g.awayPoints)+', '+esc(g.home.abbr)+' '+(g.homePoints===null?"":g.homePoints)+'</p>'
    +'<div class="grid">'
      +'<div class="w">'+g.watchability+'<b>Watch</b></div>'
      +tm(g.away,g.awayPoints,awLost,g.possession==="away",sp(teamSpread(g,"away")))
      +tm(g.home,g.homePoints,hmLost,g.possession==="home",'<small>O '+g.lines.total.toFixed(1)+'</small>')
    +'</div>'
    +(g.yardLine!==null?'<div class="field" role="img" aria-label="Ball at the '+esc(g.sideToken)+' '+g.yardLine+'"><i class="ez l" style="background:'+g.away.color+'"></i><i class="ez r" style="background:'+g.home.color+'"></i>'+(g.redZone?'<i class="rz"></i>':'')+'<i class="bal" style="left:'+(g.sideToken===g.home.abbr?100-g.yardLine:g.yardLine)+'%"></i></div>':'')
    +matrix(g)
    +'<div class="odds">'
      +'<span>'+esc(g.away.abbr)+'</span>'
      +'<button class="cell" aria-pressed="false" aria-label="'+esc(g.away.abbr)+' '+sp(teamSpread(g,"away"))+' spread, add to bet slip">'+sp(teamSpread(g,"away"))+'</button>'
      +'<button class="cell" aria-pressed="false" aria-label="Over '+g.lines.total.toFixed(1)+', add to bet slip">O '+g.lines.total.toFixed(1)+'</button>'
      +'<button class="cell" aria-pressed="false" aria-label="'+esc(g.away.abbr)+' moneyline '+ml(g,"away")+', add to bet slip">'+ml(g,"away")+'</button>'
      +'<span>'+esc(g.home.abbr)+'</span>'
      +'<button class="cell" aria-pressed="false" aria-label="'+esc(g.home.abbr)+' '+sp(teamSpread(g,"home"))+' spread, add to bet slip">'+sp(teamSpread(g,"home"))+'</button>'
      +'<button class="cell" aria-pressed="false" aria-label="Under '+g.lines.total.toFixed(1)+', add to bet slip">U '+g.lines.total.toFixed(1)+'</button>'
      +'<button class="cell" aria-pressed="false" aria-label="'+esc(g.home.abbr)+' moneyline '+ml(g,"home")+', add to bet slip">'+ml(g,"home")+'</button>'
    +'</div>'
    +'<div class="meta">'
      +'<span class="st'+(live?" live":"")+'">'+esc(st)+'</span>'
      +(g.situation?'<span class="sit">'+esc(g.situation)+'</span>':'')
      +(g.upsetAlert?'<span class="st live">Upset</span>':'')
      +(g.pinned?'<span>Pinned</span>':'')
      +(g.myPick?'<span>You '+esc(g.myPick.label)+' '+sp(g.myPick.line)+'</span>':'')
      +(g.crewPicks.length?'<span>Crew '+crewSplit(g).away+'–'+crewSplit(g).home+'</span>':'')
      +'<span>'+g.watchCount+' watching</span>'
      +'<span class="tv">'+(g.tv?esc(g.tv):"TBD")+'</span>'
    +'</div>'
    +(g.lastPlay?'<div class="meta" style="border-top:0;padding-top:0"><span class="sit">'+esc(g.lastPlay)+'</span></div>':'')
    +(g.cover?'<div class="cover">'+esc(g.cover.word)+' '+esc(g.cover.margin)+'<em>'+esc(g.cover.pick)+' · '+esc(g.cover.sub)+'</em></div>':'')
  +'</article>';
}

document.getElementById("list").innerHTML=SLATE.games.map(block).join("");
document.querySelectorAll(".cell").forEach(function(c){
  c.addEventListener("click",function(){this.setAttribute("aria-pressed",this.getAttribute("aria-pressed")==="true"?"false":"true")});
});

var timer=null;
document.getElementById("sim").addEventListener("click",function(){
  var on=this.getAttribute("aria-pressed")==="true";
  this.setAttribute("aria-pressed",on?"false":"true");
  if(on){clearInterval(timer);timer=null;return}
  timer=setInterval(function(){
    SLATE.games.forEach(function(g){
      if(!isLive(g))return;
      if(Math.random()<.45){if(Math.random()<.5)g.awayPoints+=(Math.random()<.5?3:7);else g.homePoints+=(Math.random()<.5?3:7);}
      if(g.clock){var p=g.clock.split(":"),s=(+p[0])*60+(+p[1])-13;if(s<0)s=899;g.clock=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}
      var el=document.querySelector('.blk[data-id="'+g.id+'"]');if(!el)return;
      var sc=el.querySelectorAll(".sc");
      if(sc[0])sc[0].textContent=g.awayPoints;
      if(sc[1])sc[1].textContent=g.homePoints;
      var st=el.querySelector(".meta .st");
      if(st&&g.clock)st.textContent=ord(g.period)+" "+g.clock;
    });
  },2200);
});

</script>
