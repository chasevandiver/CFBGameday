<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Splash check</title>
<style>
  body { margin:0; padding:24px; background:#020A08; color:#F4EFE2;
         font:14px/1.5 ui-sans-serif, system-ui, sans-serif }
  h1 { font-size:15px; letter-spacing:.14em; text-transform:uppercase; color:#E8B93D; margin:0 0 12px }
  .big { font-family:ui-monospace,monospace; font-size:20px; color:#E8B93D; margin:12px 0 }
  table { border-collapse:collapse; width:100%; font-size:11px; font-family:ui-monospace,monospace }
  td { padding:4px 6px; border-top:1px solid rgba(244,239,226,.1); vertical-align:top }
  .yes { color:#35a46f; font-weight:700 }
  .no  { color:#6E8579 }
  p { color:#8FA79B; max-width:70ch }
</style>
<h1>Startup image check</h1>
<p>Open this on the device with the problem, in the orientation with the problem.
   If <b>no</b> row says MATCH, iOS has nothing to show and stretches a fallback —
   that is the bug, and the numbers below are what the device table is missing.</p>
<div class="big" id="dev"></div>
<table id="rows"></table>
<script>
  var entries = [{"href":"/splash/iphone-xr.png","media":"(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)","note":"iPhone 11, XR"},{"href":"/splash/iphone-x.png","media":"(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)","note":"iPhone 11 Pro, 12 mini, 13 mini, X, XS"},{"href":"/splash/iphone-xs-max.png","media":"(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)","note":"iPhone 11 Pro Max, XS Max"},{"href":"/splash/iphone-12.png","media":"(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)","note":"iPhone 12, 13, 14"},{"href":"/splash/iphone-12-pro-max.png","media":"(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)","note":"iPhone 12/13 Pro Max, 14 Plus"},{"href":"/splash/iphone-14-pro.png","media":"(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)","note":"iPhone 14 Pro, 15, 15 Pro, 16"},{"href":"/splash/iphone-14-pro-max.png","media":"(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)","note":"iPhone 14/15 Pro Max, 15 Plus, 16 Plus"},{"href":"/splash/iphone-16-pro.png","media":"(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)","note":"iPhone 16 Pro"},{"href":"/splash/iphone-16-pro-max.png","media":"(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)","note":"iPhone 16 Pro Max"},{"href":"/splash/ipad-97.png","media":"(device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)","note":"iPad 9.7\", iPad mini 4/5"},{"href":"/splash/ipad-97-landscape.png","media":"(device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)","note":"iPad 9.7\", iPad mini 4/5 (landscape)"},{"href":"/splash/ipad-102.png","media":"(device-width: 810px) and (device-height: 1080px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)","note":"iPad 7th–9th gen 10.2\""},{"href":"/splash/ipad-102-landscape.png","media":"(device-width: 810px) and (device-height: 1080px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)","note":"iPad 7th–9th gen 10.2\" (landscape)"},{"href":"/splash/ipad-105.png","media":"(device-width: 834px) and (device-height: 1112px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)","note":"iPad Pro 10.5\", iPad Air 3"},{"href":"/splash/ipad-105-landscape.png","media":"(device-width: 834px) and (device-height: 1112px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)","note":"iPad Pro 10.5\", iPad Air 3 (landscape)"},{"href":"/splash/ipad-mini-6.png","media":"(device-width: 744px) and (device-height: 1133px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)","note":"iPad mini 6, mini 7"},{"href":"/splash/ipad-mini-6-landscape.png","media":"(device-width: 744px) and (device-height: 1133px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)","note":"iPad mini 6, mini 7 (landscape)"},{"href":"/splash/ipad-109.png","media":"(device-width: 820px) and (device-height: 1180px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)","note":"iPad Air 10.9\", iPad 10th/11th gen"},{"href":"/splash/ipad-109-landscape.png","media":"(device-width: 820px) and (device-height: 1180px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)","note":"iPad Air 10.9\", iPad 10th/11th gen (landscape)"},{"href":"/splash/ipad-pro-11.png","media":"(device-width: 834px) and (device-height: 1194px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)","note":"iPad Pro 11\" 1st–4th gen"},{"href":"/splash/ipad-pro-11-landscape.png","media":"(device-width: 834px) and (device-height: 1194px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)","note":"iPad Pro 11\" 1st–4th gen (landscape)"},{"href":"/splash/ipad-pro-11-m4.png","media":"(device-width: 834px) and (device-height: 1210px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)","note":"iPad Pro 11\" M4, Air 11\" M2"},{"href":"/splash/ipad-pro-11-m4-landscape.png","media":"(device-width: 834px) and (device-height: 1210px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)","note":"iPad Pro 11\" M4, Air 11\" M2 (landscape)"},{"href":"/splash/ipad-pro-129.png","media":"(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)","note":"iPad Pro 12.9\", Air 13\" M2"},{"href":"/splash/ipad-pro-129-landscape.png","media":"(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)","note":"iPad Pro 12.9\", Air 13\" M2 (landscape)"},{"href":"/splash/ipad-pro-13-m4.png","media":"(device-width: 1032px) and (device-height: 1376px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)","note":"iPad Pro 13\" M4"},{"href":"/splash/ipad-pro-13-m4-landscape.png","media":"(device-width: 1032px) and (device-height: 1376px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)","note":"iPad Pro 13\" M4 (landscape)"}];
  var o = (window.screen.orientation && window.screen.orientation.type) || "unknown";
  document.getElementById("dev").textContent =
    "screen " + screen.width + "x" + screen.height +
    " · dpr " + window.devicePixelRatio +
    " · " + (window.matchMedia("(orientation: landscape)").matches ? "landscape" : "portrait") +
    " (" + o + ")";
  var html = "", hits = 0;
  entries.forEach(function (e) {
    var m = window.matchMedia(e.media).matches;
    if (m) hits++;
    html += "<tr><td class=" + (m ? "yes>MATCH" : "no>—") + "</td><td>" + e.note +
            "</td><td class=no>" + e.media.replace(/ and /g, "<br>and ") + "</td></tr>";
  });
  document.getElementById("rows").innerHTML =
    "<tr><td colspan=3 class=" + (hits ? "yes" : "no") + ">" + hits +
    " of " + entries.length + " matched</td></tr>" + html;
</script>
