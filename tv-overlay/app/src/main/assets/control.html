<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#100e0b">
<title>TV Overlay</title>
<style>
  :root { --bg:#100e0b; --card:#1c1914; --line:#2e2a22; --chalk:#f2eee6; --dim:#a0988c; --gold:#e8b84b; --live:#ff4b57; --ok:#5ac878; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; background:var(--bg); color:var(--chalk); font:16px/1.4 -apple-system, system-ui, sans-serif; padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 24px); }
  h1 { font-size:22px; margin:0; letter-spacing:.02em; }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.12em; color:var(--dim); margin:24px 0 10px; font-weight:600; }
  .top { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .pill { font-size:13px; padding:6px 10px; border-radius:999px; background:var(--card); border:1px solid var(--line); color:var(--dim); white-space:nowrap; }
  .pill.on { color:var(--chalk); border-color:color-mix(in srgb, var(--live) 50%, transparent); }
  .pill.on::before { content:""; display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--live); margin-right:6px; vertical-align:1px; }
  .sub { color:var(--dim); font-size:13px; margin-top:4px; }
  .warn { background:#3a1c1c; border:1px solid #6b2a2a; color:#ffd2d2; border-radius:12px; padding:12px; margin-top:14px; font-size:14px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  button { font:inherit; color:var(--chalk); background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 12px; min-height:52px; cursor:pointer; text-align:left; }
  button:active { transform:scale(.98); }
  button.active { border-color:var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
  .preset b { display:block; font-size:16px; }
  .preset span { display:block; color:var(--dim); font-size:12px; margin-top:2px; }
  .hide { width:100%; text-align:center; margin-top:10px; background:transparent; }
  .seg { display:flex; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:3px; gap:3px; }
  .seg button { flex:1; text-align:center; border:0; background:transparent; min-height:42px; padding:8px 4px; border-radius:9px; font-size:14px; color:var(--dim); }
  .seg button.active { background:var(--line); color:var(--chalk); box-shadow:none; }
  .row { margin-top:10px; }
  label { display:block; font-size:13px; color:var(--dim); margin-bottom:6px; }
  input[type=range] { width:100%; accent-color:var(--gold); }
  input[type=url], input[type=text] { width:100%; font:inherit; color:var(--chalk); background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; }
  .go { background:var(--gold); color:#16120a; font-weight:700; text-align:center; border:0; width:100%; margin-top:10px; }
  .list .item { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); }
  .list .item div { min-width:0; }
  .list .item small { display:block; color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .list button { min-height:40px; padding:8px 12px; font-size:14px; text-align:center; }
  .muted { color:var(--dim); font-size:13px; }
  .off { opacity:.45; pointer-events:none; }
  button:disabled { opacity:.5; }
</style>
</head>
<body>
  <div class="top">
    <div>
      <h1>TV Overlay</h1>
      <div class="sub" id="device">Connecting…</div>
    </div>
    <div class="pill" id="pill">Hidden</div>
  </div>
  <div class="warn" id="warn" hidden></div>

  <h2>Show</h2>
  <div class="grid" id="presets"></div>
  <button class="hide" id="hideBtn">Hide overlay</button>

  <h2>Layout</h2>
  <div class="seg" id="layout">
    <button data-v="ticker">Ticker strip</button>
    <button data-v="corner">Corner box</button>
  </div>
  <div class="row">
    <div class="seg" id="posTicker">
      <button data-v="top">Top</button>
      <button data-v="bottom">Bottom</button>
    </div>
    <div class="seg" id="posCorner">
      <button data-v="tl">Top left</button>
      <button data-v="tr">Top right</button>
      <button data-v="bl">Bottom left</button>
      <button data-v="br">Bottom right</button>
    </div>
  </div>
  <div class="row">
    <div class="seg" id="size">
      <button data-v="s">Small</button>
      <button data-v="m">Medium</button>
      <button data-v="l">Large</button>
    </div>
  </div>
  <div class="row">
    <label for="opacity">See-through <span id="opacityVal"></span></label>
    <input type="range" id="opacity" min="30" max="100" step="5">
  </div>
  <div class="row">
    <label for="zoom">Page zoom <span id="zoomVal"></span> <span class="muted">(lower fits more of a phone-sized site)</span></label>
    <input type="range" id="zoom" min="50" max="150" step="5">
  </div>

  <h2>Any page</h2>
  <input type="url" id="url" placeholder="https://your-site.vercel.app/tv" autocomplete="off" autocapitalize="off" spellcheck="false">
  <button class="go" id="showUrl">Show this page</button>

  <h2>Set up other TVs</h2>
  <p class="muted" style="margin-top:0">Amazon won't let a TV grant this app permission on itself, so this TV does it for the others. Each TV needs TV Overlay installed and ADB debugging on.</p>
  <button class="go" id="findBtn">Find TVs on this Wi-Fi</button>
  <div class="list" id="peers"></div>
  <div style="display:flex; gap:8px; margin-top:12px">
    <input type="text" id="peerIp" inputmode="decimal" placeholder="Or type a TV's IP, like 192.168.1.70" autocomplete="off">
    <button id="peerGo" style="min-width:84px; text-align:center">Grant</button>
  </div>
  <div class="warn" id="peerMsg" hidden></div>

  <h2>Saved</h2>
  <div class="list" id="list"></div>
  <input type="text" id="presetName" placeholder="Name, like Fairway Picks" style="margin-top:12px">
  <button class="go" id="savePreset">Save what's showing as a button</button>
  <p class="muted" style="margin-top:16px">Tip: add this page to your home screen so it opens like an app.</p>

<script>
  const $ = (id) => document.getElementById(id);
  let state = null;
  let busy = false;

  async function api(path, body) {
    const res = await fetch(path, body === undefined ? {} : {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error(await res.text());
    state = await res.json();
    render();
  }

  const show = (fields) => api("/api/show", fields).catch(alertErr);
  const alertErr = (e) => { $("warn").hidden = false; $("warn").textContent = "Couldn't reach the TV. " + (e.message || ""); };

  function seg(id, value, onPick) {
    for (const b of $(id).querySelectorAll("button")) {
      b.classList.toggle("active", b.dataset.v === value);
      b.onclick = () => onPick(b.dataset.v);
    }
  }

  const layoutName = (p) => p.layout === "corner" ? "Corner box" : "Ticker strip";

  function render() {
    const s = state;
    $("device").textContent = `${s.device} · ${s.ip ?? "?"}:${s.port}`;
    $("pill").textContent = s.visible ? "On screen" : "Hidden";
    $("pill").classList.toggle("on", s.visible);

    const warn = !s.canDraw
      ? "This TV doesn't have overlay permission yet. Amazon won't let a TV grant itself, so open this page for a different TV and use Set up other TVs. Meanwhile this TV can still set up the others below."
      : s.error;
    $("warn").hidden = !warn;
    if (warn) $("warn").textContent = warn;

    const grid = $("presets");
    grid.innerHTML = "";
    s.presets.forEach((p) => {
      const b = document.createElement("button");
      b.className = "preset";
      b.classList.toggle("active", s.visible && s.url === p.url);
      b.innerHTML = "<b></b><span></span>";
      b.querySelector("b").textContent = p.name;
      b.querySelector("span").textContent = layoutName(p);
      b.onclick = () => show({ url: p.url, layout: p.layout, position: p.position, size: p.size, zoom: p.zoom ?? 100 });
      grid.appendChild(b);
    });

    seg("layout", s.layout, (v) => show({ layout: v }));
    $("posTicker").hidden = s.layout !== "ticker";
    $("posCorner").hidden = s.layout !== "corner";
    seg("posTicker", s.position, (v) => show({ position: v }));
    seg("posCorner", s.position, (v) => show({ position: v }));
    seg("size", s.size, (v) => show({ size: v }));

    if (document.activeElement !== $("opacity")) $("opacity").value = s.opacity;
    if (document.activeElement !== $("zoom")) $("zoom").value = s.zoom;
    $("opacityVal").textContent = s.opacity + "%";
    $("zoomVal").textContent = s.zoom + "%";
    if (document.activeElement !== $("url") && !$("url").value) $("url").placeholder = s.url;

    const list = $("list");
    list.innerHTML = "";
    if (s.presets.length === 0) list.innerHTML = '<p class="muted">No saved buttons.</p>';
    s.presets.forEach((p, i) => {
      const row = document.createElement("div");
      row.className = "item";
      row.innerHTML = "<div><b></b><small></small></div>";
      row.querySelector("b").textContent = p.name;
      row.querySelector("small").textContent = p.url;
      const del = document.createElement("button");
      del.textContent = "Remove";
      del.onclick = () => {
        if (!confirm(`Remove ${p.name}?`)) return;
        api("/api/presets", s.presets.filter((_, j) => j !== i)).catch(alertErr);
      };
      row.appendChild(del);
      list.appendChild(row);
    });
  }

  $("hideBtn").onclick = () => api("/api/hide", {}).catch(alertErr);
  $("opacity").onchange = (e) => show({ opacity: Number(e.target.value) });
  $("opacity").oninput = (e) => ($("opacityVal").textContent = e.target.value + "%");
  $("zoom").onchange = (e) => show({ zoom: Number(e.target.value) });
  $("zoom").oninput = (e) => ($("zoomVal").textContent = e.target.value + "%");
  $("showUrl").onclick = () => {
    let u = $("url").value.trim();
    if (!u) return;
    if (!/^https?:\/\//i.test(u)) u = "https://" + u;
    show({ url: u });
  };
  $("savePreset").onclick = () => {
    const name = $("presetName").value.trim();
    if (!name || !state) return;
    const p = { name, url: state.url, layout: state.layout, position: state.position, size: state.size, zoom: state.zoom };
    api("/api/presets", [...state.presets, p]).then(() => ($("presetName").value = "")).catch(alertErr);
  };

  /* ── Set up other TVs ── */
  function peerMsg(text, good) {
    const m = $("peerMsg");
    m.hidden = false;
    m.textContent = text;
    m.style.background = good ? "#173a22" : "#3a1c1c";
    m.style.borderColor = good ? "#2a6b3a" : "#6b2a2a";
    m.style.color = good ? "#d2ffdc" : "#ffd2d2";
  }

  async function grantPeer(ip, btn) {
    if (btn) btn.disabled = true;
    peerMsg(`Go to the TV at ${ip} now. When it asks to allow debugging, check Always allow and pick OK. Waiting up to a minute…`, true);
    try {
      const res = await fetch("/api/grant-peer", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ ip }),
      });
      const r = await res.json();
      peerMsg(r.ok ? `${ip}: done. That TV can show overlays now.` : `${ip}: ${r.message}`, r.ok);
      if (r.ok) findPeers();
    } catch (e) {
      peerMsg("Lost touch with this TV while waiting. Try again.", false);
    }
    if (btn) btn.disabled = false;
  }

  async function findPeers() {
    const list = $("peers");
    $("findBtn").disabled = true;
    $("findBtn").textContent = "Looking…";
    list.innerHTML = "";
    try {
      const peers = await (await fetch("/api/peers")).json();
      if (peers.length === 0) {
        list.innerHTML = '<p class="muted">No other TVs found. Make sure TV Overlay has been opened once on them, or type an IP below.</p>';
      }
      peers.forEach((p) => {
        const row = document.createElement("div");
        row.className = "item";
        row.innerHTML = "<div><b></b><small></small></div>";
        row.querySelector("b").textContent = p.device || "Fire TV";
        row.querySelector("small").textContent = `${p.ip} · ${p.canDraw ? "ready" : "needs permission"}`;
        const b = document.createElement("button");
        b.textContent = p.canDraw ? "Open" : "Grant";
        b.onclick = () => (p.canDraw ? (location.href = `http://${p.ip}:7979/`) : grantPeer(p.ip, b));
        row.appendChild(b);
        list.appendChild(row);
      });
    } catch (e) {
      list.innerHTML = '<p class="muted">Search failed. Try again.</p>';
    }
    $("findBtn").disabled = false;
    $("findBtn").textContent = "Find TVs on this Wi-Fi";
  }

  $("findBtn").onclick = findPeers;
  $("peerGo").onclick = () => {
    const ip = $("peerIp").value.trim();
    if (ip) grantPeer(ip, $("peerGo"));
  };

  async function poll() {
    if (busy) return;
    busy = true;
    try { await api("/api/state"); $("warn").hidden = state.canDraw && !state.error; } catch (e) { alertErr(e); }
    busy = false;
  }
  poll();
  setInterval(poll, 5000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
</script>
</body>
</html>
